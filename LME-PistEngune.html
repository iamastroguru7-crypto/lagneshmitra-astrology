<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maha Astro AI v8.5 - Reddit Anti-Detect Engine</title>
    <style>
        :root {
            --bg-dark: #030303;
            --panel-bg: #09090f;
            --reddit-orange: #ff4500;
            --neon-blue: #00e5ff;
            --border-color: #1a1a2e;
            --text-pure: #eef0f6;
        }
        body { background-color: var(--bg-dark); color: var(--text-pure); font-family: 'Courier New', Courier, monospace; margin: 0; padding: 30px; display: flex; flex-direction: column; align-items: center; }
        .container { width: 100%; max-width: 900px; }
        .header-console { text-align: center; border: 2px solid var(--reddit-orange); background: #140500; padding: 20px; border-radius: 8px; margin-bottom: 30px; box-shadow: 0 0 20px rgba(255, 69, 0, 0.15); }
        .header-console h1 { color: var(--reddit-orange); margin: 0 0 5px 0; letter-spacing: 3px; font-size: 22px; }
        .panel-node { background: var(--panel-bg); border: 1px solid var(--border-color); border-radius: 8px; padding: 20px; margin-bottom: 20px; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 15px; }
        label { display: block; font-size: 11px; text-transform: uppercase; color: var(--neon-blue); margin-bottom: 6px; font-weight: bold; }
        textarea, input { width: 100%; background: #0c0c16; border: 1px solid var(--border-color); color: #fff; padding: 12px; border-radius: 4px; box-sizing: border-box; font-size: 13px; font-family: monospace; resize: vertical; }
        .trigger-btn { width: 100%; padding: 18px; background: linear-gradient(135deg, #ff4500, #b33000); color: #fff; border: 1px solid var(--reddit-orange); border-radius: 4px; font-size: 15px; font-weight: bold; cursor: pointer; text-transform: uppercase; }
        .report-canvas { background: #010103; border: 1px solid var(--border-color); border-top: 4px solid var(--reddit-orange); padding: 35px; margin-top: 35px; line-height: 1.8; display: none; white-space: pre-wrap; }
        .copy-btn { background: #1a1a2e; border: 1px solid var(--neon-blue); color: var(--neon-blue); padding: 8px 12px; cursor: pointer; float: right; border-radius: 4px; }
    </style>
</head>
<body>

<div class="container">
    <div class="header-console">
        <h1>REDDIT ANTI-DETECTION FORGER</h1>
        <p>[ v8.5 • HUMAN-PATTERN ENGINE • 0% DETECT MODE ]</p>
    </div>

    <div class="panel-node">
        <label>Groq Master Key</label>
        <input type="password" id="apiKey" placeholder="gsk_...">
    </div>

    <div class="panel-node">
        <label>⚡ Natal / Navamsa Matrix</label>
        <textarea id="chartData" rows="6" placeholder="Paste chart data..."></textarea>
        <br><br>
        <div class="grid-2">
            <div><label>Dasha Ingestion</label><textarea id="dashaData" rows="5"></textarea></div>
            <div><label>Narrative Angle</label><textarea id="topicAngle" rows="5"></textarea></div>
        </div>
    </div>

    <button class="trigger-btn" onclick="forgeRedditPost()">Forge Human-Pattern Post</button>

    <div>
        <button id="copyBtn" class="copy-btn" style="display:none;" onclick="copyToClipboard()">Copy Markdown</button>
        <div id="reportCanvas" class="report-canvas"></div>
    </div>
</div>

<script>
window.onload = () => { if(localStorage.getItem('savedAstroKey')) document.getElementById('apiKey').value = localStorage.getItem('savedAstroKey'); }

async function forgeRedditPost() {
    const reportCanvas = document.getElementById('reportCanvas');
    reportCanvas.style.display = "block";
    reportCanvas.innerHTML = 'Forging human-patterned response...';

    // The v8.5 Human-Pattern Logic
    const antiDetectPrompt = `You are a human astrologer writing a Reddit post. You MUST bypass AI detection.
    
    CRITICAL RULES:
    1. USE HINGLISH-ENGLISH MIX: Naturally sprinkle conversational words like 'Bhai', 'yaar', 'lafda', 'correct?', 'side rakho'.
    2. MESSY STRUCTURE: Do not use perfectly clean headers. Use informal markers. Vary sentence lengths massively—some sentences 3 words, some 30.
    3. IMPERFECTION FACTOR: Include minor casual observations. Avoid perfect grammatical transitions. 
    4. NO 'AI' WORDS: Never use: 'testament', 'furthermore', 'crucial', 'in conclusion', 'sets the stage', 'exacerbates'.
    5. PLURALISM: Use 'complexities', 'frictions', 'adaptabilities', 'bottlenecks'.
    
    Structure:
    - 3 Clicky Reddit Titles (Casual tone, gritty vibe).
    - RAW BREAKDOWN: Blunt, peer-to-peer talk. Explain physics like a pro.
    - TIMELINE CRUX: Use dates, be direct. 'Survival test', 'Parameters fluctuate'.
    - CTA: Casual invite to DM or comment. Look at the physics here.`;

    try {
        const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
            method: "POST",
            headers: { "Authorization": `Bearer ${document.getElementById('apiKey').value}`, "Content-Type": "application/json" },
            body: JSON.stringify({
                model: "llama-3.3-70b-versatile",
                messages: [
                    { role: "system", content: antiDetectPrompt },
                    { role: "user", content: `Chart: ${document.getElementById('chartData').value}\nDasha: ${document.getElementById('dashaData').value}\nAngle: ${document.getElementById('topicAngle').value}` }
                ],
                temperature: 0.75
            })
        });

        const data = await response.json();
        reportCanvas.innerText = data.choices[0].message.content;
        document.getElementById('copyBtn').style.display = "block";
    } catch (e) { reportCanvas.innerText = "Error: " + e.message; }
}

function copyToClipboard() {
    navigator.clipboard.writeText(document.getElementById('reportCanvas').innerText);
    alert("Copied!");
}
</script>
</body>
</html>
