<body>

<header>

<div class="logo">

ATC Central Command

</div>

<nav>

<a href="#">Dashboard</a>

<a href="#">Posts</a>

<a href="#">Reports</a>

<a href="#">Analytics</a>

<a href="#">Users</a>

</nav>

</header>

<div class="container">

<div class="page-title">

<h1>

Content Publishing Engine

</h1>

<p>

Publish once • Firestore • Knowledge Hub • Google Ready

</p>

</div>

<div class="glass">

<!-- PART 2 FORM YAHAN SE START HOGA -->

<h2 style="margin-bottom:25px;color:#FFD700;font-family:'Cinzel',serif;">
📝 New Knowledge Hub Post
</h2>

<form id="postForm">

<label>Post Title</label>
<input type="text" id="title" placeholder="Why a Horoscope Cannot Be Judged Through Just One House">

<label>SEO Slug</label>
<input type="text" id="slug" placeholder="why-a-horoscope-cannot-be-judged-through-just-one-house">

<label>Category</label>

<select id="category">

<option>General Astrology</option>
<option>Planets</option>
<option>Houses</option>
<option>Yogas</option>
<option>Career</option>
<option>Marriage</option>
<option>Health</option>
<option>Spirituality</option>

</select>

<label>Post ID</label>
<input type="text" id="postId" placeholder="LMP000001">

<label>Featured Image URL</label>
<input type="text" id="featuredImage" placeholder="https://">

<label>Short Description</label>

<textarea
id="shortDescription"
rows="4"
placeholder="Brief introduction..."></textarea>

<label>Full Article</label>

<textarea
id="content"
rows="16"
placeholder="Write complete article here..."></textarea>

<label>Keywords</label>

<input
type="text"
id="keywords"
placeholder="vedic astrology, horoscope, planets">

<label>Meta Description</label>

<textarea
id="metaDescription"
rows="3"
placeholder="SEO Meta Description"></textarea>

<div class="options">

<label>

<input type="checkbox" id="featured">

Featured Post

</label>

<label>

<input type="checkbox" id="allowComments" checked>

Allow Comments

</label>

<label>

<input type="checkbox" id="googleIndex" checked>

Index on Google

</label>

</div>

<div class="buttons">

<button
type="button"
id="previewBtn">

👁 Preview

</button>

<button
type="submit"
id="publishBtn">

🚀 Publish

</button>

</div>

</form>

</div>

</div>



<script type="module">

import { db } from "./firebase.js";

import {

collection,
doc,
setDoc,
serverTimestamp

}

from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";


const form=document.getElementById("postForm");

form.addEventListener("submit",async(e)=>{

e.preventDefault();

const postId=document.getElementById("postId").value.trim();

if(postId===""){

alert("Enter Post ID");

return;

}

try{

await setDoc(

doc(db,"Posts",postId),

{

postId:postId,

title:document.getElementById("title").value,

slug:document.getElementById("slug").value,

category:document.getElementById("category").value,

featuredImage:document.getElementById("featuredImage").value,

shortDescription:document.getElementById("shortDescription").value,

content:document.getElementById("content").value,

keywords:document.getElementById("keywords").value,

metaDescription:document.getElementById("metaDescription").value,

featured:document.getElementById("featured").checked,

allowComments:document.getElementById("allowComments").checked,

googleIndex:document.getElementById("googleIndex").checked,

status:"Published",

views:0,

likes:0,

shares:0,

downloads:0,

commentsCount:0,

redditViews:0,

redditUpvotes:0,

redditShares:0,

reportCount:0,

createdAt:serverTimestamp(),

updatedAt:serverTimestamp()

}

);

alert("🚀 Post Published Successfully!");

form.reset();

}

catch(error){

console.error(error);

alert("Publish Failed!");

}

});

</script>

</body>
