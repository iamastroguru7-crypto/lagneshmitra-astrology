<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ATCCCO CMS | LagneshMitra Internal</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:#0d1117;
    color:#ffffff;
    padding:30px;
}

.container{
    width:95%;
    max-width:1500px;
    margin:auto;
}

h1{
    font-size:34px;
    color:#f5c542;
    margin-bottom:8px;
}

p{
    color:#c9d1d9;
    margin-bottom:20px;
}

hr{
    border:none;
    height:1px;
    background:#30363d;
    margin:25px 0;
}

.card{
    background:#161b22;
    border:1px solid #30363d;
    border-radius:12px;
    padding:25px;
    margin-bottom:25px;
}

.card h2{
    color:#f5c542;
    margin-bottom:20px;
}

label{
    display:block;
    margin-top:15px;
    margin-bottom:8px;
    font-weight:bold;
    color:#d2d2d2;
}

input,
textarea,
select{
    width:100%;
    padding:12px;
    background:#0d1117;
    color:white;
    border:1px solid #444;
    border-radius:8px;
    font-size:15px;
    outline:none;
}

input:focus,
textarea:focus,
select:focus{
    border-color:#f5c542;
}

textarea{
    resize:vertical;
}

button{
    background:#f5c542;
    color:#000;
    border:none;
    padding:12px 24px;
    border-radius:8px;
    cursor:pointer;
    font-size:15px;
    font-weight:bold;
    margin-top:15px;
    margin-right:10px;
    transition:0.3s;
}

button:hover{
    background:#ffd95b;
}

.actions{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
}

table{
    width:100%;
    border-collapse:collapse;
    margin-top:20px;
}

table th{
    background:#21262d;
    border:1px solid #30363d;
    padding:12px;
    text-align:left;
}

table td{
    border:1px solid #30363d;
    padding:12px;
}

@media(max-width:768px){

.container{
    width:100%;
}

.actions{
    flex-direction:column;
}

button{
    width:100%;
}

}

</style>

</head>

<body>

<div class="container">

<h1>ATCCCO CMS</h1>

<p>AI Powered Content Management System</p>

<hr>

<div class="card">

<h2>Create New Article</h2>

<label>Title</label>
<input type="text" id="title" placeholder="Enter Article Title">

<label>Category</label>

<select id="category">

<option value="">Select Category</option>

<option>General Astrology</option>
<option>Marriage</option>
<option>Career</option>
<option>Love Compatibility</option>
<option>Health</option>
<option>Finance</option>
<option>Business</option>
<option>Education</option>
<option>Moon</option>
<option>Sun</option>
<option>Mars</option>
<option>Mercury</option>
<option>Jupiter</option>
<option>Venus</option>
<option>Saturn</option>
<option>Rahu</option>
<option>Ketu</option>
<option>Transits</option>
<option>Dasha</option>
<option>Nakshatra</option>
<option>Remedies</option>

</select>

<label>Keywords</label>
<input type="text" id="keywords" placeholder="venus, marriage, astrology">

<label>Short Description</label>
<textarea id="shortDescription" rows="3"></textarea>

<label>Meta Description</label>
<textarea id="metaDescription" rows="3"></textarea>

<label>Slug</label>
<input type="text" id="slug" placeholder="love-marriage-astrology">

<label>Featured Image URL</label>
<input type="text" id="featuredImage" placeholder="https://">

<label>Article Content</label>
<textarea id="content" rows="18"></textarea>

<div class="actions">

<button id="saveBtn">
💾 Save
</button>

<button id="updateBtn">
✏ Update
</button>

<button id="deleteBtn">
🗑 Delete
</button>

<button id="clearBtn">
🧹 Clear
</button>

</div>

</div>

<div class="card">

<h2>Recent Posts</h2>

<div id="postsContainer">

No Posts Available

</div>

</div>

</div>

<script type="module">


alert("Step 1");


import { db } from "./firebase.js";

alert("Step 2");

</script>

</script>

</body>

</html>
