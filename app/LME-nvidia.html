<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>War-Level Astrology Humanizer</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #000; color: #fff; font-family: monospace; padding: 20px; }
        .container { max-width: 800px; background: #111; padding: 20px; border: 1px solid #333; }
        #thinking { color: #888; font-size: 0.9em; border-bottom: 1px dashed #444; margin-bottom: 10px; padding-bottom: 10px; }
        #output { color: #0f0; white-space: pre-wrap; font-size: 1.1em; }
    </style>
</head>
<body>

<div class="container">
    <h3 class="text-center">NVIDIA Nemotron Morphing Engine</h3>
    <input type="password" id="apiKey" class="form-control mb-2" placeholder="Enter NVIDIA API Key...">
    <textarea id="inputText" class="form-control mb-2" rows="5" placeholder="Enter chart details (e.g. Kanya Lagna, Ketu Mahadasha...)"></textarea>
    <button class="btn btn-danger w-100" onclick="startGeneration()">GENERATE HUMAN REPORT</button>
    
    <div id="thinking" class="mt-3">Thinking process...</div>
    <div id="output" class="mt-3"></div>
</div>

<script>
    async function startGeneration() {
        const key = document.getElementById('apiKey').value;
        const text = document.getElementById('inputText').value;
        const outDiv = document.getElementById('output');
        const thinkDiv = document.getElementById('thinking');
        
        outDiv.innerText = ""; thinkDiv.innerText = "Thinking...";

        const response = await fetch("https://integrate.api.nvidia.com/v1/chat/completions", {
            method: 'POST',
            headers: { 
                'Authorization': `Bearer ${key}`,
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                model: "nvidia/nemotron-3-ultra-550b-a55b",
                messages: [{
                    role: "system",
                    content: "You are a human analyst. Write messy, real-time astrology notes. 1. Use lowercase. 2. Use Present Continuous (is evolving, are shifting). 3. Force plural endings (patterns, stars, energies, vibes). 4. Use '...' for flow. 5. NO AI PHRASES. 6. No markdown."
                }, { role: "user", content: text }],
                temperature: 1.0,
                extra_body: { "chat_template_kwargs": { "enable_thinking": true }, "reasoning_budget": 16384 },
                stream: true
            })
        });

        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        
        while (true) {
            const { done, value } = await reader.read();
            if (done) break;
            const chunk = decoder.decode(value);
            const lines = chunk.split('\n');
            
            for (const line of lines) {
                if (line.startsWith('data: ')) {
                    const data = JSON.parse(line.slice(6));
                    const delta = data.choices[0].delta;
                    
                    if (delta.reasoning_content) thinkDiv.innerText += delta.reasoning_content;
                    if (delta.content) outDiv.innerText += delta.content;
                }
            }
        }
    }
</script>
</body>
</html>
