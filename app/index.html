<!DOCTYPE html>
<html>
<head>
    <title>Gemini Engine</title>
</head>
<body>
    <div id="chat-container"></div>
    <input type="text" id="userInput" placeholder="Ask something...">
    <button id="sendBtn">Send</button>

    <script>
        // Apni 'Aq...' wali key yahan rakho
        const API_KEY = "AQ.Ab8RN6KDaTb3piWYu-tawwGcLrxKQsPggimr5VW_w4IOrZn7HQ";
        
        async function askGemini() {
            const userInput = document.getElementById("userInput").value;
            const chatContainer = document.getElementById("chat-container");

            // URL format mein 'key=' parameter use karo
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`;

            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: userInput }] }]
                    })
                });

                const data = await response.json();

                if (data.error) {
                    // Agar abhi bhi error aaya, toh samajh lena ki yeh key browser ke liye nahi bani hai
                    alert("API Error: " + data.error.message);
                } else {
                    const text = data.candidates[0].content.parts[0].text;
                    chatContainer.innerHTML += `<p><b>Gemini:</b> ${text}</p>`;
                }
            } catch (error) {
                alert("Connection Error: " + error.message);
            }
        }

        document.getElementById("sendBtn").onclick = askGemini;
    </script>
</body>
</html>
