<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Zero-GPT Bypass Engine</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #0f0f0f; color: #eee; padding: 20px; font-family: sans-serif; }
        .container { max-width: 700px; background: #1a1a1a; padding: 25px; border-radius: 12px; border: 1px solid #333; }
        textarea { background: #000; color: #0f0; border: 1px solid #444; width: 100%; padding: 10px; border-radius: 6px; }
        button { background: #007bff; border: none; padding: 12px; width: 100%; color: white; font-weight: bold; margin-top: 10px; border-radius: 6px; }
        #result { background: #000; border-left: 4px solid #007bff; padding: 15px; margin-top: 20px; white-space: pre-wrap; }
    </style>
</head>
<body>

<div class="container">
    <h3 class="text-center">Zero-GPT Humanizer</h3>
    <input type="password" id="apiKey" class="form-control mb-2" placeholder="Groq API Key (gsk_...)">
    <textarea id="inputText" rows="6" placeholder="Paste your text here..."></textarea>
    <button onclick="processText()">Bypass Detection & Rewrite</button>
    
    <div id="result" class="d-none"></div>
</div>

<script>
    async function processText() {
        const key = document.getElementById('apiKey').value;
        const text = document.getElementById('inputText').value;
        const resultDiv = document.getElementById('result');
        
        if(!key || !text) return alert("Key aur text dono daal!");
        
        resultDiv.classList.remove('d-none');
        resultDiv.innerText = "Analyzing burstiness and restructuring...";
        
        const systemPrompt = `You are a professional human editor. 
        TASK: Rewrite the provided text to bypass AI detectors by maximizing 'burstiness' (mixing sentence lengths) while keeping the EXACT original meaning, facts, and logical sequence intact. 
        RULES:
        1. NO MEANING CHANGE: Every fact must remain accurate.
        2. BURSTINESS: Use a mix of very short, punchy sentences (3-5 words) and longer, fluid ones.
        3. VOCABULARY: Use simple, natural language. Eliminate 'AI-buzzwords' like 'unprecedented', 'fostering', 'pivotal'.
        4. STRUCTURE: Use dashes (-) or commas to break up monotonous flow.
        5. OUTPUT: Return ONLY the final rewritten text. No introductions or explanations.`;

        try {
            const res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                method: 'POST',
                headers: { 'Authorization': `Bearer ${key}`, 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    model: "llama-3.3-70b-versatile",
                    temperature: 0.6,
                    messages: [{ role: "system", content: systemPrompt }, { role: "user", content: text }]
                })
            });
            const data = await res.json();
            resultDiv.innerText = data.choices[0].message.content;
        } catch (e) {
            resultDiv.innerText = "Error: " + e.message;
        }
    }
</script>
</body>
</html>
