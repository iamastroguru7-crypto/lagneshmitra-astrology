<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        body { font-family: sans-serif; padding: 20px; max-width: 600px; margin: auto; }
        .box { margin-bottom: 15px; }
        textarea, select, input { width: 100%; padding: 10px; margin-top: 5px; box-sizing: border-box; }
        #output { border: 1px solid #ccc; padding: 10px; min-height: 100px; margin-top: 20px; background: #f9f9f9; }
    </style>
</head>
<body>

    <h2>AI Multi-Engine Tester</h2>

    <!-- Option Box -->
    <div class="box">
        <label>Select AI Engine:</label>
        <select id="engineSelect">
            <option value="gsk">GSK (Gemini)</option>
            <option value="openai">OpenAI (GPT)</option>
        </select>
    </div>

    <!-- Key Input Box -->
    <div class="box">
        <label>Enter API Key:</label>
        <input type="password" id="apiKey" placeholder="Paste your API key here...">
    </div>

    <!-- User Input -->
    <textarea id="userInput" rows="4" placeholder="Type your prompt here..."></textarea>
    <button id="sendBtn" style="margin-top:10px; width:100%; padding:10px; cursor:pointer;">Generate Output</button>

    <!-- Output Box -->
    <div id="output">Output will appear here...</div>

    <script>
        document.getElementById('sendBtn').addEventListener('click', async () => {
            const engine = document.getElementById('engineSelect').value;
            const key = document.getElementById('apiKey').value;
            const prompt = document.getElementById('userInput').value;
            const output = document.getElementById('output');

            if (!key || !prompt) return alert("Key aur Prompt dono daal!");

            output.innerText = "Thinking...";

            try {
                if (engine === 'openai') {
                    const res = await fetch("https://api.openai.com/v1/chat/completions", {
                        method: "POST",
                        headers: { "Content-Type": "application/json", "Authorization": `Bearer ${key}` },
                        body: JSON.stringify({ model: "gpt-4o", messages: [{ role: "user", content: prompt }] })
                    });
                    const data = await res.json();
                    output.innerText = data.choices[0].message.content;

                } else if (engine === 'gsk') {
                    // GSK (Gemini) API Call
                    const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${key}`;
                    const res = await fetch(url, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                    });
                    const data = await res.json();
                    output.innerText = data.candidates[0].content.parts[0].text;
                }
            } catch (err) {
                output.innerText = "Error: " + err.message;
            }
        });
    </script>
</body>
</html>
