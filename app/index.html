<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Astrology Morphing Engine</title>
    <style>
        body { background: #050505; color: #00ff41; font-family: 'Courier New', monospace; padding: 20px; }
        textarea { width: 100%; background: #111; color: #fff; border: 1px solid #333; padding: 10px; margin: 10px 0; }
        button { width: 100%; padding: 15px; background: #b00; color: white; border: none; font-weight: bold; cursor: pointer; }
        #output { margin-top: 20px; padding: 15px; border: 1px dashed #444; white-space: pre-wrap; }
    </style>
</head>
<body>

    <h2>Astrology Engine (Python Backend)</h2>
    <textarea id="promptData" rows="5" placeholder="Enter Kundali details..."></textarea>
    <button onclick="runEngine()">GENERATE VERDICT</button>

    <div id="output">Waiting for command...</div>

<script>
async function runEngine() {
    const out = document.getElementById('output');
    const prompt = document.getElementById('promptData').value;
    
    // Yahan apna wo URL daalna jo tumhe Render/Railway/Streamlit se milega
    const url = "YOUR_PYTHON_BACKEND_URL_HERE/get_verdict";

    if(!prompt) { alert("Data toh daal!"); return; }

    out.innerText = "Connecting to the Python Backend...";

    try {
        const response = await fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ user_input: prompt })
        });
        const data = await response.json();
        
        // Python se reasoning aur answer dono display karenge
        out.innerText = "--- REASONING ---\n" + data.reasoning + 
                        "\n\n--- FINAL VERDICT ---\n" + data.answer;
    } catch(err) {
        out.innerText = "Error: Backend unreachable. Check deployment.";
    }
}
</script>
</body>
</html>
