<!DOCTYPE html>
<html>
<head>
    <title>Gemini Engine</title>
</head>
<body>
    <div id="chat-container"></div>
    <input type="text" id="userInput" placeholder="Ask something...">
    <button id="sendBtn">Send</button>

    <script type="module">
        // Hum library ko direct import kar rahe hain (Modern JavaScript)
        import { GoogleGenerativeAI } from "https://esm.run/@google/generative-ai";

        const API_KEY = "AQ.Ab8RN6KDaTb3piWYu-tawwGcLrxKQsPggimr5VW_w4IOrZn7HQ";
        
        async function askGemini() {
            const userInput = document.getElementById("userInput").value;
            const chatContainer = document.getElementById("chat-container");
            
            try {
                const genAI = new GoogleGenerativeAI(API_KEY);
                const model = genAI.getGenerativeModel({ model: "gemini-1.5-flash" });

                const result = await model.generateContent(userInput);
                const text = result.response.text();

                chatContainer.innerHTML += `<p><b>Gemini:</b> ${text}</p>`;
            } catch (error) {
                alert("Error: " + error.message);
            }
        }

        document.getElementById("sendBtn").onclick = askGemini;
    </script>
</body>
</html>
