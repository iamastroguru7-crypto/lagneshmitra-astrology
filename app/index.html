<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Astrology Morphing Engine</title>
    <style>
        body { background: #050505; color: #00ff41; font-family: 'Courier New', monospace; padding: 20px; }
        textarea, input { width: 100%; background: #111; color: #fff; border: 1px solid #333; padding: 12px; margin: 8px 0; box-sizing: border-box; }
        button { width: 100%; padding: 15px; background: #b00; color: white; border: none; font-weight: bold; cursor: pointer; }
        #output { margin-top: 20px; padding: 15px; border: 1px dashed #444; white-space: pre-wrap; color: #ccc; }
    </style>
</head>
<body>

    <h2>Astrology Morphing Engine</h2>
    <input type="password" id="apiKey" placeholder="NVIDIA API Key">
    <textarea id="promptData" rows="6" placeholder="Enter Kundali details or events..."></textarea>
    <button onclick="runEngine()">GENERATE VERDICT</button>

    <div id="output">Waiting for command...</div>

<script>
async function runEngine() {
    const out = document.getElementById('output');
    const key = document.getElementById('apiKey').value;
    const prompt = document.getElementById('promptData').value;
    const url = "https://script.google.com/macros/s/AKfycbyFijx1KKtvlkyPgwrsZ_ILL58zlOY2Ii3Gi0XSNWVgYezlyir22TbZJS8NxTHVPnDItA/exec";

    if(!key || !prompt) { alert("API Key aur Data dono fill kar!"); return; }

    out.innerText = "Connecting to the celestial grid...";

    try {
        const response = await fetch(url, {
            method: 'POST',
            body: JSON.stringify({
                key: key,
                body: {
                    model: "meta/llama3-70b-instruct",
                    messages: [{
                        role: "system",
                        content: "You are an old-school, sharp astrologer. Use raw, stream-of-consciousness style. Discuss karmic debts and planetary transits. Be critical, observant, and punchy."
                    }, { 
                        role: "user", 
                        content: prompt 
                    }]
                }
            })
        });

        const data = await response.json();
        if(data.choices) {
            out.innerText = data.choices[0].message.content;
        } else {
            out.innerText = "Error: " + JSON.stringify(data);
        }
    } catch(err) {
        out.innerText = "Fatal Error: " + err.message;
    }
}
</script>
</body>
</html>
