<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Humanizer Engine 5.1 - Stable Mode</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #0a0a0a; color: #d1d1d1; padding: 40px; }
        .container { max-width: 800px; background: #1a1a1a; padding: 30px; border-radius: 15px; border: 1px solid #444; }
        .form-control { background: #252525; border: 1px solid #555; color: white; }
        #output, #finalOutput { background: #000; padding: 20px; border-radius: 10px; border-left: 4px solid #ff4500; margin-top: 10px; font-family: 'Courier New', Courier, monospace; min-height: 50px; }
        .btn-custom { background: #ff4500; color: white; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h3 class="text-center mb-4 text-white">Humanizer Engine 5.1 (Meaning Stable)</h3>
    <input type="password" id="apiKey" class="form-control mb-3" placeholder="Enter Groq API Key...">
    <textarea id="inputText" class="form-control mb-3" rows="5" placeholder="Paste text here..."></textarea>
    
    <button class="btn btn-secondary w-100 mb-2" onclick="generateDraft()">Phase 1: Humanize Flow</button>
    <div id="output" class="d-none"></div>
    
    <button id="impBtn" class="btn btn-custom w-100 mt-3 d-none" onclick="implementFinal()">Phase 2: Final Polish (Detection Smash)</button>
    <div id="finalOutput" class="d-none"></div>
</div>

<script>
    let currentDraft = "";
    
    // Meaning preserve karne ke liye instructions ko refine kiya hai
    const SYSTEM_DRAFT = "You are a professional editor. Rewrite the text to sound natural and human-like while keeping the EXACT original meaning and facts intact. Do not add or change any information.";
    
    const SYSTEM_POLISH = `You are a human writer. 
    MANDATORY RULES:
    1. PRESERVE MEANING: Do not change any facts, data, or arguments. 
    2. NATURAL FLOW: Use human sentence structures, transition words (e.g., 'Honestly', 'Interestingly'), and vary sentence lengths.
    3. AVOID ROBOTIC PATTERNS: Do not use complex academic jargon or repetitive lists.
    4. NO HALLUCINATIONS: Do not add extra opinions or stories. Just rewrite for human-like flow.`;

    async function generateDraft() {
        const text = document.getElementById('inputText').value;
        const out = document.getElementById('output');
        if(!document.getElementById('apiKey').value) return alert("API Key!");
        
        out.classList.remove('d-none');
        out.innerText = "Humanizing flow...";
        
        const res = await callAI(text, SYSTEM_DRAFT);
        currentDraft = res;
        out.innerText = res;
        document.getElementById('impBtn').classList.remove('d-none');
    }

    async function implementFinal() {
        const finalDiv = document.getElementById('finalOutput');
        finalDiv.classList.remove('d-none');
        finalDiv.innerText = "Applying final polish...";
        
        const finalRes = await callAI(currentDraft, SYSTEM_POLISH);
        finalDiv.innerText = finalRes;
    }

    async function callAI(content, prompt) {
        try {
            const res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                method: 'POST',
                headers: { 
                    'Authorization': `Bearer ${document.getElementById('apiKey').value}`, 
                    'Content-Type': 'application/json' 
                },
                body: JSON.stringify({
                    model: "llama-3.3-70b-versatile",
                    temperature: 0.7, // Meaning preserve karne ke liye kam kiya
                    max_tokens: 2048,
                    frequency_penalty: 0.5, // Penalty kam ki taaki word choice normal rahe
                    presence_penalty: 0.5,
                    messages: [{ role: "system", content: prompt }, { role: "user", content: content }]
                })
            });
            const data = await res.json();
            return data.choices[0].message.content;
        } catch (e) { return "Error: " + e.message; }
    }
</script>
</body>
</html>
