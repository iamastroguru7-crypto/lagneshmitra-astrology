<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Astrology War-Engine</title>
    <style>
        body { 
            background: #050505; 
            color: #00ff41; 
            font-family: 'Courier New', Courier, monospace; 
            padding: 20px; 
            line-height: 1.4;
        }
        h2 { border-bottom: 2px solid #00ff41; padding-bottom: 5px; }
        textarea, input { 
            width: 100%; 
            background: #1a1a1a; 
            color: #fff; 
            border: 1px solid #333; 
            padding: 12px; 
            margin: 8px 0; 
            box-sizing: border-box; 
        }
        button { 
            width: 100%; 
            padding: 15px; 
            background: #b00; 
            color: white; 
            border: none; 
            font-weight: bold; 
            cursor: pointer; 
            margin-top: 10px;
        }
        #output { 
            margin-top: 20px; 
            padding: 15px; 
            border: 1px dashed #444; 
            white-space: pre-wrap; 
        }
    </style>
</head>
<body>

    <h2>Astrology Morphing Engine</h2>
    <input type="password" id="apiKey" placeholder="NVIDIA API Key">
    <textarea id="promptData" rows="6" placeholder="Enter Chart Details/Past Events..."></textarea>
    <button onclick="executeEngine()">GENERATE VERDICT</button>

    <div id="output">Waiting for command...</div>

<script>
async function executeEngine() {
    const output = document.getElementById('output');
    const key = document.getElementById('apiKey').value;
    const data = document.getElementById('promptData').value;
    const scriptUrl = "YOUR_DEPLOYED_GOOGLE_SCRIPT_URL_HERE"; // Yahan URL daal!

    if(!key || !data) { alert("Key aur Data dono chahiye!"); return; }

    output.innerText = "Processing cosmic data...";

    try {
        const response = await fetch(scriptUrl, {
            method: 'POST',
            body: JSON.stringify({
                key: key,
                body: {
                    model: "nvidia/nemotron-3-ultra-550b-a55b",
                    messages: [{
                        role: "system",
                        content: "You are a seasoned astrologer. Use raw, stream-of-consciousness, punchy style. Use ellipses (...). Discuss karmic debts, shifting energies, and celestial patterns. Be sharp and observant."
                    }, { 
                        role: "user", 
                        content: data 
                    }]
                }
            })
        });

        const result = await response.json();
        output.innerText = result.choices ? result.choices[0].message.content : JSON.stringify(result);
    } catch(err) {
        output.innerText = "Error encountered: " + err.message + "\n\nMake sure your Google Script is deployed as 'Anyone'.";
    }
}
</script>
</body>
</html>
