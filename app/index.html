<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Groq Humanizer Pro</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; padding: 20px; max-width: 600px; margin: auto; background: #f8f9fa; }
        .box { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); margin-bottom: 20px; }
        input, textarea { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #d63384; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
        #output { margin-top: 20px; display: none; }
        .score-row { display: flex; gap: 10px; margin-top: 15px; }
        .score-card { flex: 1; padding: 10px; border-radius: 8px; text-align: center; color: white; font-size: 14px; }
    </style>
</head>
<body>

    <h2>Groq Humanizer Pro</h2>
    <div class="box">
        <input type="password" id="apiKey" placeholder="Paste Groq API Key (gsk_...)">
        <textarea id="userInput" rows="4" placeholder="Enter text to analyze..."></textarea>
        <button id="sendBtn">Generate Analysis</button>
    </div>

    <div id="output">
        <div class="box" id="resultText"></div>
        <div class="score-row">
            <div class="score-card" style="background:#6c757d;">AI<br><span id="aiS">0</span>%</div>
            <div class="score-card" style="background:#0d6efd;">GPT<br><span id="gptS">0</span>%</div>
            <div class="score-card" style="background:#198754;">Human<br><span id="humS">0</span>%</div>
        </div>
        <button id="copyBtn" style="margin-top:15px; background:#333;">Copy Text</button>
    </div>

    <script>
        document.getElementById('sendBtn').addEventListener('click', async () => {
            const key = document.getElementById('apiKey').value.trim();
            const prompt = document.getElementById('userInput').value.trim();
            const btn = document.getElementById('sendBtn');
            
            if(!key || !prompt) return alert("API Key aur Prompt dono daalo!");

            btn.innerText = "Analyzing...";

            try {
                const res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                    method: "POST",
                    headers: { "Content-Type": "application/json", "Authorization": `Bearer ${key}` },
                    body: JSON.stringify({ 
                        model: "llama-3.3-70b-versatile",
                        messages: [
                            { role: "system", content: "You are a humanizer analyzer. Return ONLY raw JSON format: {'answer': 'humanized text here', 'ai_score': 0, 'gpt_score': 0, 'human_score': 0}" },
                            { role: "user", content: prompt }
                        ] 
                    })
                });

                const data = await res.json();
                const rawContent = data.choices[0].message.content.trim();
                
                // Regex to extract ONLY the JSON part
                const jsonMatch = rawContent.match(/\{[\s\S]*\}/);
                if (!jsonMatch) throw new Error("Could not find JSON in response");
                
                const content = JSON.parse(jsonMatch[0]);
                
                document.getElementById('resultText').innerText = content.answer;
                document.getElementById('aiS').innerText = content.ai_score;
                document.getElementById('gptS').innerText = content.gpt_score;
                document.getElementById('humS').innerText = content.human_score;
                
                document.getElementById('output').style.display = 'block';
            } catch (e) {
                alert("Error: Data parse nahi ho paya. Phir se try karo.");
                console.error(e);
            } finally {
                btn.innerText = "Generate Analysis";
            }
        });

        document.getElementById('copyBtn').onclick = () => {
            navigator.clipboard.writeText(document.getElementById('resultText').innerText);
            alert("Copied!");
        };
    </script>
</body>
</html>
