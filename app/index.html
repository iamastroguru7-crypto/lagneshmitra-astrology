<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Groq-GSK Powered Humanizer</title>
    <style>
        body { font-family: sans-serif; padding: 20px; max-width: 600px; margin: auto; background: #f4f4f4; }
        .box { background: #fff; padding: 15px; border-radius: 8px; margin-bottom: 15px; }
        input, textarea { width: 100%; padding: 10px; margin: 8px 0; border: 1px solid #ccc; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #d63384; color: white; border: none; border-radius: 4px; cursor: pointer; }
        #output { margin-top: 20px; padding: 15px; background: #fff; border: 1px solid #ddd; white-space: pre-wrap; }
    </style>
</head>
<body>

    <h2>Groq Server Humanizer</h2>

    <div class="box">
        <input type="password" id="apiKey" placeholder="Paste Groq API Key (gsk_...)">
        <textarea id="userInput" rows="4" placeholder="Kuch likho..."></textarea>
        <button id="sendBtn">Generate with Groq</button>
    </div>

    <div id="output">Result yahan aayega...</div>

    <script>
        document.getElementById('sendBtn').addEventListener('click', async () => {
            const key = document.getElementById('apiKey').value.trim();
            const prompt = document.getElementById('userInput').value.trim();
            const output = document.getElementById('output');

            output.innerText = "Processing via Groq Engine...";

            try {
                // Groq API Endpoint
                const res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                    method: "POST",
                    headers: { 
                        "Content-Type": "application/json", 
                        "Authorization": `Bearer ${key}` 
                    },
                    body: JSON.stringify({ 
                        // Groq par Llama 3 70B use kar, yeh "Humanizer" ke liye best hai
                        model: "llama3-70b-8192", 
                        messages: [
                            { role: "system", content: "You are a human-like writing assistant. Respond precisely and provide a 'Humanizer Score' (0-100%) at the end." },
                            { role: "user", content: prompt }
                        ] 
                    })
                });

                const data = await res.json();
                
                if (data.error) {
                    output.innerText = "Error: " + data.error.message;
                } else {
                    output.innerText = data.choices[0].message.content;
                }
            } catch (err) {
                output.innerText = "Error: " + err.message;
            }
        });
    </script>
</body>
</html>
