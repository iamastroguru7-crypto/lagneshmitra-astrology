<!DOCTYPE html>
<html>
<head>
    <title>Gemini Engine</title>
</head>
<body>
    <div id="chat-container"></div>
    <input type="text" id="userInput" placeholder="Ask something...">
    <button id="sendBtn">Send</button>

    <script>
        // Yahan apni 'Aq...' wali key paste kar
        const API_KEY = "AQ.Ab8RN6Ki08ycrj0iaGHnmBfoYEnG0yFE6wjgEKT0IeU333vIWw";
        
        async function askGemini() {
            const userInput = document.getElementById("userInput").value;
            const chatContainer = document.getElementById("chat-container");
            
            // Note: Aq keys ke liye URL mein 'key=' ki jagah Authorization header use hoga
            const url = "https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent";

            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${API_KEY}` // Yahan 'Bearer' format use kiya hai
                    },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: userInput }] }]
                    })
                });

                const data = await response.json();

                if (data.error) {
                    alert("API Error: " + data.error.message);
                } else {
                    const text = data.candidates[0].content.parts[0].text;
                    chatContainer.innerHTML += `<p><b>Gemini:</b> ${text}</p>`;
                }
            } catch (error) {
                alert("Network Error: " + error.message);
            }
        }

        document.getElementById("sendBtn").onclick = askGemini;
    </script>
</body>
</html>
