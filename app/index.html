<!DOCTYPE html>
<html>
<head>
    <title>Direct War-Engine</title>
</head>
<body>
    <div id="container" style="max-width:800px; margin:auto; padding:20px;">
        <input type="password" id="key" placeholder="API Key" style="width:100%"><br><br>
        <textarea id="data" rows="5" style="width:100%" placeholder="Input Chart Data"></textarea><br><br>
        <button onclick="run()">GENERATE</button>
        <pre id="output" style="color:green;"></pre>
    </div>

<script>
async function run() {
    const output = document.getElementById('output');
    output.innerText = "Connecting...";
    
    try {
        const response = await fetch("https://integrate.api.nvidia.com/v1/chat/completions", {
            method: 'POST',
            headers: { 
                'Authorization': 'Bearer ' + document.getElementById('key').value,
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                model: "nvidia/nemotron-3-ultra-550b-a55b",
                messages: [{"role": "user", "content": document.getElementById('data').value}],
                stream: true
            })
        });

        const reader = response.body.getReader();
        while(true) {
            const {done, value} = await reader.read();
            if(done) break;
            output.innerText += new TextDecoder().decode(value);
        }
    } catch(e) {
        output.innerText = "Error: " + e.message + "\n\nBhai, CORS extension install kar le, bina uske browser block karega.";
    }
}
</script>
</body>
</html>
