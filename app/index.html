<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GSK Humanizer Tester</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; padding: 20px; max-width: 600px; margin: auto; background: #f0f2f5; }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 20px; }
        input, textarea { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #28a745; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 16px; font-weight: bold; }
        #output { margin-top: 20px; padding: 20px; background: #fff; border-left: 5px solid #28a745; white-space: pre-wrap; line-height: 1.6; }
    </style>
</head>
<body>

    <h2>GSK Humanizer Tester</h2>

    <div class="card">
        <input type="password" id="apiKey" placeholder="Enter Gemini API Key (AIza...)">
        <textarea id="userInput" rows="4" placeholder="Kya likhna hai?"></textarea>
        <button id="sendBtn">Generate & Humanize</button>
    </div>

    <div id="output">Result yahan aayega...</div>

    <script>
        document.getElementById('sendBtn').addEventListener('click', async () => {
            const key = document.getElementById('apiKey').value.trim();
            const prompt = document.getElementById('userInput').value.trim();
            const output = document.getElementById('output');

            if (!key || !prompt) return alert("Key aur Prompt dono daal bhai!");

            output.innerText = "Analyzing & Humanizing...";

            const finalPrompt = `
                Respond to this: "${prompt}".
                Instructions:
                1. Write in a very natural, conversational, and human-like tone.
                2. Avoid robotic patterns or repetitive AI phrases.
                3. After the answer, give a "Humanizer Score" in percentage (0-100%) based on how natural the text sounds.
                Format:
                [Answer]
                
                ---
                Humanizer Score: [X]%
            `;

            try {
                const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${key}`;
                const res = await fetch(url, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ contents: [{ parts: [{ text: finalPrompt }] }] })
                });

                const data = await res.json();
                if (data.candidates) {
                    output.innerText = data.candidates[0].content.parts[0].text;
                } else {
                    output.innerText = "Error: " + JSON.stringify(data);
                }
            } catch (err) {
                output.innerText = "Fetch Error: " + err.message;
            }
        });
    </script>
</body>
</html>
