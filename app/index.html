<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wealth Engine | Precision AI</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: url('/global/background2.png') no-repeat center center fixed;
            background-size: cover;
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: white;
        }
        .container {
            width: 90%;
            max-width: 500px;
            background: rgba(0, 0, 0, 0.7);
            padding: 20px;
            border-radius: 15px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        #outputBox {
            height: 300px;
            background: rgba(0, 0, 0, 0.3);
            margin-bottom: 20px;
            padding: 15px;
            border-radius: 10px;
            overflow-y: auto;
            border: 1px solid #444;
            color: #ddd;
        }
        .input-area { display: flex; gap: 10px; }
        input { flex: 1; padding: 12px; border-radius: 5px; border: none; background: rgba(255, 255, 255, 0.1); color: white; }
        button { padding: 10px 20px; background: #ffcc00; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <div id="outputBox"><strong>System:</strong> Welcome. Recharge ₹100 to initialize the Precision Engine.</div>
    <div class="input-area">
        <input type="text" id="userInput" placeholder="Ask your query...">
        <button onclick="processQuery()">SEND</button>
    </div>
</div>

<script>
    // API Key yahan daal
    const API_KEY = "AQ.Ab8RN6LNiDjBf5---7RYIaT8iHMJ-5pKQoNkS22ft_ptpVF61Q";
    let isRecharged = false; // Isse true kar dena jab payment confirm ho jaye

    async function processQuery() {
        const inputField = document.getElementById('userInput');
        const outputBox = document.getElementById('outputBox');
        const query = inputField.value;

        if (query.trim() === "") return;

        if (!isRecharged) {
            outputBox.innerHTML += `<br><br><strong>System:</strong> Please complete ₹100 recharge first.`;
            return;
        }

        outputBox.innerHTML += `<br><br><strong>You:</strong> ${query}<br><em>Engine is calculating...</em>`;
        inputField.value = "";
        outputBox.scrollTop = outputBox.scrollHeight;

        try {
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    contents: [{ parts: [{ text: "You are a Precision Financial Astrology Engine. Give high-precision answers: " + query }] }]
                })
            });

            const data = await response.json();
            const result = data.candidates[0].content.parts[0].text;
            
            outputBox.innerHTML += `<br><br><strong>Engine:</strong> ${result}`;
            outputBox.scrollTop = outputBox.scrollHeight;
        } catch (error) {
            outputBox.innerHTML += `<br><br><strong>System:</strong> Error connecting to Engine.`;
        }
    }
</script>
</body>
</html>
