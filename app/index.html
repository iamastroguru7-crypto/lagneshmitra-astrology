<!DOCTYPE html>
<html>
<head>
    <title>Gemini Engine</title>
</head>
<body>
    <div id="chat-container"></div>
    <input type="text" id="userInput" placeholder="Ask something...">
    <button onclick="askGemini()">Send</button>

    <script>
        // Yahan apni 'Aq...' wali API key paste kar
        const API_KEY = "AQ.Ab8RN6KDaTb3piWYu-tawwGcLrxKQsPggimr5VW_w4IOrZn7HQ"; 
        
        async function askGemini() {
            const userInput = document.getElementById("userInput").value;
            const chatContainer = document.getElementById("chat-container");

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/gemini-1.5-flash-lat:generateContent?key=${API_KEY}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: userInput }] }]
                    })
                });

                const data = await response.json();

                if (data.error) {
                    // Agar error aaya toh seedha alert mein dikhega
                    alert("Error: " + data.error.message);
                } else {
                    const botReply = data.candidates[0].content.parts[0].text;
                    chatContainer.innerHTML += `<p><b>Gemini:</b> ${botReply}</p>`;
                }
            } catch (error) {
                alert("Connection Failed: " + error.message);
            }
        }
    </script>
</body>
</html>
