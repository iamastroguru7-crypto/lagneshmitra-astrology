<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Astrology Bypass [Plural Mode]</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #000; color: #fff; padding: 20px; font-family: 'Courier New', Courier, monospace; }
        .container { max-width: 600px; background: #0a0a0a; padding: 25px; border-radius: 5px; border: 1px solid #333; }
        textarea { background: #0a0a0a; color: #0f0; border: 1px solid #444; width: 100%; padding: 10px; }
        #result { background: #000; padding: 20px; margin-top: 20px; white-space: pre-wrap; color: #ddd; border: 1px solid #222; }
    </style>
</head>
<body>

<div class="container">
    <h3 class="text-center">Astrology Raw [Plural Mode]</h3>
    <input type="password" id="apiKey" class="form-control mb-2" placeholder="Groq API Key...">
    <textarea id="inputText" rows="8" placeholder="Paste chart data..."></textarea>
    <button class="btn btn-outline-warning w-100 mt-2" onclick="processText()">Generate Messy Analysis</button>
    <div id="result" class="d-none"></div>
</div>

<script>
    async function processText() {
        const key = document.getElementById('apiKey').value;
        const text = document.getElementById('inputText').value;
        const resDiv = document.getElementById('result');
        
        if(!key || !text) return alert("Key aur data chahiye bhai!");
        
        resDiv.classList.remove('d-none');
        resDiv.innerText = "typing analysis...";

        const systemPrompt = `You are a human who is bad at typing and hates professional structure.
        RULES:
        1. NO GRAMMAR: Write mostly in lowercase. ignore capitalization. 
        2. PLURAL ENDINGS: Force almost every sentence to end with plural nouns or words ending in 's' sounds.
        3. BROKEN THOUGHTS: use random line breaks everywhere. split sentences in half.
        4. NO FILLERS: NEVER start sentences with 'honestly', 'you know', 'i mean'. stop using these, they are detected as AI.
        5. MESSY: use short, jagged, incomplete thoughts. 
        6. NO MARKDOWN: return just the raw, unformatted text.`;

        try {
            const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                method: 'POST',
                headers: { 'Authorization': `Bearer ${key}`, 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    model: "llama-3.3-70b-versatile",
                    temperature: 1.0, 
                    frequency_penalty: 1.9,
                    presence_penalty: 1.9,
                    messages: [{ role: "system", content: systemPrompt }, { role: "user", content: text }]
                })
            });
            const data = await response.json();
            resDiv.innerText = data.choices[0].message.content;
        } catch (e) {
            resDiv.innerText = "Error: " + e.message;
        }
    }
</script>
</body>
</html>
