<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Zero-GPT Bypass Engine (Direct)</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #0a0a0a; color: #ccc; padding: 20px; }
        .container { max-width: 700px; background: #161616; padding: 30px; border-radius: 12px; border: 1px solid #333; }
        textarea { background: #000; color: #0f0; border: 1px solid #444; width: 100%; padding: 12px; border-radius: 8px; }
        #result { background: #050505; border-left: 4px solid #0f0; padding: 20px; margin-top: 20px; white-space: pre-wrap; color: #fff; }
    </style>
</head>
<body>

<div class="container">
    <h3 class="text-center text-white mb-4">Direct Bypass Engine</h3>
    <input type="password" id="apiKey" class="form-control mb-3" placeholder="Enter Groq API Key...">
    <textarea id="inputText" rows="6" placeholder="Paste your robotic text here..."></textarea>
    <button class="btn btn-success w-100 mt-2" onclick="processText()">Generate 0% AI Text</button>
    <div id="result" class="d-none"></div>
</div>

<script>
    async function processText() {
        const key = document.getElementById('apiKey').value;
        const text = document.getElementById('inputText').value;
        const resDiv = document.getElementById('result');
        
        if(!key || !text) return alert("Key aur text dono daal!");
        
        resDiv.classList.remove('d-none');
        resDiv.innerText = "Bypassing detection...";

        // Yahan hai woh logic jo 0% score degi
        const systemPrompt = `You are an expert human writer. Rewrite the user's text to achieve a 0% AI score on detectors like ZeroGPT.
        RULES:
        1. MEANING: Do not change the original facts or message.
        2. BURSTINESS: Force a mix of very short (2-3 words) and long, rambling sentences.
        3. PERPLEXITY: Use slightly unexpected but natural vocabulary. Avoid predictable AI sequences.
        4. TONE: Be blunt, cynical, and conversational. Use "Look,", "Honestly,", "Basically,".
        5. NO MARKDOWN: Return just the rewritten text. Do not add intro/outro text.`;

        try {
            const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                method: 'POST',
                headers: { 'Authorization': `Bearer ${key}`, 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    model: "llama-3.3-70b-versatile",
                    temperature: 0.7, // Meaning aur creativity ka perfect balance
                    messages: [{ role: "system", content: systemPrompt }, { role: "user", content: text }]
                })
            });
            const data = await response.json();
            resDiv.innerText = data.choices[0].message.content;
        } catch (e) {
            resDiv.innerText = "Error: " + e.message;
        }
    }
</script>
</body>
</html>
