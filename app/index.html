<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Zero-GPT Bypass Engine [Extreme]</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #080808; color: #bbb; padding: 20px; font-family: sans-serif; }
        .container { max-width: 700px; background: #121212; padding: 30px; border-radius: 15px; border: 1px solid #555; }
        textarea { background: #000; color: #0f0; border: 1px solid #666; width: 100%; padding: 15px; border-radius: 10px; }
        #result { background: #000; border-left: 5px solid #ff0000; padding: 20px; margin-top: 20px; white-space: pre-wrap; color: #fff; font-size: 16px; }
    </style>
</head>
<body>

<div class="container">
    <h3 class="text-center text-white mb-4">Zero-GPT Bypass [Extreme Mode]</h3>
    <input type="password" id="apiKey" class="form-control mb-3" placeholder="Groq API Key...">
    <textarea id="inputText" rows="6" placeholder="Paste robotic text here..."></textarea>
    <button class="btn btn-danger w-100 mt-2" onclick="processText()">Generate Chaotic Human Text</button>
    <div id="result" class="d-none"></div>
</div>

<script>
    async function processText() {
        const key = document.getElementById('apiKey').value;
        const text = document.getElementById('inputText').value;
        const resDiv = document.getElementById('result');
        
        if(!key || !text) return alert("Key aur text dal bhai!");
        
        resDiv.classList.remove('d-none');
        resDiv.innerText = "Applying extreme human jitter...";

        const systemPrompt = `You are a human writer who is bad at structured writing. 
        RULES:
        1. CHAOTIC FLOW: Stream of consciousness. Do not use perfect paragraphs. Use dashes (—), ellipses (...), and line breaks randomly.
        2. MEANING LOCK: Keep the original facts and logic, but change the delivery to be messy and blunt.
        3. HUMAN JITTER: Use phrases like 'you know?', 'anyway,', 'look,', 'I mean,'.
        4. STRUCTURE: Vary sentence length aggressively—from 2-word punchlines to 30-word run-on sentences. 
        5. NO AI PATTERNS: Do not be polished. Be raw. No perfect transitions. 
        6. NO MARKDOWN: Output plain text only.`;

        try {
            const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                method: 'POST',
                headers: { 'Authorization': `Bearer ${key}`, 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    model: "llama-3.3-70b-versatile",
                    temperature: 0.95, 
                    frequency_penalty: 1.5,
                    presence_penalty: 1.5,
                    messages: [{ role: "system", content: systemPrompt }, { role: "user", content: text }]
                })
            });
            const data = await response.json();
            resDiv.innerText = data.choices[0].message.content;
        } catch (e) {
            resDiv.innerText = "Error: " + e.message;
        }
    }
</script>
</body>
</html>
