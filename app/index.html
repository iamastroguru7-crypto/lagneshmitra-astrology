<!DOCTYPE html>
<html lang="en">
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wealth Engine | Precision AI</title>
    <style>
        body { margin: 0; padding: 0; background: url('../background2.png') no-repeat center center fixed; background-size: cover; font-family: 'Segoe UI', sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; width: 100vw; color: white; }
        .container { width: 95%; height: 90vh; background: rgba(0, 0, 0, 0.85); padding: 20px; display: flex; flex-direction: column; border-radius: 10px; border: 1px solid rgba(255, 255, 255, 0.2); }
        #outputBox { flex: 1; background: rgba(0, 0, 0, 0.4); margin-bottom: 20px; padding: 20px; border-radius: 10px; border: 1px solid #444; display: flex; flex-direction: column; align-items: center; overflow-y: auto; }
        .engine-logo { width: 80px; height: auto; margin-bottom: 20px; opacity: 0.9; }
        #messages { width: 100%; text-align: left; }
        .message { margin-bottom: 15px; line-height: 1.6; }
        .input-area { display: flex; gap: 10px; }
        input { flex: 1; padding: 15px; border-radius: 5px; border: none; background: rgba(255, 255, 255, 0.1); color: white; }
        button { padding: 10px 25px; background: #ffcc00; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; color: black; }
    </style>
</head>
<body>

<div class="container">
    <div id="outputBox">
        <img src="../logo.png" alt="Logo" class="engine-logo" onerror="this.style.display='none'">
        <div id="messages">
            <div class="message"><strong>System:</strong> Engine Initialized. Ask your query.</div>
        </div>
    </div>
    <div class="input-area">
        <input type="text" id="userInput" placeholder="Ask your query...">
        <button onclick="processQuery()">SEND</button>
    </div>
</div>

<script>
    // BHAI: Yahan apni AIza se shuru hone wali REAL API key daal
    const API_KEY = "AQ.Ab8RN6JbpPXw19Nt62JnKAwxs1IqHc4hpaO-DUY-ojUf8QpUjg"; 

    async function processQuery() {
        const inputField = document.getElementById('userInput');
        const query = inputField.value;
        if (query.trim() === "") return;

        const msgContainer = document.getElementById('messages');
        const userMsg = document.createElement('div');
        userMsg.className = 'message';
        userMsg.innerHTML = `<strong>You:</strong> ${query}`;
        msgContainer.appendChild(userMsg);
        
        const loader = document.createElement('div');
        loader.className = 'message';
        loader.innerHTML = `<em>Engine is analyzing...</em>`;
        msgContainer.appendChild(loader);
        
        inputField.value = "";
        document.getElementById('outputBox').scrollTop = document.getElementById('outputBox').scrollHeight;

        try {
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    contents: [{ parts: [{ text: `You are Lagneshmitra Engine. ONLY answer questions related to Financial Astrology. Query: ${query}` }] }]
                })
            });
            const data = await response.json();
            loader.remove(); // Loader hata diya
            
            const engineMsg = document.createElement('div');
            engineMsg.className = 'message';
            engineMsg.innerHTML = `<strong>Engine:</strong> ${data.candidates[0].content.parts[0].text}`;
            msgContainer.appendChild(engineMsg);
        } catch (e) {
            loader.remove();
            msgContainer.innerHTML += `<div class="message"><strong>System:</strong> Connection Failed. Check your API Key.</div>`;
        }
    }
</script>
</body>
</html>
