<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wealth Engine | Precision AI</title>
    <style>
        body {
            margin: 0; padding: 0;
            background: url('../global/background2.png') no-repeat center center fixed;
            background-size: cover;
            font-family: 'Segoe UI', sans-serif;
            display: flex; justify-content: center; align-items: center;
            height: 100vh; width: 100vw; color: white;
        }
        .container {
            width: 95%; height: 90vh;
            background: rgba(0, 0, 0, 0.85);
            padding: 20px;
            display: flex; flex-direction: column;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        #outputBox {
            flex: 1;
            background: rgba(0, 0, 0, 0.4);
            margin-bottom: 20px;
            padding: 20px;
            border-radius: 10px;
            border: 1px solid #444;
            position: relative;
            overflow-y: auto;
        }
        .engine-logo {
            position: absolute; top: 15px; right: 15px;
            width: 50px; opacity: 0.7;
        }
        .message { margin-bottom: 15px; line-height: 1.6; }
        .input-area { display: flex; gap: 10px; }
        input { flex: 1; padding: 15px; border-radius: 5px; border: none; background: rgba(255, 255, 255, 0.1); color: white; }
        button { padding: 10px 25px; background: #ffcc00; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <div id="outputBox">
        <img src="../global/logo.png" alt="Logo" class="engine-logo">
        <div class="message"><strong>System:</strong> Welcome. Recharge ₹100 to initialize the Precision Engine.</div>
    </div>
    <div class="input-area">
        <input type="text" id="userInput" placeholder="Ask your query...">
        <button onclick="processQuery()">SEND</button>
    </div>
</div>

<script>
    const API_KEY = "PASTE_YOUR_GEMINI_API_KEY_HERE";
    let isRecharged = false; 

    function appendMessage(text) {
        const outputBox = document.getElementById('outputBox');
        const msgDiv = document.createElement('div');
        msgDiv.className = 'message';
        msgDiv.innerHTML = text;
        const logo = outputBox.querySelector('.engine-logo');
        outputBox.insertBefore(msgDiv, logo ? logo.nextSibling : outputBox.firstChild);
        outputBox.scrollTop = outputBox.scrollHeight;
    }

    async function processQuery() {
        const inputField = document.getElementById('userInput');
        const query = inputField.value;
        if (query.trim() === "") return;

        if (!isRecharged) {
            appendMessage('<strong>System:</strong> Access Denied. Recharge ₹100 first.');
            inputField.value = ""; return;
        }

        appendMessage(`<strong>You:</strong> ${query}<br><em>Engine is calculating...</em>`);
        inputField.value = "";

        try {
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ contents: [{ parts: [{ text: "Precision Financial Astrology Engine: " + query }] }] })
            });
            const data = await response.json();
            appendMessage(`<strong>Engine:</strong> ${data.candidates[0].content.parts[0].text}`);
        } catch (e) {
            appendMessage('<strong>System:</strong> Connection Error.');
        }
    }
</script>
</body>
</html>
