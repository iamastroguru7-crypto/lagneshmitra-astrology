<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Zero-GPT Bypass Engine Pro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #0a0a0a; color: #ccc; padding: 20px; font-family: sans-serif; }
        .container { max-width: 700px; background: #161616; padding: 30px; border-radius: 12px; border: 1px solid #444; }
        textarea { background: #000; color: #0f0; border: 1px solid #555; width: 100%; padding: 12px; border-radius: 8px; }
        #result { background: #050505; border-left: 4px solid #f00; padding: 20px; margin-top: 20px; white-space: pre-wrap; color: #fff; min-height: 100px; }
    </style>
</head>
<body>

<div class="container">
    <h3 class="text-center text-white mb-4">Zero-GPT Bypass Engine (Pro)</h3>
    <input type="password" id="apiKey" class="form-control mb-3" placeholder="Enter Groq API Key...">
    <textarea id="inputText" rows="6" placeholder="Paste your robotic text here..."></textarea>
    <button class="btn btn-danger w-100 mt-2" onclick="processText()">Smash Detection (Generate 0% AI)</button>
    <div id="result" class="d-none"></div>
</div>

<script>
    async function processText() {
        const key = document.getElementById('apiKey').value;
        const text = document.getElementById('inputText').value;
        const resDiv = document.getElementById('result');
        
        if(!key || !text) return alert("API Key aur Text dono daal!");
        
        resDiv.classList.remove('d-none');
        resDiv.innerText = "Injecting human patterns & bypassing...";

        // Super-Aggressive Prompt
        const systemPrompt = `You are an expert human writer. Rewrite the text to bypass AI detectors.
        RULES:
        1. MEANING LOCK: Keep every single fact, detail, and argument the same.
        2. CHAOTIC BURSTINESS: Mix extremely short fragments (2-3 words) with long, complex, trailing sentences. 
        3. RHETORICAL QUESTIONS: Ask 1-2 questions within the text to sound like a human engaged in a debate.
        4. VOCABULARY: Use raw, conversational, and slightly messy language. Avoid formal AI-transition words like 'Furthermore', 'Consequently', 'Overall', 'However' at the start.
        5. STARTING WORDS: Vary openers. Use 'Honestly,', 'So,', 'Look,', 'Actually,', or just start with the noun.
        6. NO MARKDOWN: Output raw text only. No introductions or explanations.`;

        try {
            const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                method: 'POST',
                headers: { 'Authorization': `Bearer ${key}`, 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    model: "llama-3.3-70b-versatile",
                    temperature: 0.85, 
                    frequency_penalty: 0.8,
                    presence_penalty: 0.8,
                    messages: [{ role: "system", content: systemPrompt }, { role: "user", content: text }]
                })
            });
            const data = await response.json();
            resDiv.innerText = data.choices[0].message.content;
        } catch (e) {
            resDiv.innerText = "Error: " + e.message;
        }
    }
</script>
</body>
</html>
