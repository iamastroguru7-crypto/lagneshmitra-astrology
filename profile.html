<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Profile | LagneshMitra</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
    <style>
        body { background: #0a0b10; color: #fff; font-family: sans-serif; display: flex; justify-content: center; padding: 20px; }
        .card { background: #15171e; padding: 20px; border-radius: 15px; border: 1px solid #333; width: 350px; position: relative; }
        .header { display: flex; align-items: center; justify-content: space-between; }
        .avatar { width: 50px; height: 50px; border-radius: 50%; border: 2px solid #ffb400; cursor: pointer; }
        .dots { cursor: pointer; font-size: 20px; color: #ffb400; }
        .panel { display: none; background: #1c1f26; padding: 15px; margin-top: 10px; border-radius: 8px; font-size: 13px; }
        .btn-logout { background: #ff4444; width: 100%; padding: 8px; border: none; color: white; border-radius: 4px; margin-top: 10px; cursor: pointer; }
    </style>
</head>
<body>

<div class="card">
    <div class="header">
        <img id="userImg" class="avatar" src="https://via.placeholder.com/50">
        <div class="dots" onclick="togglePanel()">⋮</div>
    </div>
    <h2 id="userName">...</h2>
    <p>ID: <b id="lmId">Generating...</b></p>

    <div id="extraPanel" class="panel">
        <p>Email: <span id="userEmail"></span></p>
        <p>Phone: <span id="userPhone">Not Linked</span></p>
        <button class="btn-logout" onclick="logout()">Logout</button>
    </div>
</div>

<script>
    const firebaseConfig = { /* Wahi same config */ };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    firebase.auth().onAuthStateChanged(async (user) => {
        if (user) {
            document.getElementById('userName').innerText = user.displayName;
            document.getElementById('userImg').src = user.photoURL;
            document.getElementById('userEmail').innerText = user.email;
            document.getElementById('userPhone').innerText = user.phoneNumber || "N/A";

            // Permanent ID Logic
            const userRef = db.collection('users').doc(user.uid);
            const doc = await userRef.get();
            
            if (!doc.exists) {
                const newId = "LM-" + Math.floor(10000 + Math.random() * 90000);
                await userRef.set({ lmId: newId, email: user.email });
                document.getElementById('lmId').innerText = newId;
            } else {
                document.getElementById('lmId').innerText = doc.data().lmId;
            }
        } else {
            window.location.href = 'login.html';
        }
    });

    function togglePanel() {
        const p = document.getElementById('extraPanel');
        p.style.display = p.style.display === 'block' ? 'none' : 'block';
    }

    function logout() { firebase.auth().signOut().then(() => window.location.href = 'login.html'); }
</script>
</body>
</html>
