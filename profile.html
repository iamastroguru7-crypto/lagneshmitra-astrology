<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>LagneshMitra | Profile</title>
    <style>
        body { background-color: #0a0b10; color: #fff; font-family: 'Montserrat', sans-serif; padding: 40px; }
        .dashboard { max-width: 800px; margin: auto; background: #15171e; padding: 30px; border-radius: 12px; border: 1px solid #333; }
        h1 { color: #ffb400; font-family: 'Monotype Corsiva', cursive; }
        .profile-header { display: flex; align-items: center; gap: 20px; border-bottom: 1px solid #333; padding-bottom: 20px; }
        .user-pic { width: 80px; height: 80px; background: #333; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 2rem; }
        .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 30px; }
        .card { background: #1b1e26; padding: 20px; border-radius: 8px; border: 1px solid #444; }
        .label { color: #888; font-size: 0.8rem; }
        .value { font-size: 1.1rem; margin-top: 5px; }
    </style>
</head>
<body>

<div class="dashboard">
    <div class="profile-header">
        <div class="user-pic">U</div>
        <div>
            <h1>User Instance Profile</h1>
            <p id="user-email">loading...</p>
        </div>
    </div>
    
    <div class="info-grid">
        <div class="card"><div class="label">User UID</div><div class="value">LM-789234-X</div></div>
        <div class="card"><div class="label">Subscription Status</div><div class="value">Active Diagnostic Node</div></div>
    </div>
    
    <br><br>
    <button onclick="window.location.href='products.html'" style="background:#ffb400; border:none; padding:10px 20px; cursor:pointer; font-weight:bold;">View Diagnostic Systems</button>
</div>

</body>
</html>
