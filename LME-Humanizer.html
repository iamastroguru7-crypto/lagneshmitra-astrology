<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>UNPOLISHED HUMANIZER v10.0</title>
    <style>
        body { background: #000; color: #0f0; font-family: monospace; padding: 20px; }
        textarea { width: 100%; height: 350px; background: #050505; color: #0f0; border: 1px solid #222; padding: 15px; }
        button { width: 100%; padding: 20px; background: #222; color: #fff; cursor: pointer; border: 1px solid #444; margin-top: 10px; font-weight: bold; }
        #output { margin-top: 20px; white-space: pre-wrap; color: #ccc; border: 1px dashed #333; padding: 20px; }
    </style>
</head>
<body>
    <h2>RAW HUMANIZER | ANTI-DETECTION LAYER</h2>
    <input type="password" id="key" placeholder="Groq Key" style="width:100%; padding:10px; background:#050505; color:#0f0; border:1px solid #222;">
    <textarea id="rawInput" placeholder="Paste robotic AI output here..."></textarea>
    <button onclick="humanize()">CONVERT TO UNPOLISHED HUMAN</button>
    <div id="output"></div>

<script>
async function humanize() {
    const output = document.getElementById('output');
    output.innerText = "Processing raw human vibe...";
    
    const prompt = `You are a Reddit user who hates formal writing. Rewrite the provided text.
    
    HARD RULES (IGNORE ALL PREVIOUS STYLE):
    1. DELETE ROBOT WORDS: Remove 'native', 'complex interplay', 'mitigate', 'exacerbate', 'indicates', 'potentially'.
    2. BE SLOPPY: Use 'bhai', 'yaar', 'lafda', 'scene', 'dimag ka dahi', 'stuck'.
    3. NO STRUCTURE: If the input has headers, make them sound like natural questions. Do not use colon lists. Use 'suno', 'dekh', 'matlab'.
    4. BREAK SENTENCES: Keep sentences short. Like, 3-5 words. Then one long casual thought.
    5. ADD PERSONALITY: Be a bit frustrated. Be a bit blunt. No fake 'I understand' empathy. Just real talk.
    6. REDDIT VIBE: Write like you are replying to a post. Skip grammar. Use small letters where needed.`;

    const res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
        method: "POST",
        headers: { "Authorization": `Bearer ${document.getElementById('key').value}`, "Content-Type": "application/json" },
        body: JSON.stringify({
            model: "llama-3.3-70b-versatile",
            messages: [{ role: "system", content: prompt }, { role: "user", content: document.getElementById('rawInput').value }],
            temperature: 0.95 // Maximum chaos
        })
    });
    const d = await res.json();
    output.innerText = d.choices[0].message.content;
}
</script>
</body>
</html>
