<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AstroHumanizer v1.0 | Counseling Layer</title>
    <style>
        :root { --bg: #0b0e14; --accent: #ff4500; --text: #d1d5db; }
        body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; padding: 40px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 800px; }
        textarea { width: 100%; height: 300px; background: #161b22; color: #fff; border: 1px solid #30363d; padding: 15px; border-radius: 8px; margin: 20px 0; }
        .btn { padding: 15px 30px; background: var(--accent); color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
        #output { background: #010409; padding: 20px; border-left: 4px solid var(--accent); margin-top: 20px; white-space: pre-wrap; }
    </style>
</head>
<body>

<div class="container">
    <h2>AstroHumanizer | Counseling Tone Refiner</h2>
    <p>Paste the raw AI output below. This will convert it into a deeply empathetic, counselor-style human tone.</p>
    
    <input type="password" id="apiKey" placeholder="Groq API Key" style="padding:10px; width:100%; background:#161b22; border:1px solid #30363d; color:white;">
    
    <textarea id="rawInput" placeholder="Paste generated post here..."></textarea>
    
    <button class="btn" onclick="humanize()">Refine & Humanize</button>
    
    <div id="output"></div>
</div>

<script>
async function humanize() {
    const output = document.getElementById('output');
    output.innerText = "Refining tone to human counselor style...";
    
    const prompt = `You are a deeply empathetic, human Vedic Astrologer and Counselor. Your task is to take the provided text and rewrite it to sound 100% human, counseling, and peer-to-peer.
    
    RULES:
    1. COUNSELING TONE: Instead of 'The chart shows', write 'Bhai, main samajh sakta hoon yeh kitna frustrating hota hai'. Be supportive yet blunt.
    2. REDUCE COMPLEXITY: Remove stiff technical flow. Explain the planetary logic as if you are talking to a friend on a call.
    3. ADD IMPERFECTION: Use conversational filler naturally (e.g., 'Sach bolu toh', 'Ek baat notice karo', 'Worry mat karo').
    4. BREAK PATTERNS: Ensure no two paragraphs start with the same structure. 
    5. FINAL CHECK: Make it sound like a Reddit comment by a veteran user, not an AI output.`;

    const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
        method: "POST",
        headers: { "Authorization": `Bearer ${document.getElementById('apiKey').value}`, "Content-Type": "application/json" },
        body: JSON.stringify({
            model: "llama-3.3-70b-versatile",
            messages: [
                { role: "system", content: prompt },
                { role: "user", content: document.getElementById('rawInput').value }
            ],
            temperature: 0.8
        })
    });

    const data = await response.json();
    output.innerText = data.choices[0].message.content;
}
</script>
</body>
</html>
