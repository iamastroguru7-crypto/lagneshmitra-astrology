<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Raw/Unpolished Reddit Engine v9.0</title>
    <style>
        body { background: #000; color: #ccc; font-family: monospace; padding: 20px; }
        .box { background: #111; padding: 15px; border: 1px solid #333; margin-bottom: 10px; }
        textarea, input { width: 100%; background: #050505; color: #0f0; border: 1px solid #222; padding: 10px; }
        button { width: 100%; padding: 15px; background: #222; color: #fff; cursor: pointer; border: 1px solid #444; }
        #output { margin-top: 20px; white-space: pre-wrap; padding: 20px; border: 1px dashed #333; }
    </style>
</head>
<body>
    <h2>UNPOLISHED REDDIT FORGER v9.0</h2>
    <input type="password" id="key" placeholder="Groq Key">
    <textarea id="data" rows="5" placeholder="Natal/Dasha data"></textarea>
    <button onclick="run()">GENERATE RAW TEXT</button>
    <div id="output"></div>

<script>
async function run() {
    const output = document.getElementById('output');
    output.innerText = "Generating...";
    
    const prompt = `You are a dude on Reddit. You write like a normal person who hates typing.
    
    RULES:
    1. ZERO POLISH: Use lowercase mostly. Skip commas. Use bad grammar on purpose.
    2. SLANGS: Use 'bhai', 'yaar', 'lafda', 'bc' (if appropriate), 'scene', 'dimag ka dahi'.
    3. SHORT & CHOPPY: Write like you're texting a friend. No long fancy intros.
    4. NO AI STRUCTURE: Do not use bullet points or organized headers. Just write a paragraph or two.
    5. KEEP IT REAL: If the chart looks bad say it's bad. If it's good say it's good. No "hopeful" fake AI tone.
    6. ANTI-DETECTION: Mix short sentences (3 words) with medium ones. 
    
    INPUT DATA: ${document.getElementById('data').value}`;

    const res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
        method: "POST",
        headers: { "Authorization": `Bearer ${document.getElementById('key').value}`, "Content-Type": "application/json" },
        body: JSON.stringify({
            model: "llama-3.3-70b-versatile",
            messages: [{ role: "system", content: prompt }, { role: "user", content: "Write the post now." }],
            temperature: 0.9 // High randomness for "unpolished" feel
        })
    });
    const d = await res.json();
    output.innerText = d.choices[0].message.content;
}
</script>
</body>
</html>
