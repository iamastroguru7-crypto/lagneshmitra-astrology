<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | LagneshMitra</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
    
    <style>
        body { 
            margin: 0; 
            height: 100vh; 
            display: flex; 
            justify-content: center; 
            align-items: center;
            background: url('background2.png') no-repeat center center fixed; 
            background-size: cover; 
            font-family: 'Segoe UI', sans-serif;
        }
        .login-box { 
            background: rgba(21, 23, 30, 0.85); 
            padding: 40px; 
            border-radius: 20px; 
            border: 1px solid rgba(255,255,255,0.1);
            text-align: center; 
            backdrop-filter: blur(12px); 
            width: 85%;
            max-width: 320px;
        }
        h2 { color: #fff; margin-bottom: 30px; font-weight: 300; }
        
        /* Stylish G Button */
        .g-btn { 
            background: #ffffff; 
            color: #333; 
            border: none; 
            padding: 12px 20px; 
            border-radius: 50px; 
            cursor: pointer; 
            font-weight: 600;
            display: flex; 
            align-items: center; 
            justify-content: center; 
            gap: 12px;
            transition: all 0.3s ease; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            width: 100%;
        }
        .g-btn:hover { background: #f0f0f0; transform: translateY(-2px); }
        .g-icon { width: 20px; height: 20px; }
        #status { color: #888; font-size: 14px; }
    </style>
</head>
<body>

<div class="login-box">
    <h2>LagneshMitra</h2>
    <div id="status">Loading...</div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyBzLT95nrwLDu-bYGVJdstUKQ6tEL2GM2w",
        authDomain: "lagneshmitra-astrology-e72fb.firebaseapp.com",
        projectId: "lagneshmitra-astrology-e72fb",
        storageBucket: "lagneshmitra-astrology-e72fb.firebasestorage.app",
        messagingSenderId: "223772639779",
        appId: "1:223772639779:web:49341578713e2c0c9ae796"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const statusDiv = document.getElementById('status');

    auth.onAuthStateChanged((user) => {
        if (user) {
            window.location.href = 'terms.html';
        } else {
            statusDiv.innerHTML = `
                <button class="g-btn" id="loginBtn">
                    <svg class="g-icon" viewBox="0 0 48 48">
                        <path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.5l6.8-6.8C35.5 2.6 30.2 0 24 0 14.8 0 7 5.7 3.5 13.9l7.9 6.1C13.2 13.7 18.2 9.5 24 9.5z"/>
                        <path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.2-.4-4.7H24v9.4h12.7c-.6 3.1-2.3 5.7-4.8 7.5l7.7 6c4.5-4.2 7.1-10.4 7.1-18.2z"/>
                        <path fill="#FBBC05" d="M11.4 28.7c-1.1-3.2-1.1-6.7 0-9.9l-7.9-6.1C1.2 17.5 0 20.7 0 24c0 3.3 1.2 6.5 3.5 9.1l7.9-6.1z"/>
                        <path fill="#34A853" d="M24 48c6.5 0 12-2.1 16-5.8l-7.7-6c-2.1 1.5-4.8 2.4-8.3 2.4-5.8 0-10.7-3.9-12.5-9.1l-7.9 6.1C7 42.3 14.8 48 24 48z"/>
                    </svg>
                    Continue with Google
                </button>`;
            
            document.getElementById('loginBtn').addEventListener('click', () => {
                const provider = new firebase.auth.GoogleAuthProvider();
                auth.signInWithPopup(provider).catch((error) => {
                    alert("Error: " + error.message);
                });
            });
        }
    });
</script>
</body>
</html>
