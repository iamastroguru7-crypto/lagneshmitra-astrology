<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LagneshMitra | Auth Gateway</title>
    <style>
        body { background: #0a0b10; color: #fff; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-box { background: #15171e; padding: 40px; border-radius: 12px; width: 300px; text-align: center; border: 1px solid #333; }
        .google-btn { background: #fff; color: #333; border: none; padding: 12px; width: 100%; font-weight: bold; cursor: pointer; border-radius: 4px; }
    </style>
</head>
<body>

<div class="login-box">
    <h2>Auth Gateway</h2>
    <button id="googleLoginBtn" class="google-btn">Continue with Google</button>
    <p id="status" style="font-size: 10px; margin-top: 15px; color: #666;"></p>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-app.js";
    import { getAuth, signInWithRedirect, GoogleAuthProvider, getRedirectResult } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBzLT95nrwLDu-bYGVJdstUKQ6tEL2GM2w",
        authDomain: "lagneshmitra-astrology-e72fb.firebaseapp.com",
        projectId: "lagneshmitra-astrology-e72fb",
        storageBucket: "lagneshmitra-astrology-e72fb.firebasestorage.app",
        messagingSenderId: "223772639779",
        appId: "1:223772639779:web:49341578713e2c0c9ae796"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const provider = new GoogleAuthProvider();

    // 1. Login button click -> Redirect to Google
    document.getElementById('googleLoginBtn').addEventListener('click', () => {
        signInWithRedirect(auth, provider);
    });

    // 2. Page load hone par check karein ki kya login ho gaya?
    getRedirectResult(auth).then((result) => {
        if (result) {
            window.location.href = 'terms.html';
        }
    }).catch((error) => {
        document.getElementById('status').innerText = "Error: " + error.message;
    });
</script>

</body>
</html>
