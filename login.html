<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login | LagneshMitra</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
</head>
<body>

<div id="status">Authenticating...</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyBzLT95nrwLDu-bYGVJdstUKQ6tEL2GM2w",
        authDomain: "lagneshmitra-astrology-e72fb.firebaseapp.com",
        projectId: "lagneshmitra-astrology-e72fb",
        storageBucket: "lagneshmitra-astrology-e72fb.firebasestorage.app",
        messagingSenderId: "223772639779",
        appId: "1:223772639779:web:49341578713e2c0c9ae796"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();

    // 1. Check if already logged in
    auth.onAuthStateChanged((user) => {
        if (user) {
            window.location.href = 'terms.html';
        } else {
            document.getElementById('status').innerHTML = '<button id="btn">Continue with Google</button>';
            document.getElementById('btn').addEventListener('click', () => {
                const provider = new firebase.auth.GoogleAuthProvider();
                
                // POPUP method use karenge - yeh redirect se zyada stable hai
                auth.signInWithPopup(provider).then((result) => {
                    window.location.href = 'terms.html';
                }).catch((error) => {
                    alert("Popup Error: " + error.message);
                });
            });
        }
    });
</script>
</body>
</html>
