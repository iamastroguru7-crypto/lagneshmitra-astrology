<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | LagneshMitra</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
    
    <style>
        body { 
            margin: 0; 
            height: 100vh; 
            display: flex; 
            justify-content: center; 
            align-items: center;
            background: url('background2.png') no-repeat center center fixed; 
            background-size: cover; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .login-box { 
            background: rgba(21, 23, 30, 0.85); 
            padding: 40px; 
            border-radius: 20px; 
            border: 1px solid rgba(255,255,255,0.1);
            text-align: center; 
            backdrop-filter: blur(12px); 
            width: 85%;
            max-width: 320px;
        }
        h2 { color: #fff; margin-bottom: 30px; font-weight: 300; letter-spacing: 1px; }
        
        /* Stylish G Button */
        .g-btn { 
            background: #ffffff; 
            color: #333; 
            border: none; 
            padding: 12px 20px; 
            border-radius: 50px; 
            cursor: pointer; 
            font-weight: 600;
            display: flex; 
            align-items: center; 
            justify-content: center; 
            gap: 12px;
            transition: all 0.3s ease; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            width: 100%;
        }
        .g-btn:hover { 
            background: #f0f0f0; 
            transform: translateY(-2px); 
        }
        .g-icon { width: 20px; height: 20px; }
        #status { color: #888; font-size: 14px; }
    </style>
</head>
<body>

<div class="login-box">
    <h2>LagneshMitra</h2>
    <div id="status">Authenticating...</div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyBzLT95nrwLDu-bYGVJdstUKQ6tEL2GM2w",
        authDomain: "lagneshmitra-astrology-e72fb.firebaseapp.com",
        projectId: "lagneshmitra-astrology-e72fb",
        storageBucket: "lagneshmitra-astrology-e72fb.firebasestorage.app",
        messagingSenderId: "223772639779",
        appId: "1:223772639779:web:49341578713e2c0c9ae796"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const statusDiv = document.getElementById('status');

    auth.onAuthStateChanged((user) => {
        if (user) {
            window.location.href = 'terms.html';
        } else {
            statusDiv.innerHTML = `
                <button class="g-btn" id="loginBtn">
                    <img class="g-icon" src="https://upload.wikimedia.org/wikipedia/commons/thumb/c/c1/Google_%22G%22_logo.svg/1200px-Google_%22G%22_logo.svg.png" alt="G">
                    Continue with Google
                </button>`;
            
            document.getElementById('loginBtn').addEventListener('click', () => {
                const provider = new firebase.auth.GoogleAuthProvider();
                auth.signInWithPopup(provider).catch((error) => {
                    alert("Error: " + error.message);
                });
            });
        }
    });
</script>
</body>
</html>
