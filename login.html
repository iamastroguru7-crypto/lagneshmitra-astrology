<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>LagneshMitra | Auth Gateway</title>
</head>
<body>
    <button id="googleLoginBtn">Continue with Google</button>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-auth.js";
        import { getAnalytics } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-analytics.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBzLT95nrwLDu-bYGVJdstUKQ6tEL2GM2w",
            authDomain: "lagneshmitra-astrology-e72fb.firebaseapp.com",
            projectId: "lagneshmitra-astrology-e72fb",
            storageBucket: "lagneshmitra-astrology-e72fb.firebasestorage.app",
            messagingSenderId: "223772639779",
            appId: "1:223772639779:web:49341578713e2c0c9ae796",
            measurementId: "G-KN4F9HFQPD"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();
        const analytics = getAnalytics(app);

        document.getElementById('googleLoginBtn').addEventListener('click', () => {
            signInWithPopup(auth, provider)
                .then((result) => {
                    // Login Success -> Ab user ko T&C page pe bhejenge
                    window.location.href = 'terms.html';
                })
                .catch((error) => {
                    console.error("Auth Error:", error);
                    alert("Login failed. Check console.");
                });
        });
    </script>
</body>
</html>
