<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LagneshMitra Auth</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
    <style>
        body { background: #0a0b10; color: #fff; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .box { background: #15171e; padding: 40px; border-radius: 10px; border: 1px solid #333; text-align: center; }
        #loginBtn { background: #444; color: #fff; border: none; padding: 15px 25px; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>

<div class="box">
    <h2 id="status">Loading...</h2>
    <button id="loginBtn">Continue with Google</button>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyBzLT95nrwLDu-bYGVJdstUKQ6tEL2GM2w",
        authDomain: "lagneshmitra-astrology-e72fb.firebaseapp.com",
        projectId: "lagneshmitra-astrology-e72fb",
        storageBucket: "lagneshmitra-astrology-e72fb.firebasestorage.app",
        messagingSenderId: "223772639779",
        appId: "1:223772639779:web:49341578713e2c0c9ae796"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const btn = document.getElementById('loginBtn');
    const status = document.getElementById('status');

    // JS Load hote hi button ka color change hoga
    btn.style.background = "#ffb400";
    btn.style.color = "#000";
    status.innerText = "Auth Gateway";

    btn.addEventListener('click', () => {
        const provider = new firebase.auth.GoogleAuthProvider();
        auth.signInWithRedirect(provider).catch(e => alert(e.message));
    });
</script>

</body>
</html>
