<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LagneshMitra Gallery</title>

<style>

body{
    margin:0;
    padding:0;
    font-family:Arial, sans-serif;
    background:#0f172a;
    color:white;
}

.container{
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    text-align:center;
    padding:20px;
}

h1{
    font-size:2.2rem;
    margin-bottom:10px;
}

p{
    color:#cbd5e1;
    margin-bottom:35px;
}

.button-group{
    display:flex;
    gap:20px;
    flex-wrap:wrap;
    justify-content:center;
}

.gallery-btn{
    background:#2563eb;
    color:white;
    text-decoration:none;
    padding:15px 35px;
    border-radius:10px;
    font-size:18px;
    font-weight:bold;
    transition:0.3s;
}

.gallery-btn:hover{
    transform:translateY(-3px);
    background:#1d4ed8;
}

</style>

</head>
<body>

<div class="container">

    <h1>📚 LagneshMitra Gallery</h1>

    <p>
        Choose your destination
    </p>

    <div class="button-group">

        <a href="posts.html" class="gallery-btn">
            📚 Posts
        </a>

        <a href="research.html" class="gallery-btn">
            💎 Research Materials
        </a>

    </div>

</div>

</body>
</html>
