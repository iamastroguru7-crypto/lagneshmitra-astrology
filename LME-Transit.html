<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maha Astro AI v5.5 - Intelligent Timeline Parser</title>
    <style>
        :root {
            --bg-dark: #020204;
            --panel-bg: #07070d;
            --alert-amber: #ff9900;
            --neon-blue: #00e5ff;
            --success-green: #00ff66;
            --border-color: #1a1a2e;
            --text-pure: #eef0f6;
        }
        body {
            background-color: var(--bg-dark);
            color: var(--text-pure);
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 900px;
        }
        .header-console {
            text-align: center;
            border: 2px solid var(--neon-blue);
            background: #000c14;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 30px;
            box-shadow: 0 0 20px rgba(0, 229, 255, 0.15);
        }
        .header-console h1 {
            color: var(--neon-blue);
            margin: 0 0 5px 0;
            letter-spacing: 3px;
            font-size: 22px;
        }
        .header-console p {
            color: var(--alert-amber);
            font-weight: bold;
            margin: 5px 0 0 0;
            font-size: 11px;
            text-transform: uppercase;
        }
        .panel-node {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.6);
            margin-bottom: 20px;
        }
        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 15px;
        }
        label {
            display: block;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--neon-blue);
            margin-bottom: 6px;
            font-weight: bold;
        }
        textarea, input {
            width: 100%;
            background: #0c0c16;
            border: 1px solid var(--border-color);
            color: #fff;
            padding: 12px;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 13px;
            font-family: monospace;
            transition: 0.3s ease;
        }
        textarea:focus, input:focus {
            border-color: var(--neon-blue);
            outline: none;
        }
        .parse-btn {
            background: linear-gradient(135deg, #0099ff, #003366);
            border: 1px solid var(--neon-blue);
            color: white;
            padding: 10px 15px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
            text-transform: uppercase;
            margin-top: 10px;
            width: 100%;
            letter-spacing: 1px;
        }
        .parse-btn:hover {
            box-shadow: 0 0 15px rgba(0, 229, 255, 0.4);
        }
        .trigger-btn {
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, #cc7a00, #4d2e00);
            color: #fff;
            border: 1px solid var(--alert-amber);
            border-radius: 4px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            letter-spacing: 2px;
            text-transform: uppercase;
            box-shadow: 0 4px 15px rgba(255, 153, 0, 0.2);
            transition: 0.2s;
        }
        .trigger-btn:hover {
            background: linear-gradient(135deg, var(--alert-amber), #cc7a00);
            box-shadow: 0 0 25px rgba(255, 153, 0, 0.4);
        }
        .report-canvas {
            background: #010103;
            border: 1px solid var(--border-color);
            border-top: 4px solid var(--alert-amber);
            padding: 35px;
            border-radius: 4px;
            margin-top: 35px;
            line-height: 1.8;
            font-size: 15px;
            display: none;
            color: #e1e4ed;
            white-space: pre-wrap;
        }
        .status-ticker {
            color: var(--neon-blue);
            font-style: italic;
            font-size: 13px;
            text-align: center;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse { 0% { opacity: 0.4; } 50% { opacity: 1; } 100% { opacity: 0.4; } }
    </style>
</head>
<body>

<div class="container">
    <div class="header-console">
        <h1>INTELLIGENT ASTRO DATA & TIMELINE RADAR</h1>
        <p>[ INTELLIGENT TEXT PARSER • EXACT TRANSIT INTERSECTION ENGINE ]</p>
    </div>

    <!-- API Core -->
    <div class="panel-node">
        <label>Groq Master Key</label>
        <input type="password" id="apiKey" placeholder="gsk_xxxxxxxxxxxxxxxxxxxx">
    </div>

    <!-- STEP 1: RAW INGESTION PARSER -->
    <div class="panel-node" style="border: 1px dashed var(--neon-blue);">
        <label style="color: var(--success-green);">⚡ STEP 1: Raw Chart Copy-Paste Area (Any Software/Web Format)</label>
        <textarea id="rawInput" rows="5" placeholder="Paste dirty chart tables, planet lists, degrees, or random text copied from astro sites..."></textarea>
        <button class="parse-btn" onclick="parseRawChartData()">Convert Chart to Structured Text Matrix</button>
    </div>

    <!-- STEP 2: MAIN COMPILATION CHANNELS -->
    <div class="panel-node">
        <label>⚡ STEP 2: Refined Natal Matrix (Auto-Filled or Manual)</label>
        <textarea id="chartData" rows="4" placeholder="Structured text data will appear here..."></textarea>
        <br><br>
        <div class="grid-2">
            <div>
                <label>Live Transits (Gochar Coordinates)</label>
                <textarea id="transitData" rows="6" placeholder="Enter current positions of Saturn, Rahu, Ketu, Mars..."></textarea>
            </div>
            <div>
                <label>Vimshottari Dasha Sequences</label>
                <textarea id="dashaData" rows="6" placeholder="Paste active Mahadasha, Antardasha, and Pratyantardasha dates..."></textarea>
            </div>
        </div>
        <label>Patient/Case Current State Context</label>
        <textarea id="contextData" rows="2" placeholder="e.g., Hospitalized with severe infection since yesterday..."></textarea>
    </div>

    <!-- Compute -->
    <button class="trigger-btn" onclick="calculateTransitDates()">Intersect & Extract Dates</button>

    <!-- Output -->
    <div id="reportCanvas" class="report-canvas"></div>
</div>

<script>
window.onload = function() {
    if (localStorage.getItem('savedAstroKey')) {
        document.getElementById('apiKey').value = localStorage.getItem('savedAstroKey');
    }
}

// 🧠 NEW: Smart Client-Side Parser to clean raw text copies instantly before hit
function parseRawChartData() {
    const rawText = document.getElementById('rawInput').value.trim();
    if (!rawText) {
        alert("Please paste some raw chart data first!");
        return;
    }
    
    // Quick regex cleaning to map common table strings into a clean markdown format
    let cleaned = rawText
        .replace(/(\r\n|\n|\r)/gm, "\n") // normalize breaks
        .replace(/\t/g, " | ")           // convert tabs to table pipes
        .replace(/ +(?= )/g, '');        // remove double spaces

    document.getElementById('chartData').value = `[AUTO-PARSED NATAL MATRIX]:\n${cleaned}`;
    alert("Data Converted & Shifted to Step 2! Check the matrix below.");
}

async function calculateTransitDates() {
    const apiKey = document.getElementById('apiKey').value.trim();
    const chartData = document.getElementById('chartData').value.trim();
    const transitData = document.getElementById('transitData').value.trim();
    const dashaData = document.getElementById('dashaData').value.trim();
    const contextData = document.getElementById('contextData').value.trim();
    const reportCanvas = document.getElementById('reportCanvas');

    if (!apiKey || !transitData || !dashaData) {
        alert("System Error: Transits or Dasha sequences are required.");
        return;
    }

    localStorage.setItem('savedAstroKey', apiKey);
    reportCanvas.style.display = "block";
    reportCanvas.innerHTML = '<div class="status-ticker">DECODING TEXT MATRIX... CORRELATING TIMELINES... EXTRACTING ABSOLUTE DATE WINDOWS...</div>';

    const timelinePrompt = `You are running under the 'LagneshMitra Custom Cadence Layer v5.5'. You are a blunt, precision-driven Vedic Astrologer analyzing a critical situation. Your input contains a text-mapped chart matrix, live transits, and dasha dates. You must output absolute, point-blank calendar date windows.

STRICT RULES:
1. NO AI SIGNALS (In conclusion, Furthermore, Moreover, It is important to note).
2. Write in English with a raw, direct, human rhythm.
3. Keep it crisp, technical, and focused heavily on exact date ranges.

STRUCTURE:
[1. RADICAL DIAGNOSIS OF THE PARSED MATRIX]
- Briefly read the auto-parsed planet positions to identify the core weakness (Lagna, 6th, or 8th house).

[2. THE PEAK FRICTION TIMELINE (EXACT DATES)]
- State clearly: 'The absolute peak of this crisis runs from [Date] to [Date].'
- Break down the next phase (e.g., 'The next 10-15 days/months layout'). Detail whether the pressure is continuous or spikes on specific days.

[3. THE COOLING WINDOW (WHEN PRESSURE LIFTS)]
- Give a definitive date window where stability returns.`;

    try {
        const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
            method: "POST",
            headers: {
                "Authorization": `Bearer ${apiKey}`,
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                model: "llama-3.3-70b-versatile",
                messages: [
                    { role: "system", content: timelinePrompt },
                    { role: "user", content: `[CHART DATA MATRIX]:\n${chartData}\n\n[LIVE GOCHAR TRANSITS]:\n${transitData}\n\n[VIMSHOTTARI SEQUENCES]:\n${dashaData}\n\n[CONTEXT]:\n${contextData}` }
                ],
                temperature: 0.3,
                top_p: 0.9
            })
        });

        const data = await response.json();
        if (response.ok && data.choices && data.choices[0]) {
            reportCanvas.innerText = data.choices[0].message.content;
        } else {
            reportCanvas.innerText = data.error ? data.error.message : "Error compiling timeline.";
        }
    } catch (error) {
        reportCanvas.innerText = `Link Disrupted: ${error.message}`;
    }
}
</script>

</body>
</html>
