<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maha Astro AI v6.0 - Automation Terminal</title>
    <style>
        :root {
            --bg-dark: #020204;
            --panel-bg: #07070d;
            --alert-amber: #ff9900;
            --neon-blue: #00e5ff;
            --success-green: #00ff66;
            --border-color: #1a1a2e;
            --text-pure: #eef0f6;
        }
        body {
            background-color: var(--bg-dark);
            color: var(--text-pure);
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 900px;
        }
        .header-console {
            text-align: center;
            border: 2px solid var(--neon-blue);
            background: #000c14;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 30px;
            box-shadow: 0 0 20px rgba(0, 229, 255, 0.15);
        }
        .header-console h1 {
            color: var(--neon-blue);
            margin: 0 0 5px 0;
            letter-spacing: 3px;
            font-size: 22px;
        }
        .header-console p {
            color: var(--alert-amber);
            font-weight: bold;
            margin: 5px 0 0 0;
            font-size: 11px;
            text-transform: uppercase;
        }
        .panel-node {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.6);
            margin-bottom: 20px;
        }
        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 15px;
        }
        label {
            display: block;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--neon-blue);
            margin-bottom: 6px;
            font-weight: bold;
        }
        textarea, input {
            width: 100%;
            background: #0c0c16;
            border: 1px solid var(--border-color);
            color: #fff;
            padding: 12px;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 13px;
            font-family: monospace;
            transition: 0.3s ease;
        }
        textarea:focus, input:focus {
            border-color: var(--neon-blue);
            outline: none;
        }
        .parse-btn {
            background: linear-gradient(135deg, #0099ff, #003366);
            border: 1px solid var(--neon-blue);
            color: white;
            padding: 10px 15px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
            text-transform: uppercase;
            margin-top: 10px;
            width: 100%;
            letter-spacing: 1px;
        }
        .parse-btn:hover {
            box-shadow: 0 0 15px rgba(0, 229, 255, 0.4);
        }
        .trigger-btn {
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, #cc7a00, #4d2e00);
            color: #fff;
            border: 1px solid var(--alert-amber);
            border-radius: 4px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            letter-spacing: 2px;
            text-transform: uppercase;
            box-shadow: 0 4px 15px rgba(255, 153, 0, 0.2);
            transition: 0.2s;
        }
        .trigger-btn:hover {
            background: linear-gradient(135deg, var(--alert-amber), #cc7a00);
            box-shadow: 0 0 25px rgba(255, 153, 0, 0.4);
        }
        .report-canvas {
            background: #010103;
            border: 1px solid var(--border-color);
            border-top: 4px solid var(--alert-amber);
            padding: 35px;
            border-radius: 4px;
            margin-top: 35px;
            line-height: 1.8;
            font-size: 15px;
            display: none;
            color: #e1e4ed;
            white-space: pre-wrap;
        }
        .status-ticker {
            color: var(--neon-blue);
            font-style: italic;
            font-size: 13px;
            text-align: center;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse { 0% { opacity: 0.4; } 50% { opacity: 1; } 100% { opacity: 0.4; } }
    </style>
</head>
<body>

<div class="container">
    <div class="header-console">
        <h1>AUTOMATED TRANSIT TIMELINE SCANNER</h1>
        <p>[ POKRELA BYPASS MATRIX • LIVE DATE EXTRACTION ENGINE ]</p>
    </div>

    <!-- API Core -->
    <div class="panel-node">
        <label>Groq Master Key</label>
        <input type="password" id="apiKey" placeholder="gsk_xxxxxxxxxxxxxxxxxxxx">
    </div>

    <!-- STEP 1: RAW INGESTION PARSER -->
    <div class="panel-node" style="border: 1px dashed var(--neon-blue);">
        <label style="color: var(--success-green);">⚡ STEP 1: Paste Pokrela Raw Text Data (Natal / Navamsa Tables)</label>
        <textarea id="rawInput" rows="5" placeholder="Paste raw text grids or copied rows directly here..."></textarea>
        <button class="parse-btn" onclick="parseRawChartData()">Convert & Structure Data Matrix</button>
    </div>

    <!-- STEP 2: MAIN COMPILATION CHANNELS -->
    <div class="panel-node">
        <label>⚡ STEP 2: Structured Natal / Navamsa Matrix</label>
        <textarea id="chartData" rows="4" placeholder="Parsed data will auto-populate here..."></textarea>
        <br><br>
        <div class="grid-2">
            <div>
                <label>Live Transits (Leave blank for 2026 Auto-Engine)</label>
                <textarea id="transitData" rows="6" placeholder="If left empty, current July 2026 transits will automatically load in background..."></textarea>
            </div>
            <div>
                <label>Vimshottari Dasha Sequences</label>
                <textarea id="dashaData" rows="6" placeholder="Paste running Mahadasha, Antardasha, and Pratyantardasha timelines..."></textarea>
            </div>
        </div>
        <label>Patient/Case Context & Status</label>
        <textarea id="contextData" rows="2" placeholder="Describe current crisis status or medical intensity..."></textarea>
    </div>

    <!-- Compute -->
    <button class="trigger-btn" onclick="calculateTransitDates()">Intersect & Extract Dates</button>

    <!-- Output -->
    <div id="reportCanvas" class="report-canvas"></div>
</div>

<script>
window.onload = function() {
    if (localStorage.getItem('savedAstroKey')) {
        document.getElementById('apiKey').value = localStorage.getItem('savedAstroKey');
    }
}

function parseRawChartData() {
    const rawText = document.getElementById('rawInput').value.trim();
    if (!rawText) {
        alert("Paste some raw text first!");
        return;
    }
    let cleaned = rawText
        .replace(/(\r\n|\n|\r)/gm, "\n")
        .replace(/\t/g, " | ")
        .replace(/ +(?= )/g, '');

    document.getElementById('chartData').value = `[PARSED MATRIX DATA]:\n${cleaned}`;
    alert("Data matrix formatted successfully!");
}

async function calculateTransitDates() {
    const apiKey = document.getElementById('apiKey').value.trim();
    const chartData = document.getElementById('chartData').value.trim();
    let transitData = document.getElementById('transitData').value.trim();
    const dashaData = document.getElementById('dashaData').value.trim();
    const contextData = document.getElementById('contextData').value.trim();
    const reportCanvas = document.getElementById('reportCanvas');

    if (!apiKey || !dashaData) {
        alert("System Error: API Key or Dasha timeline data is missing.");
        return;
    }

    // 🤖 POKRELA BYPASS: Auto-load 2026 transit data if the box is empty
    if (!transitData) {
        transitData = `[AUTOMATED ENGINE DIRECTIVE - YEAR 2026]: 
- Transit Saturn: Retrograde/Direct movements in Aquarius (Kumbha Rashi) hitting natal placements.
- Transit Jupiter: Transiting through Taurus (Vrishabha Rashi) casting aspects on houses.
- Transit Rahu: Pisces (Meena) / Transit Ketu: Virgo (Kanya) axis active on critical degrees.
- Transit Mars: Moving through fast high-intensity nodes creating heat over critical points.`;
    }

    localStorage.setItem('savedAstroKey', apiKey);
    reportCanvas.style.display = "block";
    reportCanvas.innerHTML = '<div class="status-ticker">BYPASSING IMAGE CONSTRAINTS... INTERSECTING DASHAS WITH BACKGROUND LIVE TRANSITS... COMPILING CALENDAR TIMELINES...</div>';

    const timelinePrompt = `You are running under the 'LagneshMitra Custom Cadence Layer v6.0'. You are a blunt, precision-driven Vedic Astrologer analyzing a critical case. Your task is to look at the chart layout, dasha blocks, and live transits to spit out absolute point-blank calendar timelines.

STRICT WRITING RULES:
1. NO AI SIGNALS (In conclusion, Furthermore, Moreover, It is important to note).
2. Write in English with a raw, conversational, yet highly clinical rhythm.
3. Be direct. Immediately lay down the target dates and duration ranges without long generic introductions.

OUTPUT FORMAT REQUIREMENTS:

[1. IMPACT ANALYSIS OF ACTIVE NODES]
- Read the parsed natal/navamsa text block and immediately address the structural weakness relative to the current emergency context.

[2. THE PEAK CRISIS DURATION (EXACT DATES)]
- State clearly: 'The absolute peak of this crisis runs from [Date] to [Date].'
- Clearly address the next phase layout (e.g., 'The next 10-15 days/months layout'). Outline when the patient requires extreme, high-level clinical and personal care.

[3. THE RELIEF GATEWAY]
- Specify the exact week or date range where the heavy dasha friction clears up or the fast transit separation begins, allowing the situation to cool down.`;

    try {
        const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
            method: "POST",
            headers: {
                "Authorization": `Bearer ${apiKey}`,
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                model: "llama-3.3-70b-versatile",
                messages: [
                    { role: "system", content: timelinePrompt },
                    { role: "user", content: `[CHART MATRIX]:\n${chartData || "Provided via Step 1"}\n\n[LIVE TRANSITS]:\n${transitData}\n\n[VIMSHOTTARI TIMELINES]:\n${dashaData}\n\n[CONTEXT]:\n${contextData}` }
                ],
                temperature: 0.35,
                top_p: 0.9
            })
        });

        const data = await response.json();
        if (response.ok && data.choices && data.choices[0]) {
            reportCanvas.innerText = data.choices[0].message.content;
        } else {
            reportCanvas.innerText = data.error ? data.error.message : "Error establishing API matrix links.";
        }
    } catch (error) {
        reportCanvas.innerText = `Automation Interrupted: ${error.message}`;
    }
}
</script>

</body>
</html>
