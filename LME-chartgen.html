<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Engine v2.6 | Chart Generator</title>
    <style>
        :root { --bg-color: #0a0a0f; --panel-bg: #12121a; --accent-color: #ff3333; --text-color: #e2e2e9; }
        body { background-color: var(--bg-color); color: var(--text-color); font-family: 'Segoe UI', sans-serif; padding: 20px; }
        .panel { background: var(--panel-bg); padding: 20px; border-radius: 12px; border: 1px solid #2a2a3a; margin-bottom: 15px; }
        input, textarea { width: 100%; padding: 10px; background: #1a1a26; border: 1px solid #2a2a3a; color: white; border-radius: 6px; margin-bottom: 10px; box-sizing: border-box; }
        button { width: 100%; padding: 15px; background: var(--accent-color); border: none; border-radius: 6px; color: white; font-weight: bold; cursor: pointer; }
        .output { background: #0d0d14; padding: 20px; border-left: 4px solid var(--accent-color); margin-top: 20px; white-space: pre-wrap; }
    </style>
</head>
<body>

<div class="panel">
    <input type="password" id="apiKey" placeholder="Groq API Key (gsk_...)">
    <input type="text" id="dob" placeholder="DOB (YYYY-MM-DD)">
    <input type="text" id="tob" placeholder="TOB (HH:MM)">
    <input type="text" id="pob" placeholder="POB (City, Country)">
    <button onclick="generateChart()">Generate Chart Data</button>
</div>

<div id="output" class="output" style="display:none;"></div>

<script>
async function generateChart() {
    const out = document.getElementById('output');
    const prompt = `Act as an expert Vedic Astrologer. For the birth details: 
    Date: ${document.getElementById('dob').value}, 
    Time: ${document.getElementById('tob').value}, 
    Place: ${document.getElementById('pob').value}. 
    Calculate and provide:
    1. Ascendant (Lagna) sign and degree.
    2. D1 planetary positions (Rashi and Degree).
    3. D9 (Navamsa) planetary positions.
    4. Current Mahadasha/Antardasha.
    Provide the output in a clean, structured list format.`;

    out.style.display = "block";
    out.innerText = "Calculating planetary matrix...";

    const res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
        method: "POST",
        headers: { "Authorization": `Bearer ${document.getElementById('apiKey').value}`, "Content-Type": "application/json" },
        body: JSON.stringify({
            model: "llama-3.3-70b-versatile",
            messages: [{ role: "user", content: prompt }]
        })
    });
    const data = await res.json();
    out.innerText = data.choices[0].message.content;
}
</script>
</body>
</html>
