<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Internal Brutal Astro Engine v2.5</title>
    <!-- Library for Word Export -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html-docx-js/0.3.1/html-docx.js"></script>
    <style>
        :root {
            --bg-color: #0a0a0f;
            --panel-bg: #12121a;
            --accent-color: #ff3333;
            --text-color: #e2e2e9;
            --border-color: #2a2a3a;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .wrapper { width: 100%; max-width: 800px; }
        header { text-align: center; margin-bottom: 30px; }
        header h1 { color: var(--accent-color); margin-bottom: 5px; letter-spacing: 2px; }
        .panel { background: var(--panel-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 25px; margin-bottom: 20px; }
        label { display: block; font-weight: bold; margin-bottom: 8px; color: #aaa; }
        input, textarea, select { width: 100%; padding: 12px; background: #1a1a26; border: 1px solid var(--border-color); color: #fff; border-radius: 6px; box-sizing: border-box; margin-bottom: 15px; font-size: 15px; }
        .btn-group { display: flex; gap: 10px; flex-direction: column; }
        button { padding: 14px; background: var(--accent-color); color: #fff; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 16px; width: 100%; }
        button.secondary { background: #2a2a3a; border: 1px solid var(--border-color); }
        .output-box { background: #0d0d14; border-left: 4px solid var(--accent-color); padding: 20px; border-radius: 4px; white-space: pre-wrap; line-height: 1.7; display: none; min-height: 100px; }
    </style>
</head>
<body>

<div class="wrapper">
    <header>
        <h1>CORE ASTRO LOGIC ENGINE v2.5</h1>
        <p>[ ADMIN PANEL - ABROAD TIMELINE RUNTIME ]</p>
    </header>

    <div class="panel">
        <label>Groq API Key</label>
        <input type="password" id="apiKey" placeholder="gsk_xxxxxxxxxxxxxxxxxxxx">
        
        <label>Report Style</label>
        <select id="reportStyle">
            <option value="heavy">Heavy Technical Analysis</option>
            <option value="lite">Lite Insights</option>
            <option value="short">Short/Actionable</option>
        </select>
    </div>

    <div class="panel">
        <label>D1 Placements</label>
        <textarea id="chartData" rows="6"></textarea>
        
        <label>Vimshottari Dasha</label>
        <textarea id="dashaData" rows="4"></textarea>

        <label>Specific Query</label>
        <textarea id="userQuery" rows="2"></textarea>

        <div class="btn-group">
            <button onclick="executeEngine()">Execute Unfiltered AI</button>
            <button id="downloadBtn" style="display:none; background:#222;" onclick="exportToWord()">Download Full Report (.docx)</button>
            <button class="secondary" onclick="clearForm()">Clear Data</button>
        </div>
    </div>

    <div class="panel">
        <label>Engine Output</label>
        <div id="outputContainer" class="output-box"></div>
    </div>
</div>

<script>
async function executeEngine() {
    const apiKey = document.getElementById('apiKey').value.trim();
    const style = document.getElementById('reportStyle').value;
    const chart = document.getElementById('chartData').value;
    const out = document.getElementById('outputContainer');

    if (!apiKey || !chart) return alert("Key or Data missing!");

    out.style.display = "block";
    out.innerText = "Analyzing Matrix in " + style.toUpperCase() + " mode...";

    try {
        const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
            method: "POST",
            headers: { "Authorization": `Bearer ${apiKey}`, "Content-Type": "application/json" },
            body: JSON.stringify({
                model: "llama-3.3-70b-versatile",
                messages: [
                    { role: "system", content: `You are a clinical Vedic Astrologer. Generate a ${style} report focusing on abroad settlement.` },
                    { role: "user", content: `Data: ${chart}\nQuery: ${document.getElementById('userQuery').value}` }
                ]
            })
        });
        const data = await response.json();
        out.innerText = data.choices[0].message.content;
        document.getElementById('downloadBtn').style.display = "block";
    } catch(e) { out.innerText = "Error: " + e.message; }
}

function exportToWord() {
    const content = document.getElementById('outputContainer').innerText;
    const converted = htmlDocx.asBlob(`<html><body><pre style="white-space:pre-wrap;">${content}</pre></body></html>`);
    const link = document.createElement('a');
    link.href = URL.createObjectURL(converted);
    link.download = "Astro_Analysis_Report.docx";
    link.click();
}

function clearForm() {
    location.reload();
}
</script>
</body>
</html>
