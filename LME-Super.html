<!DOCTYPE html>
<html lang="en" style="height: 100%;">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Engine 9.0</title>
    <style>
        body, html { height: 100%; margin: 0; background: url('background2.png') center/cover fixed; font-family: sans-serif; overflow: hidden; display: flex; justify-content: center; }
        .main-container { width: 95%; max-width: 450px; height: 95%; display: flex; flex-direction: column; padding: 10px; box-sizing: border-box; }
        #output { flex-grow: 1; background: rgba(0,0,0,0.8); color: #00ff00; border: 2px solid #ffd700; border-radius: 10px; padding: 15px; font-family: monospace; overflow-y: auto; margin-bottom: 10px; font-size: 14px; }
        textarea { width: 100%; background: rgba(0,0,0,0.6); color: #fff; border: 1px solid #555; padding: 10px; border-radius: 5px; box-sizing: border-box; margin-bottom: 5px; }
        button { width: 100%; padding: 12px; background: #ffd700; border: none; font-weight: bold; border-radius: 5px; cursor: pointer; }
        #menu-icon { position: absolute; top: 10px; right: 10px; color: #ffd700; cursor: pointer; font-size: 20px; }
    </style>
</head>
<body>

<div class="main-container">
    <div id="menu-icon" onclick="setKey()">⚙️</div>
    <div id="output">System Ready. Awaiting Input...</div>
    <textarea id="query" placeholder="Enter Analysis Query..." rows="3"></textarea>
    <button onclick="runEngine()">SEND</button>
</div>

<script>
    let apiKey = localStorage.getItem('engineKey') || "";
    function setKey() {
        const key = prompt("Enter API Key:", apiKey);
        if (key) { apiKey = key; localStorage.setItem('engineKey', key); }
    }
    async function runEngine() {
        const out = document.getElementById('output');
        const q = document.getElementById('query').value;
        out.innerText = "Processing...";
        try {
            const res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                method: 'POST',
                headers: { 'Authorization': `Bearer ${apiKey}`, 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    model: "llama-3.3-70b-versatile",
                    messages: [{ role: "system", content: "Ruthless data analysis only. No fluff." },
                               { role: "user", content: q }]
                })
            });
            const data = await res.json();
            out.innerText = data.choices[0].message.content;
        } catch (e) { out.innerText = "Error: " + e.message; }
    }
</script>
</body>
</html>
