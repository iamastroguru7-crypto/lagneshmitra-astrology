<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>LagneshMitra Engine v2.3</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html-docx-js/0.3.1/html-docx.js"></script>
</head>
<body>
    <div class="wrapper">
        <h2 class="header">AUTOMATED TRANSIT TIMELINE SCANNER</h2>
        <div class="panel">
            <label>Select Report Style</label>
            <select id="reportStyle">
                <option value="heavy">Heavy Technical Analysis</option>
                <option value="lite">Lite Insights</option>
                <option value="short">Short/Actionable</option>
            </select>
            <button id="runBtn" onclick="runEngine()">INTERSECT & EXTRACT DATES</button>
        </div>
        <div id="output" class="panel output-box"></div>
        <button id="dlBtn" class="dl-btn" onclick="exportDoc()">Download .DOCX Report</button>
    </div>
    <script src="script.js"></script>
</body>
</html>
