<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Master Prediction Engine</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .subject-card { border: 1px solid #dee2e6; padding: 15px; margin-bottom: 15px; border-radius: 10px; background: #f8f9fa; position: relative; }
        .del-btn { position: absolute; top: 10px; right: 10px; }
    </style>
</head>
<body class="p-3">

<div class="container bg-white p-4 shadow rounded">
    <h3 class="text-primary fw-bold">Master Prediction Engine</h3>
    <input type="password" id="apiKey" class="form-control mb-2" placeholder="API Key...">
    
    <div id="subjectsContainer">
        <div class="subject-card">
            <label>D1 Matrix</label><textarea class="form-control d1-data"></textarea>
            <label>D9 Matrix</label><textarea class="form-control d9-data"></textarea>
            <label>MDAD Matrix</label><textarea class="form-control mdad-data"></textarea>
        </div>
    </div>

    <div class="d-flex gap-2 mb-3">
        <button class="btn btn-outline-primary flex-fill" onclick="addSubject()">+ Add Subject</button>
        <button class="btn btn-success flex-fill" onclick="exportToExcel()">Export to Excel</button>
    </div>

    <input type="text" id="box3" class="form-control mb-3" placeholder="Enter query...">
    <button class="btn btn-primary w-100" onclick="executeEngine()">Execute Prediction</button>
    
    <div id="outputContainer" class="border p-3 mt-3 bg-light" style="white-space: pre-wrap;"></div>
</div>

<script>
    function addSubject() {
        const div = document.createElement('div');
        div.className = 'subject-card';
        div.innerHTML = `
            <button class="btn btn-danger btn-sm del-btn" onclick="this.parentElement.remove()">X</button>
            <label>D1 Matrix</label><textarea class="form-control d1-data"></textarea>
            <label>D9 Matrix</label><textarea class="form-control d9-data"></textarea>
            <label>MDAD Matrix</label><textarea class="form-control mdad-data"></textarea>
        `;
        document.getElementById('subjectsContainer').appendChild(div);
    }

    function exportToExcel() {
        let csv = "Subject,D1,D9,MDAD\n";
        document.querySelectorAll('.subject-card').forEach((card, i) => {
            csv += `${i+1},"${card.querySelector('.d1-data').value}","${card.querySelector('.d9-data').value}","${card.querySelector('.mdad-data').value}"\n`;
        });
        const blob = new Blob([csv], { type: 'text/csv' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = "Astrology_Data.csv";
        a.click();
    }

    async function executeEngine() {
        const apiKey = document.getElementById('apiKey').value;
        const out = document.getElementById('outputContainer');
        const query = document.getElementById('box3').value;
        let subjectsData = "";
        document.querySelectorAll('.subject-card').forEach((card, i) => {
            subjectsData += `Subject ${i+1} [D1: ${card.querySelector('.d1-data').value} | D9: ${card.querySelector('.d9-data').value} | MDAD: ${card.querySelector('.mdad-data').value}] `;
        });

        out.innerText = "Processing...";
        try {
            const res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                method: 'POST',
                headers: { 'Authorization': `Bearer ${apiKey}`, 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    model: "llama-3.3-70b-versatile",
                    messages: [{ role: "system", content: "Expert Astrologer." }, { role: "user", content: `Analyze: ${subjectsData}. Query: ${query}` }]
                })
            });
            const data = await res.json();
            out.innerText = data.choices[0].message.content;
        } catch (e) { out.innerText = "Error: " + e.message; }
    }
</script>
</body>
</html>
