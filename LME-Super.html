<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Engine 9.0</title>
    <style>
    body, html { height: 100%; margin: 0; padding: 0; overflow: hidden; background: #000; }
    
    .main-container { 
        width: 100vw; height: 100vh; display: flex; flex-direction: column; padding: 15px; box-sizing: border-box;
    }

    /* Output box styling */
    #output { 
        flex: 1; /* Dynamic height le lega */
        background: rgba(0,0,0,0.85);
        color: #00ff00; border: 2px solid #ffd700; border-radius: 10px; 
        padding: 15px; font-family: monospace; overflow-y: auto; margin-bottom: 15px;
        box-sizing: border-box;
    }

    /* Input Container (Button inside box) */
    .input-wrapper { 
        position: relative; width: 100%; height: 60px;
    }

    textarea { 
        width: 100%; height: 100%; background: rgba(0,0,0,0.7); color: #fff; 
        border: 2px solid #ffd700; padding: 10px; border-radius: 10px; 
        box-sizing: border-box; font-size: 16px; padding-right: 70px; /* Button ke liye space */
        resize: none;
    }
    
    #sendBtn { 
        position: absolute; right: 5px; top: 5px; bottom: 5px;
        width: 60px; background: #ffd700; border: none; 
        font-weight: bold; border-radius: 7px; cursor: pointer;
    }
</style>
</head>
<body>

<div class="main-container">
    <div id="menu-icon" onclick="setKey()" style="color: #ffd700; cursor:pointer;">⚙️</div>
    <div id="output">System Ready. Awaiting Input...</div>
    
    <div class="input-wrapper">
        <textarea id="query" placeholder="Enter Analysis Query..."></textarea>
        <button id="sendBtn" onclick="runEngine()">GO</button>
    </div>
</div>

<script>
    let apiKey = localStorage.getItem('engineKey') || "";
    function setKey() {
        const key = prompt("Enter API Key:", apiKey);
        if (key) { apiKey = key; localStorage.setItem('engineKey', key); }
    }
    async function runEngine() {
        const out = document.getElementById('output');
        const q = document.getElementById('query').value;
        if (!apiKey) { alert("API Key missing!"); return; }
        out.innerText = "Processing...";
        try {
            const res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                method: 'POST',
                headers: { 'Authorization': `Bearer ${apiKey}`, 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    model: "llama-3.3-70b-versatile",
                    messages: [{ role: "system", content: "Ruthless data analysis only. No fluff." },
                               { role: "user", content: q }]
                })
            });
            const data = await res.json();
            out.innerText = data.choices[0].message.content;
        } catch (e) { out.innerText = "Error: " + e.message; }
    }
</script>
</body>
</html>
