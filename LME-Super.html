<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>LagneshMitra Engine v2.2</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html-docx-js/0.3.1/html-docx.js"></script>
    <style>
        :root { --bg: #0a0a0f; --accent: #00f2ff; }
        body { background: var(--bg); color: #fff; font-family: 'Courier New', monospace; padding: 20px; }
        .wrapper { max-width: 800px; margin: auto; }
        .panel { background: #12121a; border: 1px solid #333; padding: 20px; margin-bottom: 20px; border-radius: 8px; }
        select, textarea, input { width: 100%; padding: 10px; background: #000; color: var(--accent); border: 1px solid #444; margin-bottom: 10px; }
        button { width: 100%; padding: 15px; background: #ff3333; color: white; border: none; cursor: pointer; font-weight: bold; margin-bottom: 10px; }
        #output { background: #000; padding: 15px; border-left: 4px solid var(--accent); white-space: pre-wrap; display: none; }
    </style>
</head>
<body>

<div class="wrapper">
    <h2 style="color:var(--accent)">AUTOMATED TRANSIT TIMELINE SCANNER</h2>
    
    <div class="panel">
        <label>Select Report Style</label>
        <select id="reportStyle">
            <option value="heavy">Heavy Technical Analysis</option>
            <option value="lite">Lite Insights</option>
            <option value="short">Short/Actionable</option>
        </select>
        <button onclick="runEngine()">INTERSECT & EXTRACT DATES</button>
    </div>

    <div id="output" class="panel"></div>
    <button id="dlBtn" style="display:none; background:#222;" onclick="exportDoc()">Download .DOCX Report</button>
</div>

<script>
async function runEngine() {
    const style = document.getElementById('reportStyle').value;
    const out = document.getElementById('output');
    out.style.display = "block";
    out.innerText = "Analyzing Matrix in " + style + " mode...";
    
    // Yahan API call aayegi... abhi ke liye simulation:
    setTimeout(() => {
        out.innerText = "Analysis Report [" + style + "]:\n\n1. Natal Impact: Stellium in 9th house indicates foreign shift.\n2. Dasha Trigger: Venus-Venus phase active until Sep 2027.\n3. Timeline: High probability window: Feb 2027 - Apr 2027.";
        document.getElementById('dlBtn').style.display = "block";
    }, 1000);
}

function exportDoc() {
    const content = document.getElementById('output').innerText;
    const converted = htmlDocx.asBlob(`<html><body><pre>${content}</pre></body></html>`);
    const link = document.createElement('a');
    link.href = URL.createObjectURL(converted);
    link.download = "Report.docx";
    link.click();
}
</script>
</body>
</html>
