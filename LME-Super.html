<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>LagneshMitra Engine v2.1 (PRO)</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html-docx-js/0.3.1/html-docx.js"></script>
    <style>
        /* [Existing dark theme maintained for continuity] */
        :root { --bg-color: #0a0a0f; --panel-bg: #12121a; --accent-color: #ff3333; --text-color: #e2e2e9; }
        body { background-color: var(--bg-color); color: var(--text-color); font-family: 'Segoe UI', sans-serif; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .wrapper { width: 100%; max-width: 800px; }
        .panel { background: var(--panel-bg); border: 1px solid #2a2a3a; border-radius: 12px; padding: 25px; margin-bottom: 20px; }
        input, textarea, select { width: 100%; padding: 12px; background: #1a1a26; border: 1px solid #2a2a3a; color: #fff; border-radius: 6px; box-sizing: border-box; margin-bottom: 15px; }
        button { flex: 1; padding: 14px; background: var(--accent-color); color: #fff; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .output-box { background: #0d0d14; padding: 20px; border-radius: 4px; white-space: pre-wrap; display: none; }
    </style>
</head>
<body>
<div class="wrapper">
    <header><h1>CORE ASTRO LOGIC ENGINE v2.1</h1></header>
    
    <div class="panel">
        <label>API Key (Session: <span id="daysLeft">7</span> Days remaining)</label>
        <input type="password" id="apiKey">
        <select id="runMode"><option value="report">Generate Full Brutal Report (Docx Export)</option><option value="chat">Interactive Live Chat</option></select>
    </div>

    <div class="panel">
        <label>Data Input (Intelligent Parser)</label>
        <textarea id="chartData" rows="6" placeholder="Paste raw text/table data here... Engine will auto-clean it."></textarea>
        <textarea id="dashaData" rows="4" placeholder="Vimshottari Roll-downs..."></textarea>
        <textarea id="userQuery" rows="2" placeholder="Query..."></textarea>
        <div style="display:flex; gap:10px;">
            <button onclick="executeEngine()">Execute Unfiltered AI</button>
            <button id="downloadBtn" style="background:#444; display:none;" onclick="exportToWord()">Download Word File</button>
        </div>
    </div>

    <div id="outputContainer" class="panel output-box"></div>
</div>

<script>
async function executeEngine() {
    const apiKey = document.getElementById('apiKey').value.trim();
    // Intelligent Parsing: Automatically cleans messy input
    const chartData = document.getElementById('chartData').value.replace(/\s+/g, ' ').trim();
    const dashaData = document.getElementById('dashaData').value.trim();
    const mode = document.getElementById('runMode').value;
    const outputContainer = document.getElementById('outputContainer');

    outputContainer.style.display = "block";
    outputContainer.innerText = "Analyzing System Architecture...";

    try {
        const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
            method: "POST",
            headers: { "Authorization": `Bearer ${apiKey}`, "Content-Type": "application/json" },
            body: JSON.stringify({
                model: "llama-3.3-70b-versatile",
                messages: [{ role: "system", content: "You are the LagneshMitra Engine. Provide brutal, technical, house-lord analysis." }, 
                           { role: "user", content: `Chart: ${chartData} | Dasha: ${dashaData} | Query: ${document.getElementById('userQuery').value}` }]
            })
        });
        const data = await response.json();
        const content = data.choices[0].message.content;
        outputContainer.innerText = content;
        if(mode === 'report') document.getElementById('downloadBtn').style.display = 'block';
    } catch (e) { outputContainer.innerText = "Error: " + e.message; }
}

function exportToWord() {
    const content = document.getElementById('outputContainer').innerText;
    const converted = htmlDocx.asBlob(`<html><body><pre>${content}</pre></body></html>`);
    const link = document.createElement('a');
    link.href = URL.createObjectURL(converted);
    link.download = "LagneshMitra_Report.docx";
    link.click();
}
</script>
</body>
</html>
