<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CORE ASTRO LOGIC ENGINE v3.1</title>
    <style>
        :root { --bg-color: #0a0a0f; --panel-bg: #12121a; --accent-color: #00ff00; --text-color: #e2e2e9; --border-color: #2a2a3a; }
        body { background-color: var(--bg-color); color: var(--text-color); font-family: 'Courier New', monospace; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .wrapper { width: 100%; max-width: 800px; }
        header { text-align: center; margin-bottom: 20px; }
        .panel { background: var(--panel-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 20px; margin-bottom: 15px; }
        label { color: var(--accent-color); font-weight: bold; text-transform: uppercase; display: block; margin-bottom: 5px; font-size: 11px; }
        textarea, input, select { width: 100%; padding: 8px; background: #000; color: var(--accent-color); border: 1px solid var(--border-color); border-radius: 4px; box-sizing: border-box; margin-bottom: 8px; font-family: monospace; }
        .subject-card { border: 1px solid #333; padding: 15px; margin-bottom: 15px; border-radius: 8px; background: #1a1a24; }
        button { padding: 10px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; margin-top: 5px; }
        .run-btn { background: var(--accent-color); color: #000; width: 100%; }
        .export-btn { background: #2e7d32; color: #fff; width: 100%; margin-top: 10px; }
        .output-box { background: #0d0d14; border-left: 4px solid var(--accent-color); padding: 20px; margin-top: 20px; display: none; white-space: pre-wrap; font-size: 14px; }
    </style>
</head>
<body>

<div class="wrapper">
    <header><h1>CORE ASTRO LOGIC ENGINE v3.1</h1><p>[ ADMIN PANEL - RELATIONSHIP MATRIX ]</p></header>

    <div class="panel">
        <label>Groq API Key</label>
        <input type="password" id="apiKey" placeholder="gsk_...">
    </div>

    <div class="panel">
        <label>Subject Data Matrices</label>
        <div id="subjectsContainer">
            <div class="subject-card">
                <label>D1 Matrix</label>
                <textarea rows="2" class="d1-data" placeholder="Paste D1 Chart..."></textarea>
                <label>D9 Matrix</label>
                <textarea rows="2" class="d9-data" placeholder="Paste D9 Chart..."></textarea>
                <label>MDAD Matrix</label>
                <textarea rows="2" class="mdad-data" placeholder="[Mahadasha: ...] [Antardasha: ...]"></textarea>
            </div>
        </div>
        <button onclick="addSubject()">+ Add Subject</button>
        <button onclick="removeSubject()">- Remove Last</button>
        
        <div style="margin-top:15px;">
            <input type="checkbox" id="jointMode"> <label style="display:inline; color: white;">Enable Joint Synastry Mode</label>
            <select id="relType">
                <option value="General">Select Relationship Type</option>
                <option value="Husband-Wife">Husband-Wife</option>
                <option value="Father-Son">Father-Son</option>
                <option value="Father-Daughter">Father-Daughter</option>
                <option value="Mother-Son">Mother-Son</option>
                <option value="Mother-Daughter">Mother-Daughter</option>
            </select>
        </div>
    </div>

    <div class="panel">
        <label>Logic Query</label>
        <textarea id="box3" rows="2" placeholder="Enter specific analytical query here..."></textarea>
        <button class="run-btn" onclick="executeEngine()">RUN ENGINE EXECUTION</button>
        <button class="export-btn" onclick="exportToWord()">EXPORT TO WORD</button>
    </div>

    <div id="outputContainer" class="output-box"></div>
</div>

<script>
    function addSubject() {
        const div = document.createElement('div');
        div.className = 'subject-card';
        div.innerHTML = `
            <label>D1 Matrix</label>
            <textarea rows="2" class="d1-data" placeholder="Paste D1 Chart..."></textarea>
            <label>D9 Matrix</label>
            <textarea rows="2" class="d9-data" placeholder="Paste D9 Chart..."></textarea>
            <label>MDAD Matrix</label>
            <textarea rows="2" class="mdad-data" placeholder="[Mahadasha: ...] [Antardasha: ...]"></textarea>
        `;
        document.getElementById('subjectsContainer').appendChild(div);
    }

    function removeSubject() {
        const container = document.getElementById('subjectsContainer');
        if(container.children.length > 1) container.lastElementChild.remove();
    }

    async function executeEngine() {
        const apiKey = document.getElementById('apiKey').value;
        const out = document.getElementById('outputContainer');
        let subjectsData = "";
        document.querySelectorAll('.subject-card').forEach((card, index) => {
            subjectsData += `Subject ${index + 1} [D1: ${card.querySelector('.d1-data').value} | D9: ${card.querySelector('.d9-data').value} | MDAD: ${card.querySelector('.mdad-data').value}] | `;
        });

        const query = document.getElementById('box3').value;
        const isJoint = document.getElementById('jointMode').checked;
        const relType = document.getElementById('relType').value;

        out.style.display = "block";
        out.innerText = "Processing Logic Matrix...";

        const finalQuery = isJoint ? `[RELATIONSHIP_TYPE: ${relType}] Analyze: ${query} across: ${subjectsData}` : `Context: ${subjectsData}. Query: ${query}`;

        try {
            const res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                method: "POST",
                headers: { "Authorization": `Bearer ${apiKey}`, "Content-Type": "application/json" },
                body: JSON.stringify({
                    model: "llama-3.3-70b-versatile",
                    messages: [{ role: "user", content: finalQuery }]
                })
            });
            const data = await res.json();
            out.innerText = data.choices[0].message.content;
        } catch(e) { out.innerText = "Error: " + e.message; }
    }

    function exportToWord() {
        const blob = new Blob(['\ufeff', document.getElementById('outputContainer').innerText], { type: 'application/msword' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'Succession_Audit_Report.doc';
        a.click();
    }
</script>
</body>
</html>
