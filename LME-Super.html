<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Subject Prediction Engine</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f8f9fa; padding: 20px; }
        .container { max-width: 800px; background: white; padding: 25px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .subject-card { border: 1px solid #ddd; padding: 15px; margin-bottom: 15px; border-radius: 8px; background: #fcfcfc; position: relative; }
    </style>
</head>
<body>

<div class="container">
    <h2 class="text-center text-primary fw-bold">Subject Prediction Engine</h2>
    <input type="password" id="apiKey" class="form-control mb-3" placeholder="Enter API Key...">
    
    <div id="subjectsContainer">
        <!-- Default Subject -->
        <div class="subject-card">
            <label>D1 Matrix</label>
            <textarea class="form-control d1-data"></textarea>
            <label>D9 Matrix</label>
            <textarea class="form-control d9-data"></textarea>
            <label>MDAD Matrix</label>
            <textarea class="form-control mdad-data"></textarea>
        </div>
    </div>

    <button class="btn btn-outline-primary w-100 mb-3" onclick="addSubject()">+ Add Another Subject</button>
    <input type="text" id="box3" class="form-control mb-3" placeholder="Enter your query here...">
    <button class="btn btn-primary w-100" onclick="executeEngine()">Execute Prediction</button>
    
    <label class="mt-3 fw-bold">Output:</label>
    <div id="outputContainer" class="border p-3 mt-2" style="min-height: 100px; background: #eee;"></div>
</div>

<script>
    function addSubject() {
        const div = document.createElement('div');
        div.className = 'subject-card';
        div.innerHTML = `
            <label>D1 Matrix</label>
            <textarea class="form-control d1-data"></textarea>
            <label>D9 Matrix</label>
            <textarea class="form-control d9-data"></textarea>
            <label>MDAD Matrix</label>
            <textarea class="form-control mdad-data"></textarea>
        `;
        document.getElementById('subjectsContainer').appendChild(div);
    }

    async function executeEngine() {
        const apiKey = document.getElementById('apiKey').value;
        const out = document.getElementById('outputContainer');
        const query = document.getElementById('box3').value;
        
        let subjectsData = "";
        document.querySelectorAll('.subject-card').forEach((card, index) => {
            subjectsData += `Subject ${index + 1} [D1: ${card.querySelector('.d1-data').value} | D9: ${card.querySelector('.d9-data').value} | MDAD: ${card.querySelector('.mdad-data').value}] `;
        });

        out.innerText = "Processing Logic Matrix...";

        try {
            const res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                method: 'POST',
                headers: { 'Authorization': `Bearer ${apiKey}`, 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    model: "llama-3.3-70b-versatile",
                    messages: [
                        { role: "system", content: "You are an expert Vedic Astrologer. Analyze the provided subject matrices based on the user query. Be direct, insightful, and avoid AI jargon." },
                        { role: "user", content: `Analyze: ${subjectsData}. Query: ${query}` }
                    ]
                })
            });
            const data = await res.json();
            out.innerText = data.choices[0].message.content;
        } catch (e) { out.innerText = "Error: " + e.message; }
    }
</script>
</body>
</html>
