<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LagneshMitra Engine v2.1 | PRO</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html-docx-js/0.3.1/html-docx.js"></script>
    <style>
        :root { --bg-color: #0a0a0f; --panel-bg: #12121a; --accent-color: #ff3333; --text-color: #e2e2e9; --border-color: #2a2a3a; }
        body { background-color: var(--bg-color); color: var(--text-color); font-family: 'Segoe UI', sans-serif; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .wrapper { width: 100%; max-width: 800px; }
        .panel { background: var(--panel-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 25px; margin-bottom: 20px; }
        textarea, select, input { width: 100%; padding: 12px; background: #1a1a26; border: 1px solid var(--border-color); color: #fff; border-radius: 6px; margin-bottom: 15px; }
        button { padding: 14px; background: var(--accent-color); color: #fff; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; width: 100%; }
        #downloadBtn { background: #444; margin-top: 10px; display: none; }
        .output-box { background: #0d0d14; padding: 20px; border-radius: 4px; border-left: 4px solid var(--accent-color); white-space: pre-wrap; display: none; min-height: 100px; }
    </style>
</head>
<body>

<div class="wrapper">
    <header style="text-align:center; margin-bottom: 20px;">
        <h1 style="color:var(--accent-color)">LAGNESHMITRA ENGINE v2.1</h1>
    </header>

    <div class="panel">
        <label>API Key</label>
        <input type="password" id="apiKey" placeholder="Enter Groq Key...">
        
        <label>Select Mode</label>
        <select id="runMode">
            <option value="report">Generate Full Brutal Report (Detailed Reading)</option>
            <option value="chat">Interactive Live Chat</option>
        </select>
    </div>

    <div class="panel">
        <textarea id="chartData" rows="6" placeholder="Paste full natal/navamsa data here..."></textarea>
        <textarea id="dashaData" rows="4" placeholder="Enter Vimshottari sequence..."></textarea>
        <textarea id="userQuery" rows="2" placeholder="Specific query..."></textarea>
        
        <button onclick="executeEngine()">Execute Unfiltered AI</button>
        <button id="downloadBtn" onclick="exportToWord()">Download Full Report (Word File)</button>
    </div>

    <div id="outputContainer" class="panel output-box"></div>
</div>

<script>
async function executeEngine() {
    const apiKey = document.getElementById('apiKey').value.trim();
    const chartData = document.getElementById('chartData').value.trim();
    const dashaData = document.getElementById('dashaData').value.trim();
    const query = document.getElementById('userQuery').value.trim();
    const mode = document.getElementById('runMode').value;
    const outputContainer = document.getElementById('outputContainer');

    if(!apiKey) return alert("Key missing!");
    
    outputContainer.style.display = "block";
    outputContainer.innerText = "Analyzing System Architecture...";

    const prompt = mode === 'report' ? 
        "Generate a brutal, technical 1500+ word Vedic Astrological Reading. Structure: Summary, Natal House Analysis, Navamsa Strength, Dasha Critique, and Final Timeline Matrix." :
        "Provide a sharp, direct, and cynical answer to the user query.";

    try {
        const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
            method: "POST",
            headers: { "Authorization": `Bearer ${apiKey}`, "Content-Type": "application/json" },
            body: JSON.stringify({
                model: "llama-3.3-70b-versatile",
                messages: [
                    { role: "system", content: `You are LagneshMitra. ${prompt}` },
                    { role: "user", content: `Chart: ${chartData}\n\nDasha: ${dashaData}\n\nQuery: ${query}` }
                ]
            })
        });
        const data = await response.json();
        const result = data.choices[0].message.content;
        outputContainer.innerText = result;
        if(mode === 'report') document.getElementById('downloadBtn').style.display = 'block';
    } catch (e) { outputContainer.innerText = "Error: " + e.message; }
}

function exportToWord() {
    const content = document.getElementById('outputContainer').innerText;
    const converted = htmlDocx.asBlob(`<html><body><pre style="white-space:pre-wrap;">${content}</pre></body></html>`);
    const link = document.createElement('a');
    link.href = URL.createObjectURL(converted);
    link.download = "Deepti_Chart_Analysis.docx";
    link.click();
}
</script>
</body>
</html>
