<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Master Prediction Engine 9.0</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { 
            background: url('background2.png') no-repeat center center fixed; 
            background-size: cover; 
            color: #fff; 
        }
        .glass-panel { 
            background: rgba(0, 0, 0, 0.7); 
            padding: 30px; 
            border-radius: 15px; 
            border: 1px solid #ffd700; 
            backdrop-filter: blur(10px);
        }
        textarea { background: rgba(255, 255, 255, 0.1) !important; color: white !important; border: 1px solid #555; }
        .btn-run { background: #ffd700; color: black; font-weight: bold; border: none; }
        .output-box { background: rgba(0, 0, 0, 0.8); border-left: 5px solid #ffd700; min-height: 200px; padding: 20px; color: #00ff00; font-family: monospace; }
    </style>
</head>
<body class="p-4">

<div class="container glass-panel shadow-lg">
    <h3 class="text-warning fw-bold mb-4">Master Prediction Engine 9.0</h3>
    
    <!-- BOX 1: DATA INPUT -->
    <div id="subjectsContainer" class="mb-4">
        <textarea id="d1-matrix" class="form-control mb-2" placeholder="D1 Matrix..."></textarea>
        <textarea id="d9-matrix" class="form-control mb-2" placeholder="D9 Matrix..."></textarea>
        <textarea id="mdad-matrix" class="form-control" placeholder="MDAD Matrix..."></textarea>
    </div>

    <!-- BOX 2: EXECUTION -->
    <input type="password" id="apiKey" class="form-control mb-3" placeholder="Enter API Key">
    <textarea id="queryBox" class="form-control mb-3" placeholder="Enter Strategic Query..."></textarea>
    <button class="btn btn-run w-100 py-3 mb-4" onclick="executeEngine()">RUN PREDICTION ENGINE</button>
    
    <!-- BOX 3: OUTPUT -->
    <div id="outputContainer" class="output-box shadow-sm">Engine Status: Ready for input...</div>
</div>
    
<script>
    async function executeEngine() {
        const outputContainer = document.getElementById('outputContainer');
        const apiKey = document.getElementById('apiKey').value;
        const query = document.getElementById('queryBox').value;
        const d1 = document.getElementById('d1-matrix').value;
        const d9 = document.getElementById('d9-matrix').value;
        const mdad = document.getElementById('mdad-matrix').value;

        outputContainer.innerText = "Processing Forensic Data...";

        const prompt = `System Guidelines: Ruthless, data-driven analysis. 
        Input Data: D1:${d1}, D9:${d9}, MDAD:${mdad}.
        Query: ${query}.
        Required Format: Analysis -> 4-Parameter Framework (Market/Engagement/Feasibility/Uniqueness) -> Total Success %.`;

        try {
            const res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                method: 'POST',
                headers: { 'Authorization': `Bearer ${apiKey}`, 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    model: "llama-3.3-70b-versatile",
                    messages: [
                        { role: "system", content: "You are an analytical engine. Provide zero fluff. Only raw, brutal data analysis." },
                        { role: "user", content: prompt }
                    ]
                })
            });
            const data = await res.json();
            outputContainer.innerText = data.choices[0].message.content;
        } catch (e) {
            outputContainer.innerText = "Engine Error: " + e.message;
        }
    }
</script>
</body>
</html>
