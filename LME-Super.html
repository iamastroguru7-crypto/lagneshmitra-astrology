<script>

function exportToWord() {
    // Yeh function tere output box se text uthayega
    const content = document.getElementById('outputContainer').innerText;
    const blob = htmlDocx.asBlob(`<html><body><pre style="white-space:pre-wrap;">${content}</pre></body></html>`);
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = "Deepti_Chart_Analysis.docx";
    link.click();
}
</script>
