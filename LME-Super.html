<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
    <script>eruda.init();</script>
    
    <title>Engine 9.0</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .subject-card { border: 2px solid #007bff; padding: 20px; margin-bottom: 20px; border-radius: 12px; background: #fff; position: relative; }
        .del-btn { position: absolute; top: 10px; right: 10px; background: red; color: white; border: none; padding: 5px 10px; border-radius: 5px; cursor: pointer; }
        .btn-group { display: flex; gap: 10px; margin-bottom: 20px; }
    </style>
</head>
<body class="p-4" style="background: #f4f7f6;">

<div class="container bg-white p-4 shadow rounded">
    <h3 class="text-primary fw-bold mb-4">Master Prediction Engine 9.0</h3>
    
    <input type="password" id="apiKey" class="form-control mb-3" placeholder="Enter Groq API Key">
    <div id="subjectsContainer">
        <div class="subject-card">
            <label>D1 Matrix</label><textarea class="form-control d1-data mb-2"></textarea>
            <label>D9 Matrix</label><textarea class="form-control d9-data mb-2"></textarea>
            <label>MDAD Matrix</label><textarea class="form-control mdad-data"></textarea>
        </div>
    </div>

    <div class="btn-group w-100">
        <button class="btn btn-primary" onclick="addSubject()">+ Add Subject</button>
        <button class="btn btn-success" onclick="exportToExcel()">Export Excel</button>
    </div>

    <input type="text" id="box3" class="form-control mb-3" placeholder="Enter your query here...">
    <button class="btn btn-dark w-100 py-2" onclick="executeEngine()">Run Prediction</button>
    
    <div id="outputContainer" class="border p-3 mt-4 bg-light shadow-sm" style="min-height: 150px; white-space: pre-wrap;"></div>
</div>

<div id="celestialTracker" style="margin-top: 20px; margin-bottom: 20px; padding: 15px; border: 1px solid #ccc; border-radius: 8px; background-color: #fafafa;">
    <h3 style="margin-top: 0; font-size: 16px; color: #333;">Live Celestial Tracker</h3>
    <table style="width:100%; border-collapse: collapse; font-family: sans-serif; font-size: 14px;">
        <thead>
            <tr style="background-color: #eee;">
                <th style="padding: 10px; border: 1px solid #ddd;">Planet</th>
                <th style="padding: 10px; border: 1px solid #ddd;">Nakshatra</th>
                <th style="padding: 10px; border: 1px solid #ddd;">House</th>
                <th style="padding: 10px; border: 1px solid #ddd;">Degree</th>
            </tr>
        </thead>
        <tbody id="liveDataBody">
            </tbody>
    </table>
</div>
    
<script>
    const vedastroApiKey = "sk_live_0QU8V8YdAMv7v08zj1oST2kqk7Mi9Oxf19f54OiF"; 

    function addSubject() {
        const div = document.createElement('div');
        div.className = 'subject-card';
        div.innerHTML = `
            <button class="del-btn" onclick="this.parentElement.remove()">Delete</button>
            <label>D1 Matrix</label><textarea class="form-control d1-data mb-2"></textarea>
            <label>D9 Matrix</label><textarea class="form-control d9-data mb-2"></textarea>
            <label>MDAD Matrix</label><textarea class="form-control mdad-data"></textarea>
        `;
        document.getElementById('subjectsContainer').appendChild(div);
    }

    function exportToExcel() {
        let csv = "Subject,D1,D9,MDAD\n";
        document.querySelectorAll('.subject-card').forEach((card, i) => {
            csv += `${i+1},"${card.querySelector('.d1-data').value}","${card.querySelector('.d9-data').value}","${card.querySelector('.mdad-data').value}"\n`;
        });
        const blob = new Blob([csv], { type: 'text/csv' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = "Astrology_Data.csv";
        a.click();
    }

    async function updateCelestialData() {
        const tbody = document.getElementById('liveDataBody');
        tbody.innerHTML = "Loading...";

        try {
            const apiUrl = 'https://api.vedastro.org/Calculate/PlanetData/Lucknow/Date/07/07/2026/Time/02.00/UTC/5.30';
            const response = await fetch(apiUrl, {
                headers: { 'Authorization': `Bearer ${vedastroApiKey}` }
            });

            if (!response.ok) throw new Error(`Status ${response.status}`);
            
            const data = await response.json();
            tbody.innerHTML = ''; 
            data.Payload.forEach(planet => {
                tbody.innerHTML += `<tr>
                    <td>${planet.Name}</td>
                    <td>${planet.Nakshatra}</td>
                    <td>${planet.House}</td>
                    <td>${planet.Degree.toFixed(2)}°</td>
                </tr>`;
            });
        } catch (error) {
            tbody.innerHTML = "<tr><td colspan='4'>Error loading data</td></tr>";
            console.error("Tracker Error:", error);
        }
    }

    async function executeEngine() {
        const queryElement = document.getElementById('box3');
        const query = queryElement ? queryElement.value : "Analyze my chart brutally.";
        const outputContainer = document.getElementById('outputContainer');
        outputContainer.innerText = "Processing...";

        try {
            const groqApiKey = document.getElementById('apiKey').value;
            const res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                method: 'POST',
                headers: { 
                    'Authorization': `Bearer ${groqApiKey}`, 
                    'Content-Type': 'application/json' 
                },
                body: JSON.stringify({
                    model: "llama-3.3-70b-versatile",
                    messages: [
                        { role: "system", content: "You are a ruthless, data-driven astrologer. No fluff." },
                        { role: "user", content: `Query: ${query}. CRITICAL: Give a raw, brutal analysis. No softening.` }
                    ]
                })
            });

            const data = await res.json();
            outputContainer.innerText = data.choices[0].message.content;
        } catch (e) {
            outputContainer.innerText = "Engine Error: " + e.message;
        }
    }

    // Auto-load tracker
    updateCelestialData();
</script>
</body>
</html>
