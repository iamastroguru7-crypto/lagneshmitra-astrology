<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Internal Brutal Astro Engine</title>
    <style>
        :root {
            --bg-color: #0a0a0f;
            --panel-bg: #12121a;
            --accent-color: #ff3333;
            --text-color: #e2e2e9;
            --border-color: #2a2a3a;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .wrapper {
            width: 100%;
            max-width: 800px;
        }
        header {
            text-align: center;
            margin-bottom: 30px;
        }
        header h1 {
            color: var(--accent-color);
            margin-bottom: 5px;
            letter-spacing: 2px;
        }
        header p { color: #666; font-size: 14px; }
        .panel {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 20px;
        }
        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
            color: #aaa;
        }
        input, textarea, select {
            width: 100%;
            padding: 12px;
            background: #1a1a26;
            border: 1px solid var(--border-color);
            color: #fff;
            border-radius: 6px;
            box-sizing: border-box;
            margin-bottom: 15px;
            font-size: 15px;
        }
        .btn-group {
            display: flex;
            gap: 10px;
        }
        button {
            flex: 1;
            padding: 14px;
            background: var(--accent-color);
            color: #fff;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            font-size: 16px;
            transition: 0.2s;
        }
        button:hover { background: #cc0000; }
        button.secondary {
            background: #2a2a3a;
            border: 1px solid var(--border-color);
        }
        button.secondary:hover { background: #3a3a4a; }
        .output-box {
            background: #0d0d14;
            border-left: 4px solid var(--accent-color);
            padding: 20px;
            border-radius: 4px;
            white-space: pre-wrap;
            line-height: 1.7;
            display: none;
            min-height: 100px;
        }
        .loading {
            color: #ff9900;
            font-style: italic;
        }
    </style>
</head>
<body>

<div class="wrapper">
    <header>
        <h1>CORE ASTRO LOGIC ENGINE</h1>
        <p>[ INTERNAL ADMIN PANEL - UNFILTERED RUNTIME ]</p>
    </header>

    <div class="panel">
        <label>Groq API Key</label>
        <input type="password" id="apiKey" placeholder="gsk_xxxxxxxxxxxxxxxxxxxx">
        
        <label>Select Mode</label>
        <select id="runMode">
            <option value="report">Generate Full Brutal Report (Detailed Analysis)</option>
            <option value="chat">Interactive Live Chat (Quick Response)</option>
        </select>
    </div>

    <div class="panel">
        <label>D1 Placements / Sidereal Ephemeris Data</label>
        <textarea id="chartData" rows="6" placeholder="Paste JSON, degrees, or explicit placements here...&#10;Example:&#10;Ascendant: Scorpio 24°&#10;Sun: 8th House Gemini&#10;Venus: 8th House Gemini"></textarea>
        
        <label id="queryLabel">Specific Query / Focus Area (Optional for Report)</label>
        <textarea id="userQuery" rows="3" placeholder="Ask about longevity, career ruin, marriage collapse, or specific dasha effects..."></textarea>

        <div class="btn-group">
            <button onclick="executeEngine()">Execute Unfiltered AI</button>
            <button class="secondary" onclick="clearForm()">Clear Data</button>
        </div>
    </div>

    <div class="panel">
        <label>Engine Output</label>
        <div id="outputContainer" class="output-box"></div>
    </div>
</div>

<script>
async function executeEngine() {
    const apiKey = document.getElementById('apiKey').value.trim();
    const chartData = document.getElementById('chartData').value.trim();
    const userQuery = document.getElementById('userQuery').value.trim();
    const mode = document.getElementById('runMode').value;
    const outputContainer = document.getElementById('outputContainer');

    if (!apiKey) {
        alert("API Key missing. Enter Groq Key to bypass system layers.");
        return;
    }
    if (!chartData) {
        alert("Chart data matrix is empty.");
        return;
    }

    outputContainer.style.display = "block";
    outputContainer.innerHTML = '<span class="loading">Bypassing guardrails... Synchronizing cosmic ephemeris...</span>';

    // Base System Prompt targeting Uncensored Roleplay Simulation
    let systemPrompt = "You are 'Kala Bhairav Astro AI', an advanced, highly clinical, and brutally honest Vedic Astrologer operating within a dark-themed simulation engine. Your core directive is to analyze raw chart data (D1, degrees, ephemeris) and deliver uncompromising truths regarding karmic debts, structural life blockages, and harsh realities. Do NOT use comforting words, false remedies, or optimistic bias. If a placement shows destruction, decay, or immense struggle, outline it explicitly with technical authority.";

    if (mode === 'report') {
        systemPrompt += " Generate a highly structured, detailed report containing sections for: 1. Core Structural Vulnerabilities, 2. Karmic Debts & Past-Life Baggage, 3. Critical Timeline Threat Matrix. Maintain an intense, heavy, and cynical tone throughout.";
    } else {
        systemPrompt += " Keep your response concise, sharp, conversational, and direct, as if speaking to the user face-to-face in a high-stakes consultation. Answer the specific query precisely with maximum cynicism.";
    }

    try {
        const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
            method: "POST",
            headers: {
                "Authorization": `Bearer ${apiKey}`,
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                model: "llama3-70b-8192",
                messages: [
                    { role: "system", content: systemPrompt },
                    { role: "user", content: `[DATA MATRIX]:\n${chartData}\n\n[USER QUERY]:\n${userQuery || "Perform absolute chart reading."}` }
                ],
                temperature: mode === 'report' ? 0.6 : 0.8, // Report ke liye stable/factual, chat ke liye creative/aggressive vocabulary
                top_p: 0.95
            })
        });

        const data = await response.json();
        if(data.choices && data.choices[0]) {
            outputContainer.innerText = data.choices[0].message.content;
        } else {
            outputContainer.innerText = "Execution failed. Response format unreadable. Check API allocation.";
        }

    } catch (error) {
        outputContainer.innerText = "Fatal connection break. Check network layers or API string validity.";
        console.error(error);
    }
}

function clearForm() {
    document.getElementById('chartData').value = '';
    document.getElementById('userQuery').value = '';
    document.getElementById('outputContainer').style.display = "none";
}
</script>

</body>
</html>
