<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Engine 9.0</title>
    <style>
    /* Full screen setup */
    body, html { 
        height: 100%; margin: 0; padding: 0; overflow: hidden;
        /* Image fix: Path sahi check kar lena, aur background-size: cover best hai */
        background-image: url('background2.png'); 
        background-repeat: no-repeat; 
        background-size: cover; 
        background-position: center;
        background-attachment: fixed;
    }
    
    .main-container { 
        width: 100vw; height: 100vh; display: flex; flex-direction: column; padding: 15px; box-sizing: border-box;
    }

    /* Output box thoda chota kiya */
    #output { 
        height: 50%; width: 100%;
        background: rgba(0,0,0,0.8); /* Transparency thodi badha di */
        color: #00ff00; border: 2px solid #ffd700; border-radius: 10px; 
        padding: 15px; font-family: monospace; overflow-y: auto; margin-bottom: 10px;
        box-sizing: border-box;
    }

    textarea { 
        width: 100%; height: 15%; background: rgba(0,0,0,0.7); color: #fff; 
        border: 2px solid #ffd700; padding: 10px; border-radius: 10px; 
        box-sizing: border-box; font-size: 16px; margin-bottom: 10px;
    }
    
    button { 
        width: 100%; height: 10%; background: #ffd700; border: none; 
        font-weight: bold; font-size: 18px; border-radius: 10px; cursor: pointer;
    }
</style>


</head>
<body>

<div class="main-container">
    <div id="menu-icon" onclick="setKey()">⚙️</div>
    <div id="output">System Ready. Awaiting Input...</div>
    <textarea id="query" placeholder="Enter Analysis Query..." rows="3"></textarea>
    <button onclick="runEngine()">SEND</button>
</div>

<script>
    let apiKey = localStorage.getItem('engineKey') || "";
    function setKey() {
        const key = prompt("Enter API Key:", apiKey);
        if (key) { apiKey = key; localStorage.setItem('engineKey', key); }
    }
    async function runEngine() {
        const out = document.getElementById('output');
        const q = document.getElementById('query').value;
        if (!apiKey) { alert("API Key missing!"); return; }
        out.innerText = "Processing...";
        try {
            const res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                method: 'POST',
                headers: { 'Authorization': `Bearer ${apiKey}`, 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    model: "llama-3.3-70b-versatile",
                    messages: [{ role: "system", content: "Ruthless data analysis only. No fluff." },
                               { role: "user", content: q }]
                })
            });
            const data = await res.json();
            out.innerText = data.choices[0].message.content;
        } catch (e) { out.innerText = "Error: " + e.message; }
    }
</script>
</body>
</html>
