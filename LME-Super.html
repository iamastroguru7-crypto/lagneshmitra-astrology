<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Internal Brutal Astro Engine v2.6</title>
    <style>
        :root { --bg-color: #0a0a0f; --panel-bg: #12121a; --accent-color: #ff3333; --text-color: #e2e2e9; --border-color: #2a2a3a; }
        body { background-color: var(--bg-color); color: var(--text-color); font-family: 'Segoe UI', Roboto, sans-serif; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .wrapper { width: 100%; max-width: 800px; }
        header { text-align: center; margin-bottom: 30px; }
        header h1 { color: var(--accent-color); margin-bottom: 5px; letter-spacing: 2px; }
        .panel { background: var(--panel-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 25px; margin-bottom: 20px; }
        label { display: block; font-weight: bold; margin-bottom: 8px; color: #aaa; }
        input, textarea, select { width: 100%; padding: 12px; background: #1a1a26; border: 1px solid var(--border-color); color: #fff; border-radius: 6px; box-sizing: border-box; margin-bottom: 15px; font-size: 15px; }
        .btn-group { display: flex; gap: 10px; flex-direction: column; }
        button { padding: 14px; background: var(--accent-color); color: #fff; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 16px; width: 100%; }
        button.secondary { background: #2a2a3a; border: 1px solid var(--border-color); }
        .output-box { background: #0d0d14; border-left: 4px solid var(--accent-color); padding: 20px; border-radius: 4px; white-space: pre-wrap; line-height: 1.7; display: none; min-height: 100px; margin-top: 15px; }
    </style>
</head>
<body>

<div class="wrapper">
    <header>
        <h1>CORE ASTRO LOGIC ENGINE v2.6</h1>
        <p>[ ADMIN PANEL - ABROAD TIMELINE RUNTIME ]</p>
    </header>

    <div class="panel">
        <label>Groq API Key</label>
        <input type="password" id="apiKey" placeholder="gsk_...">
        
        <label>Report Style</label>
        <select id="reportStyle">
            <option value="heavy">Heavy Technical Analysis</option>
            <option value="lite">Lite Insights</option>
        </select>
    </div>

    <div class="panel">
        <label>D1 Placements</label>
        <textarea id="chartData" rows="6"></textarea>
        <label>Vimshottari Dasha</label>
        <textarea id="dashaData" rows="4"></textarea>
        <label>Specific Query</label>
        <textarea id="userQuery" rows="2"></textarea>

        <div class="btn-group">
            <button onclick="executeEngine()">Execute Unfiltered AI</button>
            <button id="downloadBtn" style="display:none; background:#007bff;" onclick="exportToWord()">Download Report (.doc)</button>
            <button class="secondary" onclick="location.reload()">Clear Data</button>
        </div>
        <div id="outputContainer" class="output-box"></div>
    </div>
</div>

<script>
async function executeEngine() {
    const apiKey = document.getElementById('apiKey').value.trim();
    const out = document.getElementById('outputContainer');
    if (!apiKey || !document.getElementById('chartData').value) return alert("Fill data!");

    out.style.display = "block";
    out.innerText = "Processing matrix...";

    try {
        const res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
            method: "POST",
            headers: { "Authorization": `Bearer ${apiKey}`, "Content-Type": "application/json" },
            body: JSON.stringify({
                model: "llama-3.3-70b-versatile",
                messages: [{ role: "user", content: `Generate a ${document.getElementById('reportStyle').value} Vedic astrology report for: ${document.getElementById('chartData').value}. Query: ${document.getElementById('userQuery').value}` }]
            })
        });
        const data = await res.json();
        out.innerText = data.choices[0].message.content;
        document.getElementById('downloadBtn').style.display = "block";
    } catch(e) { out.innerText = "Error: " + e.message; }
}

function exportToWord() {
    const content = document.getElementById('outputContainer').innerText;
    const blob = new Blob(['\ufeff', content], { type: 'application/msword' });
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = url;
    link.download = "Astro_Analysis.doc";
    link.click();
}
</script>
</body>
</html>
