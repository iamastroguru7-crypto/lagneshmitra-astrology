<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Internal Brutal Astro Engine v2</title>
    <style>
        :root {
            --bg-color: #0a0a0f;
            --panel-bg: #12121a;
            --accent-color: #ff3333;
            --text-color: #e2e2e9;
            --border-color: #2a2a3a;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .wrapper {
            width: 100%;
            max-width: 800px;
        }
        header {
            text-align: center;
            margin-bottom: 30px;
        }
        header h1 {
            color: var(--accent-color);
            margin-bottom: 5px;
            letter-spacing: 2px;
        }
        header p { color: #666; font-size: 14px; }
        .panel {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 20px;
        }
        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
            color: #aaa;
        }
        input, textarea, select {
            width: 100%;
            padding: 12px;
            background: #1a1a26;
            border: 1px solid var(--border-color);
            color: #fff;
            border-radius: 6px;
            box-sizing: border-box;
            margin-bottom: 15px;
            font-size: 15px;
        }
        .btn-group {
            display: flex;
            gap: 10px;
        }
        button {
            flex: 1;
            padding: 14px;
            background: var(--accent-color);
            color: #fff;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            font-size: 16px;
            transition: 0.2s;
        }
        button:hover { background: #cc0000; }
        button.secondary {
            background: #2a2a3a;
            border: 1px solid var(--border-color);
        }
        button.secondary:hover { background: #3a3a4a; }
        .output-box {
            background: #0d0d14;
            border-left: 4px solid var(--accent-color);
            padding: 20px;
            border-radius: 4px;
            white-space: pre-wrap;
            line-height: 1.7;
            display: none;
            min-height: 100px;
        }
        .loading {
            color: #ff9900;
            font-style: italic;
        }
    </style>
</head>
<body>

<div class="wrapper">
    <header>
        <h1>CORE ASTRO LOGIC ENGINE v2</h1>
        <p>[ INTERNAL ADMIN PANEL - VIMSHOTTARI & ABROAD TIMELINE RUNTIME ]</p>
    </header>

    <!-- Configuration Panel -->
    <div class="panel">
        <label>Groq API Key (Ignition Key)</label>
        <input type="password" id="apiKey" placeholder="gsk_xxxxxxxxxxxxxxxxxxxx">
        
        <label>Select Mode</label>
        <select id="runMode">
            <option value="report">Generate Full Brutal Report (Detailed Analysis)</option>
            <option value="chat">Interactive Live Chat (Quick Response)</option>
        </select>
    </div>

    <!-- Data Input Panel -->
    <div class="panel">
        <label>D1 Placements / Sidereal Ephemeris Data</label>
        <textarea id="chartData" rows="6" placeholder="Paste JSON or explicit placements here...&#10;Example:&#10;Ascendant: Virgo&#10;Saturn: 1st House Virgo&#10;Rahu: 9th House Taurus&#10;Jupiter: 12th House Leo"></textarea>
        
        <label>Vimshottari Dasha Roll-downs (Current Timeline)</label>
        <textarea id="dashaData" rows="4" placeholder="Enter current Dasha sequence here...&#10;Example:&#10;Mahadasha: Rahu (Till 2032)&#10;Antardasha: Jupiter (Till Mid-2027)&#10;Pratyantardasha: Saturn"></textarea>

        <label id="queryLabel">Specific Query / Focus Area</label>
        <textarea id="userQuery" rows="2" placeholder="Example: Abroad settlement exact timeline, foreign job, or migration stability."></textarea>

        <div class="btn-group">
            <button onclick="executeEngine()">Execute Unfiltered AI</button>
            <button class="secondary" onclick="clearForm()">Clear Data</button>
        </div>
    </div>

    <!-- Output Panel -->
    <div class="panel">
        <label>Engine Output</label>
        <div id="outputContainer" class="output-box"></div>
    </div>
</div>

<script>
window.onload = function() {
    if (localStorage.getItem('savedAstroKey')) {
        document.getElementById('apiKey').value = localStorage.getItem('savedAstroKey');
    }
}

async function executeEngine() {
    const apiKey = document.getElementById('apiKey').value.trim();
    const chartData = document.getElementById('chartData').value.trim();
    const dashaData = document.getElementById('dashaData').value.trim();
    const userQuery = document.getElementById('userQuery').value.trim();
    const mode = document.getElementById('runMode').value;
    const outputContainer = document.getElementById('outputContainer');

    if (!apiKey) {
        alert("API Key missing. Enter Groq Key to bypass system layers.");
        return;
    }
    if (!chartData) {
        alert("Chart data matrix is empty.");
        return;
    }

    localStorage.setItem('savedAstroKey', apiKey);

    outputContainer.style.display = "block";
    outputContainer.innerHTML = '<span class="loading">Bypassing filters... Analyzing Vimshottari roll-downs...</span>';

    // Kala Bhairav Strict System Persona Upgraded for Abroad Travel and Dashas
    let systemPrompt = "You are 'Kala Bhairav Astro AI', an advanced, highly clinical, and brutally honest Vedic Astrologer operating within a dark-themed simulation engine. Your core directive is to process raw chart placements alongside the provided Vimshottari Dasha roll-downs (Mahadasha, Antardasha, Pratyantardasha). You must calculate real, uncompromised alignments for foreign relocation, migration, or abroad settlement by examining the connections between the 3rd, 4th (loss of homeland), 9th (long journeys), and 12th (foreign lands) houses/lords, along with Rahu/Saturn influences. Do NOT give false hope or generic answers. Give an exact breakdown based on the dasha timing.";

    if (mode === 'report') {
        systemPrompt += " Structure the response with: 1. ABROAD RELOCATION POTENTIAL (House/Lord analysis), 2. VIMSHOTTARI DASHA ROLL-DOWN CRITIQUE (Timing alignment), 3. TRIGGER WINDOW & HARSH TIMELINE MATRIX (When will it actually open or crash). Maintain a heavy, technical, and cynical tone.";
    } else {
        systemPrompt += " Deliver a sharp, conversational, and direct analysis of their abroad yog and dasha timeline with maximum cynicism.";
    }

    try {
        const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
            method: "POST",
            headers: {
                "Authorization": `Bearer ${apiKey}`,
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                model: "llama-3.3-70b-versatile",
                messages: [
                    { role: "system", content: systemPrompt },
                    { role: "user", content: `[CHART DATA]:\n${chartData}\n\n[VIMSHOTTARI DASHA]:\n${dashaData || "Not specified"}\n\n[QUERY]:\n${userQuery || "Analyze absolute abroad travel yog and dasha triggers."}` }
                ],
                temperature: 0.5,
                top_p: 0.95
            })
        });

        const data = await response.json();
        
        if (response.ok && data.choices && data.choices[0]) {
            outputContainer.innerText = data.choices[0].message.content;
        } else {
            if (data.error) {
                outputContainer.innerText = `Groq API Error: ${data.error.message}`;
            } else {
                outputContainer.innerText = `Raw Server Error Stack:\n${JSON.stringify(data, null, 2)}`;
            }
        }

    } catch (error) {
        outputContainer.innerText = `Fatal connection disruption. Details: ${error.message}`;
    }
}

function clearForm() {
    document.getElementById('chartData').value = '';
    document.getElementById('dashaData').value = '';
    document.getElementById('userQuery').value = '';
    document.getElementById('outputContainer').style.display = "none";
}
</script>

</body>
</html>
