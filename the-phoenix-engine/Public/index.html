<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE PHOENIX ENGINE</title>
    
    <style>
        body {
            background-color: #0a0a0a;
            color: #00ff41;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        #interface {
            width: 90%;
            max-width: 500px;
            background: #111;
            border: 1px solid #333;
            padding: 30px;
            box-shadow: 0 0 20px rgba(0, 255, 65, 0.2);
            text-align: center;
        }
        h1 { font-size: 1.5rem; margin-bottom: 20px; text-transform: uppercase; }
        textarea { width: 100%; height: 120px; background: #000; color: #00ff41; border: 1px solid #00ff41; padding: 10px; margin-bottom: 10px; box-sizing: border-box; resize: none; }
        button { background: #00ff41; color: #000; padding: 10px; border: none; font-weight: bold; cursor: pointer; width: 100%; text-transform: uppercase; }
        #output { margin-top: 20px; border-top: 1px solid #333; padding-top: 10px; text-align: left; }
    </style>
</head>
<body>
    <div id="interface">
        <h1>PHOENIX COMMAND</h1>
        <textarea id="userInput" placeholder="Enter tactical command..."></textarea>
        <button id="executeBtn">INITIALIZE</button>
        <div id="output"></div>
    </div>
    <script src="js/script.js"></script>
</body>
</html>
