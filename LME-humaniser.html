<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Humanizer Engine Pro 4.0</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f0f2f5; padding: 30px; }
        .container { max-width: 700px; background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        #output { white-space: pre-wrap; background: #212529; color: #f8f9fa; border-radius: 10px; min-height: 150px; padding: 20px; font-family: monospace; }
        #finalOutput { white-space: pre-wrap; background: #e9ecef; border-radius: 10px; min-height: 150px; padding: 20px; margin-top: 15px; border: 2px dashed #0d6efd; }
    </style>
</head>
<body>

<div class="container">
    <h4 class="text-center fw-bold mb-4">Humanizer Engine 4.0</h4>
    <input type="password" id="apiKey" class="form-control mb-3" placeholder="Enter API Key...">
    <textarea id="inputText" class="form-control mb-3" rows="5" placeholder="Paste your text here..."></textarea>
    <button class="btn btn-dark w-100 py-2" onclick="generateDraft()">Generate Draft</button>
    
    <label class="mt-4 fw-bold text-muted">Draft Output:</label>
    <div id="output" class="mt-2">Waiting for input...</div>
    
    <button id="impBtn" class="btn btn-primary w-100 py-2 mt-3 d-none" onclick="implementFinal()">Implement Final Version</button>
    
    <div id="finalOutput" class="d-none"></div>
</div>

<script>
    let currentDraft = "";
    const keyInput = document.getElementById('apiKey');

    async function generateDraft() {
        const text = document.getElementById('inputText').value;
        const out = document.getElementById('output');
        const impBtn = document.getElementById('impBtn');
        
        if(!keyInput.value) return alert("API Key daal bhai!");
        out.innerText = "Drafting chaos...";
        
        const res = await callAI(text, "You are a raw, chaotic writer. Write a short, punchy version of this text with aggressive fragments and no flow.");
        currentDraft = res;
        out.innerText = res;
        impBtn.classList.remove('d-none');
    }

    async function implementFinal() {
        const finalDiv = document.getElementById('finalOutput');
        finalDiv.classList.remove('d-none');
        finalDiv.innerText = "Applying Sandwich Strategy...";
        
        const finalRes = await callAI(currentDraft, `Apply the 'Sandwich Strategy':
            1. Start with 1-2 aggressive, short, punchy sentences.
            2. Middle section must be a flowing, human-style conversation with natural dashes (-) for pauses.
            3. End with 1-2 abrupt, fragmented sentences.
            4. Tone: Cynical, smart, and purely human.`);
        
        finalDiv.innerText = finalRes;
    }

    async function callAI(content, systemPrompt) {
        try {
            const res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                method: 'POST',
                headers: { 'Authorization': `Bearer ${keyInput.value}`, 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    model: "llama-3.3-70b-versatile",
                    temperature: 0.9,
                    messages: [{ role: "system", content: systemPrompt }, { role: "user", content: content }]
                })
            });
            const data = await res.json();
            return data.choices[0].message.content;
        } catch (e) { return "Error: " + e.message; }
    }
</script>
</body>
</html>
