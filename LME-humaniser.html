<!DOCTYPE html>
<html>
<head>
    <title>Quick Test</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-4">
    <div class="container" style="max-width: 600px;">
        <input type="password" id="apiKey" class="form-control mb-2" placeholder="API Key...">
        <textarea id="inputText" class="form-control mb-2" rows="4" placeholder="Kuch bhi likho..."></textarea>
        <button class="btn btn-primary w-100" onclick="testLlama()">Test Engine</button>
        <div id="out" class="mt-3 p-3 border bg-light" style="white-space: pre-wrap;"></div>
    </div>

    <script>
        async function testLlama() {
            const key = document.getElementById('apiKey').value;
            const input = document.getElementById('inputText').value;
            const out = document.getElementById('out');
            
            out.innerText = "Testing...";
            const res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                method: 'POST',
                headers: { 'Authorization': `Bearer ${key}`, 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    model: "llama-3.3-70b-versatile",
                    messages: [{ role: "user", content: input }]
                })
            });
            const data = await res.json();
            out.innerText = data.choices[0].message.content;
        }
    </script>
</body>
</html>
