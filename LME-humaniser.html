<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LM 6.0 Style-Match & Humaniser</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f7f6; padding: 20px; }
        .container { max-width: 800px; background: white; padding: 30px; border-radius: 15px; box-shadow: 0px 5px 15px rgba(0,0,0,0.1); }
        textarea { height: 120px; width: 100%; margin: 10px 0; padding: 12px; border-radius: 8px; border: 1px solid #ddd; font-size: 14px; }
        .api-box { background: #e9ecef; padding: 15px; border-radius: 8px; margin-bottom: 15px; }
    </style>
</head>
<body>

<div class="container my-4">
    <h2 class="text-center mb-4 fw-bold text-primary">LM 6.0 Style-Match & Humaniser</h2>
    
    <div class="api-box">
        <input type="password" id="apiKey" class="form-control" placeholder="Enter Groq API Key...">
    </div>

    <label class="fw-bold">1. Reference Style (Your Writing Cadence):</label>
    <textarea id="refText" placeholder="Paste your own written text here..."></textarea>

    <label class="fw-bold">2. Target Content (AI Text):</label>
    <textarea id="inputText" placeholder="Paste AI content here..."></textarea>
    
    <button id="humanizeBtn" class="btn btn-primary w-100 py-2" onclick="processContent()">Mirror & Humanise</button>

    <label class="fw-bold mt-3">Result:</label>
    <textarea id="outputText" readonly></textarea>
    
    <div class="text-center mt-2">
        <span id="scoreDisplay" class="fw-bold fs-4 text-success">Humanized AI Score: --%</span>
    </div>
</div>

<script>
    // Scoring logic
    const aiKeywords = ['delve', 'comprehensive', 'tapestry', 'testament', 'furthermore', 'in conclusion', 'harness', 'leverage'];
    function calculateScore(text) {
        let count = 0;
        aiKeywords.forEach(word => { if(text.toLowerCase().includes(word)) count += 15; });
        return Math.min(count, 99);
    }

    async function processContent() {
        const rawText = document.getElementById("inputText").value.trim();
        const refText = document.getElementById("refText").value.trim();
        const apiKey = document.getElementById("apiKey").value.trim();
        const btn = document.getElementById("humanizeBtn");

        if (!apiKey || !rawText || !refText) return alert("Bhai, saari fields fill kar!");

        btn.innerText = "Mirroring & Humanising...";
        btn.disabled = true;

        try {
            const response = await fetch('https://api.groq.com/openai/v1/chat/completions', {
                method: 'POST',
                headers: {
                    'Authorization': `Bearer ${apiKey}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    model: "llama-3.3-70b-versatile",
                    messages: [{ 
                        role: "user", 
                        content: `You are a professional ghostwriter. Rewrite the 'Target Content' exactly in the tone, style, and rhythm of the 'Reference Style'. \n\nReference Style: ${refText} \n\nTarget Content: ${rawText} \n\nRules: Output ONLY the rewritten text. NO intro, NO explanation.` 
                    }]
                })
            });

            const data = await response.json();
            const result = data.choices[0].message.content.trim();
            document.getElementById("outputText").value = result;
            
            // Score update
            const score = calculateScore(result);
            document.getElementById("scoreDisplay").innerText = `Humanized AI Score: ${score}%`;
            
        } catch (err) {
            alert("Error: " + err.message);
        } finally {
            btn.innerText = "Mirror & Humanise";
            btn.disabled = false;
        }
    }
</script>
</body>
</html>
