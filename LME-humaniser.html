<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Humanizer Engine Pro 3.0</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f0f2f5; padding: 30px; }
        .container { max-width: 700px; background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        #output { white-space: pre-wrap; background: #212529; color: #f8f9fa; border-radius: 10px; min-height: 200px; padding: 20px; font-family: monospace; }
    </style>
</head>
<body>

<div class="container">
    <h4 class="text-center fw-bold mb-4">Humanizer Engine 3.0 (Chaos Mode)</h4>
    <input type="password" id="apiKey" class="form-control mb-3" placeholder="Enter API Key...">
    <textarea id="inputText" class="form-control mb-3" rows="6" placeholder="Paste robotic text here..."></textarea>
    <button class="btn btn-danger w-100 py-2" onclick="humanizeText()">Trigger Chaos Humanization</button>
    
    <label class="mt-4 fw-bold text-muted">Raw Output:</label>
    <div id="output" class="mt-2">Output yahan aayega...</div>
</div>

<script>
    async function humanizeText() {
        const key = document.getElementById('apiKey').value;
        const text = document.getElementById('inputText').value;
        const out = document.getElementById('output');
        
        if(!key) return alert("API Key daal bhai!");
        out.innerText = "Triggering chaos logic...";
        
        try {
            const res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                method: 'POST',
                headers: { 'Authorization': `Bearer ${key}`, 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    model: "llama-3.3-70b-versatile",
                    temperature: 0.95,
                    frequency_penalty: 1.5,
                    presence_penalty: 1.0,
                    messages: [{ 
                        role: "system", 
                        content: `You are an erratic, disorganized human writer. RULES: 
                        1. ABOLISH all pleasant, helpful, or chatty filler phrases like "I was thinking," "Honestly," "It's pretty cool," or "you know."
                        2. Write like you are in a rush. Start sentences abruptly. 
                        3. Use weird, unconventional sentence structures. 
                        4. Insert sudden, jarring shifts in tone. 
                        5. No standard paragraph flow: One line could be extremely detailed, the next could be one word. 
                        6. NEVER use "So..." or "I guess" or "It's like" to start sentences.
                        7. BE AGGRESSIVE AND UNPREDICTABLE. Destroy the "helpful assistant" tone entirely.` 
                    }, { 
                        role: "user", 
                        content: text 
                    }]
                })
            });
            const data = await res.json();
            out.innerText = data.choices[0].message.content;
        } catch (e) { 
            out.innerText = "Error: " + e.message; 
        }
    }
</script>
</body>
</html>
