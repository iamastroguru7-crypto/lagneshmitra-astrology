<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Humanizer Engine Pro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f8f9fa; padding: 30px; }
        .container { max-width: 700px; background: white; padding: 30px; border-radius: 15px; box-shadow: 0 5px 20px rgba(0,0,0,0.1); }
        #output { white-space: pre-wrap; background: #f1f3f5; border-radius: 10px; min-height: 150px; }
    </style>
</head>
<body>

<div class="container">
    <h4 class="text-center fw-bold mb-4">Humanizer Engine</h4>
    <input type="password" id="apiKey" class="form-control mb-3" placeholder="Enter Groq API Key...">
    <textarea id="inputText" class="form-control mb-3" rows="6" placeholder="Paste your AI text here..."></textarea>
    <button class="btn btn-dark w-100 py-2" onclick="processText()">Make it Human</button>
    
    <label class="mt-4 fw-bold text-muted">Result:</label>
    <div id="output" class="mt-2 p-4 border">Output yahan aayega...</div>
</div>

<script>
    async function processText() {
        const key = document.getElementById('apiKey').value;
        const text = document.getElementById('inputText').value;
        const out = document.getElementById('output');
        
        if(!key) return alert("API Key toh daal de bhai!");
        out.innerText = "Working on it... humanizing your text...";
        
        try {
            const res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                method: 'POST',
                headers: { 'Authorization': `Bearer ${key}`, 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    model: "llama-3.3-70b-versatile",
                    messages: [{ 
                        role: "system", 
                        content: `Act as a thoughtful, engaging human writer. Rewrite the provided text to sound natural, relatable, and conversational. 
                        GUIDELINES:
                        1. Vary sentence structure: Mix short, punchy sentences with long, flowing ones.
                        2. Use everyday language: Avoid academic, clinical, or formal jargon.
                        3. Eliminate robotic transitions: NEVER use words like 'delve', 'moreover', 'in conclusion', 'tapestry', or 'testament'.
                        4. Keep it active: Use the active voice.
                        5. Natural pauses: Use dashes (-) instead of semicolons (;).` 
                    }, { 
                        role: "user", 
                        content: text 
                    }]
                })
            });
            const data = await res.json();
            out.innerText = data.choices[0].message.content;
        } catch (e) { 
            out.innerText = "Error: " + e.message; 
        }
    }
</script>
</body>
</html>
