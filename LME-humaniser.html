<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LM 4.0 Anti-Detection Engine</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f7f6; padding: 20px; }
        .container { max-width: 800px; background: white; padding: 30px; border-radius: 15px; box-shadow: 0px 5px 15px rgba(0,0,0,0.1); }
        textarea { height: 180px; width: 100%; margin: 10px 0; padding: 12px; border-radius: 8px; border: 1px solid #ddd; font-size: 15px; }
        .api-box { background: #e9ecef; padding: 15px; border-radius: 8px; margin-bottom: 15px; }
    </style>
</head>
<body>

<div class="container my-4">
    <h2 class="text-center mb-4 fw-bold text-primary">LM 4.0 Anti-Detection Engine</h2>
    
    <div class="api-box">
        <label class="form-label fw-bold">Groq API Key:</label>
        <input type="password" id="apiKey" class="form-control" placeholder="gsk_...">
    </div>

    <textarea id="inputText" placeholder="Paste your content here..."></textarea>
    
    <div class="my-3">
        <button id="humanizeBtn" class="btn btn-primary w-100 py-2" onclick="humanizeContent()">Humanise & De-Robotise</button>
    </div>

    <textarea id="outputText" readonly placeholder="Rewritten content will appear here..."></textarea>
    <button class="btn btn-success w-100 mt-2 py-2 fw-bold" onclick="exportText()">Export as .txt File</button>
</div>

<script>
    async function humanizeContent() {
        const rawText = document.getElementById("inputText").value.trim();
        const apiKey = document.getElementById("apiKey").value.trim();
        const humanizeBtn = document.getElementById("humanizeBtn");

        if (!apiKey) return alert("Bhai, API key toh daalo!");

        humanizeBtn.innerText = "Processing (Anti-Detection Mode)...";
        humanizeBtn.disabled = true;

        try {
            const response = await fetch('https://api.groq.com/openai/v1/chat/completions', {
                method: 'POST',
                headers: {
                    'Authorization': `Bearer ${apiKey}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    model: "llama-3.3-70b-versatile",
                    messages: [
                        { 
                            role: "system", 
                            content: "You are an expert ghostwriter. Rewrite the input text to sound like a human wrote it with high burstiness and perplexity. Rules: 1. Use a mix of very short and long, complex sentences. 2. Use conversational, punchy, and raw language. 3. Avoid all patterns typical of AI (no 'tapestry', 'delve', 'testament'). 4. Vary the structure of each sentence. 5. Output ONLY the rewritten text, nothing else." 
                        },
                        { 
                            role: "user", 
                            content: rawText 
                        }
                    ]
                })
            });

            const data = await response.json();

            if (data.choices) {
                document.getElementById("outputText").value = data.choices[0].message.content.trim();
            } else {
                alert("Error: Check your API Key or quota.");
            }
        } catch (err) {
            alert("Network Error: " + err.message);
        } finally {
            humanizeBtn.innerText = "Humanise & De-Robotise";
            humanizeBtn.disabled = false;
        }
    }

    function exportText() {
        const text = document.getElementById("outputText").value;
        if (!text) return alert("Kuch content generate hone do!");
        const blob = new Blob([text], { type: 'text/plain' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'humanised_content.txt';
        a.click();
    }
</script>
</body>
</html>
