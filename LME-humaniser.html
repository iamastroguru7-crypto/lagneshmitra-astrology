<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Text Humanizer</title>
    <style>
        :root {
            --bg-color: #f3f4f6;
            --container-bg: #ffffff;
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --border: #d1d5db;
            --text-main: #1f2937;
            --text-muted: #6b7280;
        }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            background-color: var(--container-bg);
            width: 100%;
            max-width: 800px;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        h1 {
            margin-top: 0;
            font-size: 1.5rem;
        }
        .text-group {
            margin-bottom: 16px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
        }
        textarea {
            width: 100%;
            height: 150px;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 6px;
            resize: vertical;
            font-size: 1rem;
            box-sizing: border-box;
        }
        textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
        }
        button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: var(--primary-hover);
        }
        .output-box {
            background-color: #f9fafb;
            border: 1px solid var(--border);
            padding: 16px;
            border-radius: 6px;
            min-height: 150px;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>AI Text Humanizer</h1>
    <p>Paste your AI-generated text below to remove robotic phrasing and improve conversational flow.</p>

    <div class="text-group">
        <label for="input-text">Input Text:</label>
        <textarea id="input-text" placeholder="e.g., In today's digital landscape, artificial intelligence has truly revolutionized how we delve into complex data..."></textarea>
    </div>

    <button onclick="humanizeText()">Humanize Text</button>

    <div class="text-group" style="margin-top: 24px;">
        <label for="output-text">Humanized Output:</label>
        <div class="output-box" id="output-text">Your humanized text will appear here...</div>
    </div>
</div>

<script>
    function humanizeText() {
        let text = document.getElementById('input-text').value;
        if (!text.trim()) {
            alert('Please enter some text to humanize.');
            return;
        }

        // Dictionary of common AI words and their human replacements
        const replacements = [
            { search: /\bdelve\b/gi, replace: 'explore' },
            { search: /\btapestry\b/gi, replace: 'variety' },
            { search: /\bnavigate\b/gi, replace: 'handle' },
            { search: /\btestament\b/gi, replace: 'proof' },
            { search: /\bbasically\b/gi, replace: '' },
            { search: /\btruly\b/gi, replace: '' },
            { search: /\bfurthermore\b/gi, replace: 'also' },
            { search: /\bmoreover\b/gi, replace: 'plus' },
            { search: /\bin conclusion\b/gi, replace: 'finally' },
            { search: /\bleverage\b/gi, replace: 'use' },
            { search: /\butilize\b/gi, replace: 'use' },
            { search: /\bmultifaceted\b/gi, replace: 'complex' },
            { search: /\bevidenced by\b/gi, replace: 'shown by' },
            { search: /\bdelves\b/gi, replace: 'explores' },
            { search: /\bbelow\b/gi, replace: 'under' },
            { search: /\bIn today's digital landscape\b/gi, replace: 'Today' },
            { search: /\bsignificantly\b/gi, replace: 'a lot' }
        ];

        // Apply replacements
        replacements.forEach(item => {
            text = text.replace(item.search, item.replace);
        });

        // Break down unnatural "-ly" adverbs where appropriate
        text = text.replace(/\bsignificantly\b/gi, 'greatly');
        text = text.replace(/\bcompletely\b/gi, 'totally');

        // Cleanup any double spaces caused by removing words
        text = text.replace(/\s+/g, ' ');

        document.getElementById('output-text').innerText = text.trim();
    }
</script>

</body>
</html>
