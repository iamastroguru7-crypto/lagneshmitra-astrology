<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LM 3.0 Humanizer Engine</title>
    <!-- Bootstrap CSS for modern UI -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f7f6; padding: 20px; }
        .container { max-width: 800px; background: white; padding: 30px; border-radius: 15px; box-shadow: 0px 5px 15px rgba(0,0,0,0.1); }
        textarea { height: 180px; width: 100%; margin: 10px 0; padding: 12px; border-radius: 8px; border: 1px solid #ddd; font-size: 15px; }
        .btn-custom { background: #007bff; color: white; }
        .api-box { background: #e9ecef; padding: 15px; border-radius: 8px; margin-bottom: 15px; }
    </style>
</head>
<body>

<div class="container my-4">
    <h2 class="text-center mb-4 fw-bold text-primary">LM 3.0 Humanizer Engine</h2>
    
    <!-- API Key Input Field -->
    <div class="api-box">
        <label for="apiKey" class="form-label fw-bold">GSK / Gemini API Key:</label>
        <input type="password" id="apiKey" class="form-control" placeholder="Enter your Gemini API Key here...">
    </div>

    <!-- Raw Input Textarea -->
    <textarea id="inputText" placeholder="Paste your AI content here..."></textarea>
    
    <!-- Controls Row -->
    <div class="d-flex justify-content-between align-items-center my-3">
        <span id="aiScore" class="fw-bold fs-5 text-danger">AI Score: --%</span>
        <div>
            <button class="btn btn-secondary me-2 px-4" onclick="analyzeText()">Analyze</button>
            <button id="humanizeBtn" class="btn btn-primary px-4" onclick="humanizeContent()" disabled>Humanise</button>
        </div>
    </div>

    <!-- Output Textarea -->
    <textarea id="outputText" readonly placeholder="100% Humanised content will appear here..."></textarea>
    
    <!-- Export Button -->
    <button class="btn btn-success w-100 mt-2 py-2 fw-bold" onclick="exportText()">Export as .txt File</button>
</div>

<script>
    // 1. Basic Local Pattern Analyzer for AI Content
    function analyzeText() {
        const text = document.getElementById("inputText").value.trim();
        if (!text) {
            alert("Bhai, pehle kuch text toh paste karo!");
            return;
        }
        
        // AI heavy buzzwords
        const aiIndicators = ['delve', 'comprehensive', 'furthermore', 'tapestry', 'in conclusion', 'testament', 'pivotal'];
        let count = 0;
        
        aiIndicators.forEach(word => { 
            if(text.toLowerCase().includes(word)) count += 25; 
        });
        
        // Agar koi indicator nahi mila toh default 65% dikhayega (AI base rate)
        if (count === 0) count = 65;
        
        document.getElementById("aiScore").innerText = `AI Score: ${Math.min(count, 99)}%`;
        document.getElementById("humanizeBtn").disabled = false;
    }

    // 2. Direct GSK API Integration via Frontend Fetch
    async function humanizeContent() {
        const rawText = document.getElementById("inputText").value.trim();
        const apiKey = document.getElementById("apiKey").value.trim();
        const humanizeBtn = document.getElementById("humanizeBtn");

        if (!apiKey) {
            alert("Bhai, pehle upar GSK API Key toh daalo!");
            return;
        }

        // Loading State Show karna
        humanizeBtn.innerText = "Processing Engine...";
        humanizeBtn.disabled = true;
        document.getElementById("outputText").value = "Rewriting your content to bypass all AI detectors... Please wait...";

        // The Ultimate Humanizer System Prompt
        const systemPrompt = `You are an expert editor who specializes in rewriting text to sound 100% human, natural, and engaging, while completely bypassing AI detectors. 
Rules for rewriting:
1. Vary sentence length drastically (mix short, punchy sentences with longer, flowing ones).
2. Use natural transitions and a highly engaging, conversational tone.
3. Completely remove robotic AI patterns and words (e.g., 'delve', 'comprehensive', 'furthermore', 'tapestry', 'in conclusion', 'moreover').
4. Inject emotional resonance and a professional yet deeply human personality.
5. Maintain the exact original meaning and data, just completely transform the structural style and phrase delivery.

Text to rewrite completely:
${rawText}`;

        try {
            // Hitting Google's official Generative Language API directly
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-pro:generateContent?key=${apiKey}`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    contents: [{
                        parts: [{ text: systemPrompt }]
                    }]
                })
            });

            const data = await response.json();
            
            // Parsing the Gemini REST response
            if (data.candidates && data.candidates[0].content.parts[0].text) {
                const finalOutput = data.candidates[0].content.parts[0].text;
                document.getElementById("outputText").value = finalOutput;
                document.getElementById("aiScore").innerText = "AI Score: 0% (Human Verified)";
                document.getElementById("aiScore").className = "fw-bold fs-5 text-success";
            } else {
                alert("API Response Error! Apni API key check karo ya Console dekho.");
                document.getElementById("outputText").value = "";
                console.log("Error Log:", data);
            }

        } catch (error) {
            console.error("Connection Error:", error);
            alert("Kuch network issue hai bhai! Console check karo.");
            document.getElementById("outputText").value = "";
        } finally {
            // Reset Button State
            humanizeBtn.innerText = "Humanise";
            humanizeBtn.disabled = false;
        }
    }

    // 3. Export to TXT File Function
    function exportText() {
        const text = document.getElementById("outputText").value;
        if (!text || text.startsWith("Rewriting")) {
            alert("Bhai, pehle content generate toh hone do!");
            return;
        }
        const blob = new Blob([text], { type: 'text/plain' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'lm_humanised_content.txt';
        a.click();
    }
</script>
</body>
</html>
