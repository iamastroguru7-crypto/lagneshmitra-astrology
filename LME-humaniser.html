<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LM 7.0 Ghostwriter Engine</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f7f6; padding: 20px; }
        .container { max-width: 800px; background: white; padding: 30px; border-radius: 15px; box-shadow: 0px 5px 15px rgba(0,0,0,0.1); }
        textarea { height: 120px; width: 100%; margin: 10px 0; padding: 12px; border-radius: 8px; border: 1px solid #ddd; font-size: 15px; }
    </style>
</head>
<body>

<div class="container my-4">
    <h2 class="text-center mb-4 fw-bold text-primary">LM 7.0 Ghostwriter</h2>
    <input type="password" id="apiKey" class="form-control mb-3" placeholder="Enter Groq API Key...">
    
    <label class="fw-bold">Reference (Your Style):</label>
    <textarea id="refText"></textarea>

    <label class="fw-bold">Target (AI Text):</label>
    <textarea id="inputText"></textarea>
    
    <button id="humanizeBtn" class="btn btn-primary w-100 py-2" onclick="processContent()">Generate Human Draft</button>

    <label class="fw-bold mt-3">Final Output:</label>
    <textarea id="outputText" readonly></textarea>
</div>

<script>
    async function processContent() {
        const rawText = document.getElementById("inputText").value.trim();
        const refText = document.getElementById("refText").value.trim();
        const apiKey = document.getElementById("apiKey").value.trim();
        const btn = document.getElementById("humanizeBtn");

        if (!apiKey || !rawText) return alert("Bhai, API Key aur Text daalo!");

        btn.innerText = "Ghostwriting...";
        btn.disabled = true;

        try {
            const response = await fetch('https://api.groq.com/openai/v1/chat/completions', {
                method: 'POST',
                headers: {
                    'Authorization': `Bearer ${apiKey}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    model: "llama-3.3-70b-versatile",
                    temperature: 0.85, // Yeh 'Chaos Factor' hai, output ko zyada random banayega
                    messages: [{ 
                        role: "user", 
                        content: `You are a human ghostwriter. Rewrite the 'Target Content' using the 'Reference Style'. 
                        CRITICAL RULES:
                        1. Use extreme burstiness (vary sentence length drastically).
                        2. Use occasional contractions (don't, it's, I'm) and informal transitions.
                        3. Avoid ALL perfect grammar patterns; make it sound like a person writing in a rush.
                        4. DO NOT use these words: 'tapestry', 'testament', 'delve', 'comprehensive', 'leverage'.
                        5. Output ONLY the rewritten text.
                        
                        Reference Style: ${refText}
                        Target Content: ${rawText}` 
                    }]
                })
            });

            const data = await response.json();
            document.getElementById("outputText").value = data.choices[0].message.content.trim();
        } catch (err) {
            alert("Error: " + err.message);
        } finally {
            btn.innerText = "Generate Human Draft";
            btn.disabled = false;
        }
    }
</script>
</body>
</html>
