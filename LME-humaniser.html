<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Humanizer Engine 4.5 - Pro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #121212; color: #e0e0e0; padding: 40px; }
        .container { max-width: 800px; background: #1e1e1e; padding: 30px; border-radius: 15px; border: 1px solid #333; }
        .form-control { background: #2a2a2a; border: 1px solid #444; color: white; }
        #output, #finalOutput { background: #000; padding: 20px; border-radius: 10px; border-left: 4px solid #0d6efd; margin-top: 10px; }
        .btn-custom { background: #0d6efd; color: white; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h3 class="text-center mb-4 text-white">Humanizer Engine 4.5</h3>
    <input type="password" id="apiKey" class="form-control mb-3" placeholder="API Key...">
    <textarea id="inputText" class="form-control mb-3" rows="5" placeholder="Input robotic text here..."></textarea>
    
    <button class="btn btn-secondary w-100 mb-2" onclick="generateDraft()">Phase 1: Generate Chaos Draft</button>
    <div id="output" class="d-none"></div>
    
    <button id="impBtn" class="btn btn-custom w-100 mt-3 d-none" onclick="implementFinal()">Phase 2: Final Human Polish (Sandwich)</button>
    <div id="finalOutput" class="d-none"></div>
</div>

<script>
    let currentDraft = "";
    
    // Logic Expansion: Advanced System Instructions
    const SYSTEM_DRAFT = "You are a raw, chaotic writer. Take the input, destroy its formal structure, and write a short, punchy, cynical version using broken syntax, sentence fragments, and intense vocabulary.";
    const SYSTEM_POLISH = `You are a human expert writer using the 'Sandwich Strategy'. 
    1. HOOK: Start with 1-2 sharp, aggressive, and short sentences that grab attention immediately.
    2. FLOW: The middle must be a natural, conversational bridge using dashes (-) for pauses and contractions. Keep it relatable.
    3. FINISH: End with 1-2 abrupt, fragmented, or cynical thoughts. 
    4. MANDATORY: Absolutely NO formal transitions like 'Furthermore' or 'In conclusion'.`;

    async function generateDraft() {
        const text = document.getElementById('inputText').value;
        const out = document.getElementById('output');
        if(!document.getElementById('apiKey').value) return alert("API Key!");
        
        out.classList.remove('d-none');
        out.innerText = "Drafting chaos...";
        
        const res = await callAI(text, SYSTEM_DRAFT);
        currentDraft = res;
        out.innerText = res;
        document.getElementById('impBtn').classList.remove('d-none');
    }

    async function implementFinal() {
        const finalDiv = document.getElementById('finalOutput');
        finalDiv.classList.remove('d-none');
        finalDiv.innerText = "Polishing text for final output...";
        
        const finalRes = await callAI(currentDraft, SYSTEM_POLISH);
        finalDiv.innerText = finalRes;
    }

    async function callAI(content, prompt) {
        try {
            const res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                method: 'POST',
                headers: { 
                    'Authorization': `Bearer ${document.getElementById('apiKey').value}`, 
                    'Content-Type': 'application/json' 
                },
                body: JSON.stringify({
                    model: "llama-3.3-70b-versatile",
                    temperature: 0.92,
                    frequency_penalty: 1.2,
                    messages: [{ role: "system", content: prompt }, { role: "user", content: content }]
                })
            });
            const data = await res.json();
            return data.choices[0].message.content;
        } catch (e) { return "Error: " + e.message; }
    }
</script>
</body>
</html>
