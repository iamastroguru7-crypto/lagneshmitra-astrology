<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LM 3.0 Humanizer Engine (Llama)</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
    <script>eruda.init();</script>
    <style>
        body { background-color: #f4f7f6; padding: 20px; }
        .container { max-width: 800px; background: white; padding: 30px; border-radius: 15px; box-shadow: 0px 5px 15px rgba(0,0,0,0.1); }
        textarea { height: 180px; width: 100%; margin: 10px 0; padding: 12px; border-radius: 8px; border: 1px solid #ddd; font-size: 15px; }
        .api-box { background: #e9ecef; padding: 15px; border-radius: 8px; margin-bottom: 15px; }
    </style>
</head>
<body>

<div class="container my-4">
    <h2 class="text-center mb-4 fw-bold text-primary">LM 3.0 Humanizer (Groq)</h2>
    
    <div class="api-box">
        <label class="form-label fw-bold">Groq API Key:</label>
        <input type="password" id="apiKey" class="form-control" placeholder="gsk_...">
    </div>

    <textarea id="inputText" placeholder="Paste your AI content here..."></textarea>
    
    <div class="d-flex justify-content-between align-items-center my-3">
        <span id="aiScore" class="fw-bold fs-5 text-danger">AI Score: --%</span>
        <div>
            <button class="btn btn-secondary me-2 px-4" onclick="analyzeText()">Analyze</button>
            <button id="humanizeBtn" class="btn btn-primary px-4" onclick="humanizeContent()" disabled>Humanise</button>
        </div>
    </div>

    <textarea id="outputText" readonly placeholder="Humanised content will appear here..."></textarea>
    <button class="btn btn-success w-100 mt-2 py-2 fw-bold" onclick="exportText()">Export as .txt File</button>
</div>

<script>
    function analyzeText() {
        const text = document.getElementById("inputText").value.trim();
        if (!text) return alert("Kuch text toh daalo!");
        const aiIndicators = ['delve', 'comprehensive', 'furthermore', 'tapestry', 'in conclusion', 'testament'];
        let count = 0;
        aiIndicators.forEach(word => { if(text.toLowerCase().includes(word)) count += 25; });
        document.getElementById("aiScore").innerText = `AI Score: ${Math.min(count, 99)}%`;
        document.getElementById("humanizeBtn").disabled = false;
    }

    async function humanizeContent() {
        const rawText = document.getElementById("inputText").value.trim();
        const apiKey = document.getElementById("apiKey").value.trim();
        const humanizeBtn = document.getElementById("humanizeBtn");

        if (!apiKey) return alert("Bhai, Groq API key toh daalo!");

        humanizeBtn.innerText = "Processing...";
        humanizeBtn.disabled = true;

        // Strict Prompt Engineering
        const systemPrompt = `Rewrite the text below. 
        Rules: 
        1. Output ONLY the rewritten text. 
        2. NO explanations, NO bullet points, NO intros, NO meta-commentary.
        3. Use a natural, conversational, and punchy human tone.
        4. Maintain exact original meaning.
        
        Text to rewrite: ${rawText}`;

        try {
            const response = await fetch('https://api.groq.com/openai/v1/chat/completions', {
                method: 'POST',
                headers: {
                    'Authorization': `Bearer ${apiKey}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    model: "llama-3.3-70b-versatile",
                    messages: [{ role: "user", content: systemPrompt }]
                })
            });

            const data = await response.json();

            if (data.error) {
                alert("Groq Error: " + data.error.message);
            } else if (data.choices) {
                document.getElementById("outputText").value = data.choices[0].message.content.trim();
                document.getElementById("aiScore").innerText = "AI Score: 0% (Humanized)";
            }
        } catch (err) {
            alert("Network Error: " + err.message);
        } finally {
            humanizeBtn.innerText = "Humanise";
            humanizeBtn.disabled = false;
        }
    }

    function exportText() {
        const text = document.getElementById("outputText").value;
        if (!text) return alert("Kuch content generate hone do!");
        const blob = new Blob([text], { type: 'text/plain' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'humanised_content.txt';
        a.click();
    }
</script>
</body>
</html>
