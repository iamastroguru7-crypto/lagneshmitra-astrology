<!DOCTYPE html>
<html>
<head>
    <title>Humanizer Lite</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-4 bg-light">
    <div class="container" style="max-width: 600px; background: #fff; padding: 20px; border-radius: 10px;">
        <input type="password" id="apiKey" class="form-control mb-3" placeholder="API Key...">
        <textarea id="aiText" class="form-control mb-3" rows="5" placeholder="AI text yahan paste karo..."></textarea>
        <button class="btn btn-dark w-100" onclick="humanise()">Make it Human (0%)</button>
        <div id="output" class="mt-3 p-3 border bg-light" style="white-space: pre-wrap; min-height: 100px;"></div>
    </div>

    <script>
        async function humanise() {
            const key = document.getElementById('apiKey').value;
            const text = document.getElementById('aiText').value;
            const out = document.getElementById('output');
            
            out.innerText = "Converting to human style...";
            
            const res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                method: 'POST',
                headers: { 'Authorization': `Bearer ${key}`, 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    model: "llama-3.3-70b-versatile",
                    messages: [{ 
                        role: "system", 
                        content: "Rewrite this input to sound 100% non ai, casual, use as I am addressing, councelling, make the sentense plural, conversational, and unpredictable. Use natural idioms and varying sentence lengths. No AI-sounding professional jargon." 
                    }, { role: "user", content: text }]
                })
            });
            const data = await res.json();
            out.innerText = data.choices[0].message.content;
        }
    </script>
</body>
</html>
